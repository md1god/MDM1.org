<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD1 Chat with ElevenLabs</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161920;
    --border: #262a33;
    --text: #e6e8eb;
    --muted: #8a8f98;
    --accent: #4f8cff;
    --user-bubble: #1f2937;
    --bot-bubble: #171b24;
    --error: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; background: var(--panel);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 32px; height: 32px; background: var(--accent); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 14px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .status { font-size: 12px; color: var(--muted); }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12px; transition: all 0.2s;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--accent); }
  .icon-btn.active { color: var(--accent); border-color: var(--accent); background: rgba(79,140,255,0.1); }

  #settingsPanel {
    display: none; padding: 16px 20px; background: var(--panel);
    border-bottom: 1px solid var(--border); gap: 12px; flex-direction: column;
  }
  #settingsPanel.open { display: flex; }
  #settingsPanel label { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  #settingsPanel input, #settingsPanel select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 8px 10px; border-radius: 6px; font-size: 13px; width: 100%;
  }
  #settingsPanel .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  #settingsPanel .field { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 4px; }
  #saveSettings {
    background: var(--accent); border: none; color: white;
    padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; width: fit-content;
  }

  #chatWindow {
    flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;
  }
  .msg-wrap { display: flex; flex-direction: column; max-width: 75%; }
  .msg-wrap.user { align-items: flex-end; align-self: flex-end; }
  .msg-wrap.bot, .msg-wrap.error { align-items: flex-start; align-self: flex-start; }
  .msg {
    padding: 10px 14px; border-radius: 10px; line-height: 1.6; font-size: 14px;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.user { background: var(--user-bubble); }
  .msg.bot { background: var(--bot-bubble); border: 1px solid var(--border); }
  .msg.error { background: rgba(255, 92, 92, 0.1); border: 1px solid var(--error); color: var(--error); }
  .msg.typing { align-self: flex-start; color: var(--muted); font-style: italic; background: none; }

  #inputBar {
    display: flex; gap: 8px; padding: 16px 20px;
    border-top: 1px solid var(--border); background: var(--panel); align-items: flex-end;
  }
  #userInput {
    flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 12px 14px; border-radius: 8px; font-size: 14px; resize: none; font-family: inherit;
  }
  #userInput:focus { outline: none; border-color: var(--accent); }
  #sendBtn {
    background: var(--accent); border: none; color: white; padding: 0 20px; height: 44px;
    border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; flex-shrink: 0;
  }
  #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">MD1</div>
    <div>
      <h1>MD1 Chat</h1>
      <div class="status" id="statusLine">جاهز للربط</div>
    </div>
  </div>
  <div class="header-actions">
    <button id="voiceBtn" class="icon-btn active" title="تشغيل/إيقاف الصوت">🔊 صوت ElevenLabs</button>
    <button id="settingsBtn" class="icon-btn">⚙ إعدادات المفاتيح</button>
  </div>
</header>

<div id="settingsPanel">
  <div class="row">
    <div class="field">
      <label>Groq API Key</label>
      <input type="text" id="groqKeyInput" placeholder="gsk_..." autocomplete="off">
    </div>
    <div class="field">
      <label>ElevenLabs API Key (xi-api-key)</label>
      <input type="text" id="elevenKeyInput" placeholder="sk_..." autocomplete="off">
    </div>
    <div class="field">
      <label>Voice ID (كود الصوت من القائمة)</label>
      <input type="text" id="voiceIdInput" placeholder="مثال: 21m00Tcm4TlvDq8ikWAM" autocomplete="off">
    </div>
  </div>
  <button id="saveSettings">حفظ الإعدادات</button>
</div>

<div id="chatWindow"></div>

<div id="inputBar">
  <textarea id="userInput" rows="1" placeholder="اكتب رسالتك هنا..."></textarea>
  <button id="sendBtn">إرسال</button>
</div>

<audio id="audioPlayer" style="display:none;"></audio>

<script>
  const chatWindow = document.getElementById('chatWindow');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  const groqKeyInput = document.getElementById('groqKeyInput');
  const elevenKeyInput = document.getElementById('elevenKeyInput');
  const voiceIdInput = document.getElementById('voiceIdInput');
  const saveSettings = document.getElementById('saveSettings');
  const statusLine = document.getElementById('statusLine');
  const voiceBtn = document.getElementById('voiceBtn');
  const audioPlayer = document.getElementById('audioPlayer');

  const SYSTEM_PROMPT = {
    role: 'system',
    content: `إنت مساعد ذكي وودود، بترد على الناس دايمًا باللهجة المصرية العامية وبأسلوب بسيط ومباشر من غير لف ودوران.`
  };

  let groqKey = localStorage.getItem('md1_groq_key') || '';
  let elevenKey = localStorage.getItem('md1_eleven_key') || '';
  let voiceId = localStorage.getItem('md1_voice_id') || '';
  let voiceEnabled = localStorage.getItem('md1_voice_active') !== 'false';
  let history = [];

  function updateStatus() {
    statusLine.textContent = (groqKey && elevenKey) ? 'متصل وجاهز للشات والصوت' : 'حط مفاتيح الـ API من الإعدادات فوق';
  }

  groqKeyInput.value = groqKey;
  elevenKeyInput.value = elevenKey;
  voiceIdInput.value = voiceId;
  updateStatus();

  voiceBtn.onclick = () => {
    voiceEnabled = !voiceEnabled;
    localStorage.setItem('md1_voice_active', voiceEnabled);
    voiceBtn.classList.toggle('active', voiceEnabled);
    voiceBtn.textContent = voiceEnabled ? '🔊 صوت ElevenLabs' : '🔇 الصوت مقفول';
  };

  settingsBtn.onclick = () => settingsPanel.classList.toggle('open');

  saveSettings.onclick = () => {
    groqKey = groqKeyInput.value.trim();
    elevenKey = elevenKeyInput.value.trim();
    voiceId = voiceIdInput.value.trim();
    localStorage.setItem('md1_groq_key', groqKey);
    localStorage.setItem('md1_eleven_key', elevenKey);
    localStorage.setItem('md1_voice_id', voiceId);
    updateStatus();
    settingsPanel.classList.remove('open');
  };

  function addMessage(text, cls) {
    const wrap = document.createElement('div');
    wrap.className = 'msg-wrap ' + cls;
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    wrap.appendChild(div);
    chatWindow.appendChild(wrap);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return { wrap };
  }

  async function playElevenLabsAudio(text) {
    if (!voiceEnabled || !elevenKey || !voiceId) return;
    try {
      const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'xi-api-key': elevenKey
        },
        body: JSON.stringify({
          text: text,
          model_id: 'eleven_multilingual_v2',
          voice_settings: { stability: 0.5, similarity_boost: 0.75 }
        })
      });

      if (!res.ok) {
        const errJson = await res.json();
        console.error("ElevenLabs Error:", errJson);
        return;
      }

      const blob = await res.blob();
      audioPlayer.src = URL.createObjectURL(blob);
      audioPlayer.play();
    } catch (e) {
      console.error("Audio playback failed:", e);
    }
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;
    if (!groqKey) {
      addMessage('حط مفتاح الـ Groq الأول من الإعدادات فوق', 'error');
      return;
    }

    addMessage(text, 'user');
    history.push({ role: 'user', content: text });
    userInput.value = '';
    userInput.style.height = 'auto';
    sendBtn.disabled = true;

    const typing = addMessage('بيكتب...', 'typing');

    try {
      const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + groqKey
        },
        body: JSON.stringify({
          model: 'llama-3.3-70b-versatile',
          messages: [SYSTEM_PROMPT, ...history],
          temperature: 0.7,
          max_tokens: 1500
        })
      });

      typing.wrap.remove();

      if (!response.ok) {
        const errText = await response.text();
        addMessage('خطأ في الـ Groq: ' + errText, 'error');
        sendBtn.disabled = false;
        return;
      }

      const data = await response.json();
      const reply = data.choices?.[0]?.message?.content || 'مفيش رد';
      addMessage(reply, 'bot');
      history.push({ role: 'assistant', content: reply });

      // تشغيل صوت ElevenLabs بالـ ID اللي جبته
      playElevenLabsAudio(reply);

    } catch (err) {
      typing.wrap.remove();
      addMessage('فشل الاتصال: ' + err.message, 'error');
    }

    sendBtn.disabled = false;
    userInput.focus();
  }

  sendBtn.onclick = sendMessage;
  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 150) + 'px';
  });
</script>

</body>
</html>
