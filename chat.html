<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD1 Chat</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161920;
    --border: #262a33;
    --text: #e6e8eb;
    --muted: #8a8f98;
    --accent: #4f8cff;
    --user-bubble: #1f2937;
    --bot-bubble: #171b24;
    --reasoning-bubble: #12151c;
    --error: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; background: var(--panel);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 32px; height: 32px; background: var(--accent); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 14px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .status { font-size: 12px; color: var(--muted); }
  .icon-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12px; transition: all 0.2s;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--accent); }

  .marquee-bar {
    background: linear-gradient(90deg, rgba(79,140,255,0.15), rgba(79,140,255,0.05));
    border-bottom: 1px solid var(--border); padding: 6px 0; font-size: 13px; color: var(--accent);
    overflow: hidden; white-space: nowrap;
  }
  .marquee-track {
    display: inline-block; padding-left: 100%; direction: ltr; animation: marquee-scroll 18s linear infinite;
  }
  .marquee-track span { font-weight: 600; }
  .marquee-track a { color: var(--accent); text-decoration: underline; font-weight: 700; }
  @keyframes marquee-scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

  #settingsPanel {
    display: none; padding: 16px 20px; background: var(--panel);
    border-bottom: 1px solid var(--border); gap: 12px; flex-direction: column;
  }
  #settingsPanel.open { display: flex; }
  #settingsPanel .section-label {
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 4px; border-top: 1px solid var(--border); padding-top: 10px;
  }
  #settingsPanel .section-label:first-child { border-top: none; padding-top: 0; margin-top: 0; }
  #settingsPanel label {
    font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center;
  }
  #settingsPanel label a { color: var(--accent); text-decoration: none; font-size: 11px; }
  #settingsPanel input, #settingsPanel select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 8px 10px; border-radius: 6px; font-size: 13px; width: 100%;
  }
  #settingsPanel .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  #settingsPanel .field { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 4px; }
  .key-input-wrap { position: relative; display: flex; align-items: center; }
  .key-input-wrap input { padding-left: 36px; font-family: monospace; direction: ltr; text-align: left; }
  .key-toggle-eye {
    position: absolute; left: 6px; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 4px;
  }
  .key-len { font-size: 10px; color: var(--muted); margin-top: 2px; direction: ltr; text-align: left; }
  .key-len.ok { color: #4ade80; }
  .security-warning {
    font-size: 11.5px; color: var(--error); background: rgba(255,92,92,0.08);
    border: 1px solid rgba(255,92,92,0.35); border-radius: 6px; padding: 8px 10px; line-height: 1.6;
  }
  #saveSettings {
    background: var(--accent); border: none; color: white; padding: 8px 16px;
    border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; align-self: flex-start;
  }

  #chatWindow {
    flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;
  }
  .msg-wrap { display: flex; flex-direction: column; max-width: 75%; }
  .msg-wrap.user { align-items: flex-end; align-self: flex-end; }
  .msg-wrap.bot, .msg-wrap.error, .msg-wrap.loading { align-items: flex-start; align-self: flex-start; }
  .msg {
    padding: 10px 14px; border-radius: 10px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.user { background: var(--user-bubble); }
  .msg.bot { background: var(--bot-bubble); border: 1px solid var(--border); }
  .msg.loading { background: rgba(79, 140, 255, 0.1); border: 1px dashed var(--accent); color: var(--accent); font-size: 13px; }
  .msg.error { background: rgba(255, 92, 92, 0.12); border: 1px solid var(--error); color: var(--error); font-size: 13.5px; }
  .msg img, .msg video { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; }

  .image-preview-container {
    padding: 10px 20px; display: flex; align-items: center; gap: 10px; background: var(--panel);
    flex-wrap: wrap; max-height: 140px; overflow-y: auto; border-top: 1px solid var(--border);
  }
  .image-preview-box { position: relative; display: inline-block; flex-shrink: 0; }
  .image-preview-box img { width: 55px; height: 55px; object-fit: cover; border-radius: 6px; border: 1px solid var(--accent); }
  .remove-img-btn {
    position: absolute; top: -6px; right: -6px; background: var(--error); color: white;
    border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  #inputBar {
    display: flex; gap: 8px; padding: 16px 20px; border-top: 1px solid var(--border); background: var(--panel); align-items: flex-end;
  }
  #userInput {
    flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 12px 14px; border-radius: 8px; font-size: 14px; resize: none; font-family: inherit;
  }
  #userInput:focus { outline: none; border-color: var(--accent); }
  .action-icon-btn {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    width: 44px; height: 44px; border-radius: 8px; cursor: pointer; font-size: 18px;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
  }
  .action-icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  #sendBtn {
    background: var(--accent); border: none; color: white; padding: 0 20px; height: 44px;
    border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; flex-shrink: 0;
  }
  #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">MD1</div>
    <div>
      <h1>MD1 Chat</h1>
      <div class="status" id="statusLine">مش متصل — افتح الإعدادات وحط الـ API key</div>
    </div>
  </div>
  <div class="header-actions">
    <button id="settingsBtn" class="icon-btn">⚙ الإعدادات</button>
  </div>
</header>

<div class="marquee-bar">
  <div class="marquee-track">
    <span>شات ذكي مدعوم بنماذج Groq مع إمكانية رفع صور متعددة وتوليد فيديو ⚡</span>
    <a href="https://console.groq.com/keys" target="_blank">احصل على مفتاحك الآن ↗</a>
  </div>
</div>

<div id="settingsPanel">
  <div class="section-label">إعدادات النظام والذكاء الاصطناعي</div>
  <div class="security-warning">⚠ المفتاح يتخزين محليًا في متصفحك (localStorage) فقط.</div>
  <div class="row">
    <div class="field">
      <label>Groq API Key <a href="https://console.groq.com/keys" target="_blank">احصل على مفتاح مجاني ↗</a></label>
      <div class="key-input-wrap">
        <button type="button" class="key-toggle-eye" data-target="apiKeyInput">👁</button>
        <input type="password" id="apiKeyInput" placeholder="gsk_..." autocomplete="off" spellcheck="false">
      </div>
      <div class="key-len" id="groqKeyLen"></div>
    </div>
    <div class="field">
      <label>رابط API توليد الفيديو (Backend)</label>
      <input type="text" id="videoApiInput" placeholder="https://xxxx.gradio.live أو http://localhost:8000" autocomplete="off">
    </div>
    <div class="field">
      <label>اختر النموذج الذكي</label>
      <select id="modelSelect">
        <option value="llama-3.3-70b-versatile">Llama 3.3 70B (قوي ودقيق)</option>
        <option value="llama-3.1-8b-instant">Llama 3.1 8B (فائق السرعة)</option>
        <option value="openai/gpt-oss-120b">GPT-OSS 120B (تفكير متقدم)</option>
      </select>
    </div>
  </div>
  <button id="saveSettings">حفظ الإعدادات</button>
</div>

<div id="chatWindow"></div>
<div id="imagePreviewContainer" class="image-preview-container" style="display: none;"></div>

<div id="inputBar">
  <button id="micBtn" class="action-icon-btn" title="تسجيل صوتي">🎤</button>
  <input type="file" id="imageUploadInput" accept="image/*" multiple style="display: none;">
  <button id="uploadImgBtn" class="action-icon-btn" title="رفع صور">📷</button>
  <textarea id="userInput" rows="1" placeholder="اكتب رسالتك أو ارفع صوراً..."></textarea>
  <button id="sendBtn">إرسال</button>
</div>

<script>
  const chatWindow = document.getElementById('chatWindow');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const uploadImgBtn = document.getElementById('uploadImgBtn');
  const imageUploadInput = document.getElementById('imageUploadInput');
  const imagePreviewContainer = document.getElementById('imagePreviewContainer');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  const apiKeyInput = document.getElementById('apiKeyInput');
  const videoApiInput = document.getElementById('videoApiInput');
  const modelSelect = document.getElementById('modelSelect');
  const saveSettings = document.getElementById('saveSettings');
  const statusLine = document.getElementById('statusLine');
  const groqKeyLen = document.getElementById('groqKeyLen');
  const keyToggleEye = document.querySelector('.key-toggle-eye');

  let attachedImagesBase64 = [];
  let apiKey = localStorage.getItem('md1_groq_key') || '';
  let videoApiUrl = localStorage.getItem('md1_video_api') || '';
  let model = localStorage.getItem('md1_groq_model') || 'llama-3.3-70b-versatile';
  let history = [];

  function cleanKey(v) { return v.replace(/[\u200B-\u200D\uFEFF\s]/g, ''); }
  
  function updateKeyLenInfo(val) {
    const len = val.length;
    if (len === 0) {
      groqKeyLen.textContent = '';
      groqKeyLen.className = 'key-len';
    } else {
      groqKeyLen.textContent = `الطول: ${len} حرف — يبدأ بـ ${val.substring(0, 6)}...`;
      groqKeyLen.className = len > 50 ? 'key-len ok' : 'key-len';
    }
  }

  function updateStatus() { 
    statusLine.textContent = apiKey ? `متصل — ${model}` : 'مش متصل — حط الـ API key من الإعدادات'; 
  }

  apiKeyInput.value = apiKey;
  videoApiInput.value = videoApiUrl;
  modelSelect.value = model;
  updateKeyLenInfo(apiKey);
  updateStatus();

  apiKeyInput.oninput = (e) => updateKeyLenInfo(e.target.value);

  keyToggleEye.onclick = () => {
    if (apiKeyInput.type === 'password') {
      apiKeyInput.type = 'text';
      keyToggleEye.textContent = '🙈';
    } else {
      apiKeyInput.type = 'password';
      keyToggleEye.textContent = '👁';
    }
  };

  settingsBtn.onclick = () => settingsPanel.classList.toggle('open');
  
  saveSettings.onclick = () => {
    apiKey = cleanKey(apiKeyInput.value);
    videoApiUrl = videoApiInput.value.trim();
    model = modelSelect.value;
    localStorage.setItem('md1_groq_key', apiKey);
    localStorage.setItem('md1_video_api', videoApiUrl);
    localStorage.setItem('md1_groq_model', model);
    updateKeyLenInfo(apiKey);
    updateStatus();
    settingsPanel.classList.remove('open');
  };

  uploadImgBtn.onclick = () => imageUploadInput.click();
  
  imageUploadInput.onchange = (e) => {
    Array.from(e.target.files).forEach(file => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        attachedImagesBase64.push(ev.target.result);
        renderPreviews();
      };
      reader.readAsDataURL(file);
    });
  };

  function renderPreviews() {
    imagePreviewContainer.innerHTML = '';
    if (attachedImagesBase64.length === 0) {
      imagePreviewContainer.style.display = 'none';
      return;
    }
    imagePreviewContainer.style.display = 'flex';
    attachedImagesBase64.forEach((img, idx) => {
      const box = document.createElement('div');
      box.className = 'image-preview-box';
      box.innerHTML = `<img src="${img}"><button type="button" class="remove-img-btn">✕</button>`;
      box.querySelector('button').onclick = () => {
        attachedImagesBase64.splice(idx, 1);
        renderPreviews();
      };
      imagePreviewContainer.appendChild(box);
    });
  }

  function addMessage(content, cls, isHtml = false) {
    const wrap = document.createElement('div');
    wrap.className = 'msg-wrap ' + cls;
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    if (isHtml) div.innerHTML = content; else div.textContent = content;
    wrap.appendChild(div);
    chatWindow.appendChild(wrap);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return { wrap, div };
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    
    // حالة إرسال صور لتوليد فيديو
    if (attachedImagesBase64.length > 0) {
      let imgs = [...attachedImagesBase64];
      let htmlTag = imgs.map(i => `<img src="${i}">`).join('');
      addMessage(text ? `${text}<br>${htmlTag}` : htmlTag, 'user', true);
      
      attachedImagesBase64 = [];
      imagePreviewContainer.style.display = 'none';
      userInput.value = '';
      
      if (!videoApiUrl) {
        addMessage('⚠ يرجى ضبط رابط API الفيديو (Backend) من الإعدادات أولاً.', 'error');
        return;
      }
      
      const statusMsg = addMessage('⏳ جاري إرسال الصور وبدء توليد الفيديو (قد يستغرق دقائق)...', 'loading');
      
      try {
        const res = await fetch(videoApiUrl, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'ngrok-skip-browser-warning': '69420'
          },
          body: JSON.stringify({ images: imgs, prompt: text || "Animate images" })
        });
        
        statusMsg.wrap.remove();

        const contentType = res.headers.get("content-type");
        if (!contentType || !contentType.includes("application/json")) {
          const rawText = await res.text();
          throw new Error(`السيرفر لم يعيد JSON صحيح (ربما صفحة تحذير Ngrok أو خطأ 500). الاستجابة: ${rawText.substring(0, 100)}...`);
        }

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || data.error || `خطأ من السيرفر برمز: ${res.status}`);
        }

        if (data.video_url || data.url) {
          const vUrl = data.video_url || data.url;
          addMessage(`✅ تم توليد الفيديو بنجاح:<br><video controls autoplay loop width="100%"><source src="${vUrl}" type="video/mp4"></video>`, 'bot', true);
        } else {
          throw new Error('فشل السيرفر في إرجاع رابط الفيديو المطلوب.');
        }
      } catch (err) {
        statusMsg.wrap.remove();
        addMessage(`❌ خطأ أثناء توليد الفيديو: ${err.message}`, 'error');
      }
      return;
    }

    // حالة الشات النصي العادي مع Groq
    if (!text) return;
    if (!apiKey) {
      addMessage('⚠ يرجى إدخال Groq API key الخاص بك من قائمة الإعدادات.', 'error');
      return;
    }

    addMessage(text, 'user');
    history.push({ role: 'user', content: text });
    userInput.value = '';
    sendBtn.disabled = true;

    const statusMsg = addMessage('جاري الرد...', 'loading');
    try {
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
        body: JSON.stringify({
          model: model,
          messages: [{ role: 'system', content: 'إنت مساعد ذكي وودود باللهجة المصرية.' }, ...history],
          temperature: 0.7
        })
      });
      statusMsg.wrap.remove();
      
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.error?.message || `خطأ من Groq API برمز: ${res.status}`);
      }

      const data = await res.json();
      const reply = data.choices?.[0]?.message?.content || 'مفيش رد';
      addMessage(reply, 'bot');
      history.push({ role: 'assistant', content: reply });
    } catch (err) {
      statusMsg.wrap.remove();
      addMessage(`❌ خطأ في الاتصال: ${err.message}`, 'error');
    }
    sendBtn.disabled = false;
  }

  sendBtn.onclick = sendMessage;
  userInput.onkeydown = (e) => { 
    if (e.key === 'Enter' && !e.shiftKey) { 
      e.preventDefault(); 
      sendMessage(); 
    } 
  };
</script>

</body>
</html>
