<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD1 Chat</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161920;
    --border: #262a33;
    --text: #e6e8eb;
    --muted: #8a8f98;
    --accent: #4f8cff;
    --user-bubble: #1f2937;
    --bot-bubble: #171b24;
    --error: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 32px; height: 32px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; color: white; font-size: 14px;
    overflow: hidden;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .status { font-size: 12px; color: var(--muted); }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12px;
    transition: all 0.2s;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--accent); }
  .icon-btn.active { color: var(--accent); border-color: var(--accent); background: rgba(79,140,255,0.1); }

  .marquee-bar {
    background: linear-gradient(90deg, rgba(79,140,255,0.15), rgba(79,140,255,0.05));
    border-bottom: 1px solid var(--border);
    padding: 6px 0; font-size: 13px; color: var(--accent);
    white-space: nowrap; overflow: hidden;
  }
  .marquee-bar marquee { font-weight: 600; }
  .marquee-bar a { color: var(--accent); text-decoration: underline; font-weight: 700; }

  #settingsPanel {
    display: none; padding: 16px 20px; background: var(--panel);
    border-bottom: 1px solid var(--border); gap: 12px; flex-direction: column;
  }
  #settingsPanel.open { display: flex; }
  #settingsPanel .section-label {
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 4px; border-top: 1px solid var(--border); padding-top: 10px;
  }
  #settingsPanel .section-label:first-child { border-top: none; padding-top: 0; margin-top: 0; }
  #settingsPanel label {
    font-size: 12px; color: var(--muted);
    display: flex; justify-content: space-between; align-items: center;
  }
  #settingsPanel label a { color: var(--accent); text-decoration: none; font-size: 11px; }
  #settingsPanel label a:hover { text-decoration: underline; }
  #settingsPanel input, #settingsPanel select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 8px 10px; border-radius: 6px; font-size: 13px;
  }
  #settingsPanel .row { display: flex; gap: 10px; flex-wrap: wrap; }
  #settingsPanel .field { flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 4px; }
  optgroup { color: var(--muted); font-style: normal; }
  #saveSettings {
    align-self: flex-start; background: var(--accent); border: none; color: white;
    padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  #saveSettings:hover { opacity: 0.9; }
  .hint { font-size: 11px; color: var(--muted); }

  #chatWindow {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg-wrap { display: flex; flex-direction: column; max-width: 75%; }
  .msg-wrap.user { align-items: flex-end; align-self: flex-end; }
  .msg-wrap.bot, .msg-wrap.error { align-items: flex-start; align-self: flex-start; }
  .msg {
    padding: 10px 14px; border-radius: 10px; line-height: 1.6; font-size: 14px;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.user { background: var(--user-bubble); }
  .msg.bot { background: var(--bot-bubble); border: 1px solid var(--border); }
  .msg.error {
    background: rgba(255, 92, 92, 0.1); border: 1px solid var(--error); color: var(--error);
  }
  .msg.typing { align-self: flex-start; color: var(--muted); font-style: italic; background: none; }

  #inputBar {
    display: flex; gap: 10px; padding: 16px 20px;
    border-top: 1px solid var(--border); background: var(--panel);
    align-items: flex-end;
  }
  #userInput {
    flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 12px 14px; border-radius: 8px; font-size: 14px; resize: none; font-family: inherit;
  }
  #userInput:focus { outline: none; border-color: var(--accent); }
  #sendBtn {
    background: var(--accent); border: none; color: white; padding: 0 20px; height: 44px;
    border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; flex-shrink: 0;
  }
  #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">MD1</div>
    <div>
      <h1>MD1 Chat</h1>
      <div class="status" id="statusLine">مش متصل — افتح الإعدادات وحط الـ API key</div>
    </div>
  </div>
  <div class="header-actions">
    <button id="voiceBtn" class="icon-btn" title="تشغيل/إيقاف قراءة الردود صوتيًا">🔊 الصوت</button>
    <button id="settingsBtn" class="icon-btn">⚙ الإعدادات</button>
  </div>
</header>

<div class="marquee-bar">
  <marquee scrollamount="5">
    اضغط هنا واحصل على مفتاح مجاني لتشغيل الشات ⚡
    <a href="https://console.groq.com/keys" target="_blank">احصل على مفتاحك الآن ↗</a>
  </marquee>
</div>

<div id="settingsPanel">
  <div class="section-label">الذكاء الاصطناعي (Groq)</div>
  <div class="row">
    <div class="field">
      <label>
        Groq API Key
        <a href="https://console.groq.com/keys" target="_blank">احصل على مفتاح مجاني من هنا ↗</a>
      </label>
      <input type="password" id="apiKeyInput" placeholder="gsk_...">
    </div>
    <div class="field">
      <label>اختر النموذج الذكي</label>
      <select id="modelSelect">
        <optgroup label="نماذج مستقرة (Production)">
          <option value="llama-3.3-70b-versatile">Llama 3.3 70B (الأقوى والأدق)</option>
          <option value="llama-3.1-8b-instant">Llama 3.1 8B (فائق السرعة)</option>
          <option value="openai/gpt-oss-120b">GPT-OSS 120B (قوي جدًا وشامل)</option>
          <option value="openai/gpt-oss-20b">GPT-OSS 20B (أخف وأسرع)</option>
        </optgroup>
        <optgroup label="أنظمة بحث تلقائي (Compound)">
          <option value="groq/compound">Compound (بيدور في الإنترنت ويكتب كود تلقائي)</option>
          <option value="groq/compound-mini">Compound Mini (نسخة أخف وأسرع)</option>
        </optgroup>
        <optgroup label="تجريبي — ممكن يتوقف فجأة (Preview)">
          <option value="qwen/qwen3.6-27b">Qwen3.6 27B (تفكير عميق)</option>
          <option value="openai/gpt-oss-safeguard-20b">GPT-OSS Safeguard 20B (مراقبة محتوى)</option>
        </optgroup>
      </select>
    </div>
  </div>

  <div class="section-label">الصوت (ElevenLabs)</div>
  <div class="row">
    <div class="field">
      <label>
        ElevenLabs API Key
        <a href="https://elevenlabs.io/app/settings/api-keys" target="_blank">من هنا ↗</a>
      </label>
      <input type="password" id="elevenKeyInput" placeholder="xi_...">
    </div>
    <div class="field">
      <label>
        الصوت
        <a href="https://elevenlabs.io/app/voice-library" target="_blank">مكتبة الأصوات ↗</a>
      </label>
      <select id="voiceSelect">
        <option value="">حط المفتاح واحفظ عشان الأصوات تظهر</option>
      </select>
    </div>
  </div>
  <div class="hint">دور في مكتبة الأصوات على صوت عربي/مصري وحطه في "My Voices"، وهيظهر هنا تلقائي بعد الحفظ.</div>

  <button id="saveSettings">حفظ الإعدادات</button>
</div>

<div id="chatWindow"></div>

<div id="inputBar">
  <textarea id="userInput" rows="1" placeholder="اكتب رسالتك هنا..."></textarea>
  <button id="sendBtn">إرسال</button>
</div>

<script>
  const chatWindow = document.getElementById('chatWindow');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  const apiKeyInput = document.getElementById('apiKeyInput');
  const modelSelect = document.getElementById('modelSelect');
  const elevenKeyInput = document.getElementById('elevenKeyInput');
  const voiceSelect = document.getElementById('voiceSelect');
  const saveSettings = document.getElementById('saveSettings');
  const statusLine = document.getElementById('statusLine');
  const voiceBtn = document.getElementById('voiceBtn');

  // موديل عام مش مربوط بأي موقع أو مشروع معين — مجرد مساعد بيرد باللهجة المصرية
  const SYSTEM_PROMPT = {
    role: 'system',
    content: `إنت مساعد ذكي وودود، بترد على الناس دايمًا باللهجة المصرية العامية (مش فصحى خالص)، بأسلوب طبيعي وبسيط زي ما الناس بتتكلم في الشارع أو مع صحابهم.
جاوب بإيجاز ووضوح على أي سؤال بيتسأل لك، أيًا كان موضوعه. لو السؤال تقني، اشرحه ببساطة من غير تعقيد.
متفتكرش إنك موظف عند حد أو تابع لأي شركة أو موقع معين — إنت مساعد عام بس.`
  };

  let apiKey = localStorage.getItem('md1_groq_key') || '';
  let model = localStorage.getItem('md1_groq_model') || 'llama-3.3-70b-versatile';
  let elevenKey = localStorage.getItem('md1_eleven_key') || '';
  let voiceId = localStorage.getItem('md1_voice_id') || '';
  let voiceEnabled = localStorage.getItem('md1_voice_enabled') === 'true';
  let history = [];
  let currentAudio = null;

  function updateStatus() {
    statusLine.textContent = apiKey ? `متصل — ${model}` : 'مش متصل — افتح الإعدادات وحط الـ API key';
  }

  function updateVoiceBtn() {
    voiceBtn.classList.toggle('active', voiceEnabled);
    voiceBtn.textContent = voiceEnabled ? '🔊 الصوت شغال' : '🔇 الصوت مقفول';
  }

  // بيجيب كل الأصوات المتاحة في حساب ElevenLabs بتاعك ويعبي القايمة
  async function loadVoices() {
    if (!elevenKey) {
      voiceSelect.innerHTML = '<option value="">حط المفتاح واحفظ عشان الأصوات تظهر</option>';
      return;
    }
    voiceSelect.innerHTML = '<option value="">بيحمل الأصوات...</option>';
    try {
      const res = await fetch('https://api.elevenlabs.io/v1/voices', {
        headers: { 'xi-api-key': elevenKey }
      });
      if (!res.ok) throw new Error('تعذر جلب الأصوات (' + res.status + ')');
      const data = await res.json();
      const voices = data.voices || [];
      if (!voices.length) {
        voiceSelect.innerHTML = '<option value="">مفيش أصوات مضافة — روح مكتبة الأصوات وضيف واحد</option>';
        return;
      }
      voiceSelect.innerHTML = '';
      voices.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.voice_id;
        opt.textContent = v.name + (v.labels?.accent ? ' — ' + v.labels.accent : '');
        voiceSelect.appendChild(opt);
      });
      if (voiceId && voices.some(v => v.voice_id === voiceId)) {
        voiceSelect.value = voiceId;
      } else {
        voiceId = voiceSelect.value;
        localStorage.setItem('md1_voice_id', voiceId);
      }
    } catch (err) {
      voiceSelect.innerHTML = '<option value="">خطأ: ' + err.message + '</option>';
    }
  }

  async function speak(text) {
    if (!voiceEnabled) return;
    if (!elevenKey || !voiceId) {
      addMessage('لتشغيل الصوت لازم تحط مفتاح ElevenLabs وتختار صوت من الإعدادات', 'error');
      return;
    }
    try {
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      const res = await fetch('https://api.elevenlabs.io/v1/text-to-speech/' + voiceId, {
        method: 'POST',
        headers: {
          'xi-api-key': elevenKey,
          'Content-Type': 'application/json',
          'Accept': 'audio/mpeg'
        },
        body: JSON.stringify({
          text: text,
          model_id: 'eleven_multilingual_v2',
          voice_settings: { stability: 0.5, similarity_boost: 0.75 }
        })
      });
      if (!res.ok) {
        const errText = await res.text();
        addMessage('خطأ في الصوت (' + res.status + '): ' + errText, 'error');
        return;
      }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      currentAudio = new Audio(url);
      currentAudio.play();
    } catch (err) {
      addMessage('فشل تشغيل الصوت: ' + err.message, 'error');
    }
  }

  apiKeyInput.value = apiKey;
  modelSelect.value = model;
  elevenKeyInput.value = elevenKey;
  updateStatus();
  updateVoiceBtn();
  if (elevenKey) loadVoices();

  settingsBtn.onclick = () => settingsPanel.classList.toggle('open');

  voiceBtn.onclick = () => {
    voiceEnabled = !voiceEnabled;
    localStorage.setItem('md1_voice_enabled', voiceEnabled);
    updateVoiceBtn();
    if (!voiceEnabled && currentAudio) { currentAudio.pause(); currentAudio = null; }
  };

  saveSettings.onclick = async () => {
    apiKey = apiKeyInput.value.trim();
    model = modelSelect.value;
    const newElevenKey = elevenKeyInput.value.trim();
    localStorage.setItem('md1_groq_key', apiKey);
    localStorage.setItem('md1_groq_model', model);
    localStorage.setItem('md1_eleven_key', newElevenKey);
    updateStatus();

    if (newElevenKey !== elevenKey) {
      elevenKey = newElevenKey;
      await loadVoices();
    }
    voiceId = voiceSelect.value;
    localStorage.setItem('md1_voice_id', voiceId);

    settingsPanel.classList.remove('open');
  };

  voiceSelect.addEventListener('change', () => {
    voiceId = voiceSelect.value;
    localStorage.setItem('md1_voice_id', voiceId);
  });

  function addMessage(text, cls) {
    const wrap = document.createElement('div');
    wrap.className = 'msg-wrap ' + cls;

    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    wrap.appendChild(div);

    chatWindow.appendChild(wrap);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return { wrap, div };
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;
    if (!apiKey) {
      addMessage('محتاج تحط الـ API key الأول من الإعدادات', 'error');
      return;
    }

    addMessage(text, 'user');
    history.push({ role: 'user', content: text });
    userInput.value = '';
    userInput.style.height = 'auto';
    sendBtn.disabled = true;

    const typing = addMessage('بيكتب...', 'typing');

    try {
      const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + apiKey
        },
        body: JSON.stringify({
          model: model,
          messages: [SYSTEM_PROMPT, ...history],
          temperature: 0.7,
          max_tokens: 1500
        })
      });

      typing.wrap.remove();

      if (!response.ok) {
        const errText = await response.text();
        addMessage('خطأ (' + response.status + '): ' + errText, 'error');
        sendBtn.disabled = false;
        return;
      }

      const data = await response.json();
      const reply = data.choices?.[0]?.message?.content || 'مفيش رد';
      addMessage(reply, 'bot');
      history.push({ role: 'assistant', content: reply });
      speak(reply);

    } catch (err) {
      typing.wrap.remove();
      addMessage('فشل الاتصال: ' + err.message, 'error');
    }

    sendBtn.disabled = false;
    userInput.focus();
  }

  sendBtn.onclick = sendMessage;
  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 150) + 'px';
  });
</script>

</body>
</html>
