<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD1 Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-bright: #f0c060;
    --gold-dim: #6b4f1a;
    --light: #e8d5a3;
    --dark: #050403;
    --void: #000000;
    --panel: #0c0a06;
    --border: rgba(201,168,76,0.18);
    --user-bubble: rgba(201,168,76,0.10);
    --bot-bubble: #0f0d09;
    --error: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--void); color: var(--light);
    font-family: 'Tajawal', sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 10px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(to bottom, rgba(0,0,0,0.97), rgba(0,0,0,0.9));
    flex-wrap: wrap; gap: 10px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo-eagle {
    font-size: 26px; text-decoration: none; line-height: 1;
    filter: drop-shadow(0 0 6px rgba(201,168,76,0.7)) drop-shadow(0 0 14px rgba(201,168,76,0.4));
    transition: filter 0.3s;
  }
  .logo-eagle:hover { filter: drop-shadow(0 0 10px rgba(240,192,96,0.9)) drop-shadow(0 0 22px rgba(201,168,76,0.6)); }
  header h1 {
    font-size: 15px; margin: 0; font-weight: 700; color: var(--gold-bright);
    font-family: 'Cinzel', serif; letter-spacing: 1px;
  }
  header .status { font-size: 11px; color: rgba(232,213,163,0.5); }

  .header-center { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .md1usd-link {
    font-family: 'Cinzel', serif; font-size: 13px; font-weight: 700;
    color: var(--gold-bright); text-decoration: none; letter-spacing: 0.5px;
    text-shadow: 0 0 12px rgba(201,168,76,0.5); transition: text-shadow 0.3s;
  }
  .md1usd-link:hover { text-shadow: 0 0 20px rgba(240,192,96,0.8); }
  .chat-core-label {
    font-size: 20px; font-weight: 900; color: var(--gold-bright);
    letter-spacing: 1px; text-transform: uppercase;
    font-family: 'Cinzel', serif;
    text-shadow: 0 0 14px rgba(201,168,76,0.55);
  }

  .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .icon-btn {
    background: transparent; border: 1px solid var(--border); color: rgba(232,213,163,0.75);
    border-radius: 20px; padding: 6px 14px; cursor: pointer; font-size: 12px; transition: all 0.25s;
    text-decoration: none; display: inline-flex; align-items: center; gap: 5px; font-weight: 700;
  }
  .icon-btn:hover { color: var(--gold-bright); border-color: var(--gold); box-shadow: 0 0 14px rgba(201,168,76,0.2); }

  .marquee-bar {
    background: linear-gradient(90deg, rgba(201,168,76,0.14), rgba(201,168,76,0.03));
    border-bottom: 1px solid var(--border); padding: 6px 0; font-size: 12.5px; color: var(--gold-bright);
    overflow: hidden; white-space: nowrap;
  }
  .marquee-track {
    display: inline-block; padding-left: 100%; direction: ltr; animation: marquee-scroll 20s linear infinite;
  }
  .marquee-bar:hover .marquee-track { animation-play-state: paused; }
  .marquee-track span { font-weight: 700; }
  .marquee-track a { color: var(--gold); text-decoration: underline; font-weight: 800; }
  @keyframes marquee-scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

  #settingsPanel {
    display: none; padding: 16px 18px; background: var(--panel);
    border-bottom: 1px solid var(--border); gap: 16px; flex-direction: column;
  }
  #settingsPanel.open { display: flex; }
  #settingsPanel .section-label {
    font-size: 11px; color: var(--gold-dim); text-transform: uppercase;
    letter-spacing: 1.5px; border-top: 1px solid var(--border); padding-top: 12px;
    font-family: 'Cinzel', serif;
  }
  #settingsPanel .section-label:first-child { border-top: none; padding-top: 0; }
  #settingsPanel label {
    font-size: 12px; color: rgba(232,213,163,0.65); display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;
  }
  #settingsPanel label a { color: var(--gold); text-decoration: none; font-size: 11px; }
  #settingsPanel input, #settingsPanel select {
    background: var(--void); border: 1px solid var(--border); color: var(--light);
    padding: 8px 12px; border-radius: 6px; font-size: 13px; width: 100%; font-family: inherit;
  }
  #settingsPanel input:focus, #settingsPanel select:focus { outline: none; border-color: var(--gold); }
  #settingsPanel .settings-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; width: 100%;
  }
  .field { display: flex; flex-direction: column; }
  .key-input-wrap { position: relative; display: flex; align-items: center; }
  .key-input-wrap input { padding-left: 36px; font-family: monospace; direction: ltr; text-align: left; }
  .key-toggle-eye {
    position: absolute; left: 6px; background: none; border: none; color: rgba(232,213,163,0.5); cursor: pointer; font-size: 14px; padding: 4px;
  }
  .key-len { font-size: 10px; color: rgba(232,213,163,0.5); margin-top: 4px; direction: ltr; text-align: left; }
  .key-len.ok { color: #4ade80; }
  .security-warning {
    font-size: 11.5px; color: var(--gold-bright); background: rgba(201,168,76,0.06);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; line-height: 1.5;
  }

  /* Provider select bar (replaces old two-tab system) */
  .provider-select-row { display: flex; flex-direction: column; gap: 6px; }
  .provider-select-row select#providerSelect {
    font-weight: 700; font-size: 14px; padding: 10px 12px;
  }
  .provider-search {
    font-size: 12px !important; padding: 7px 10px !important;
  }
  .provider-meta-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .get-key-btn {
    background: linear-gradient(135deg, var(--gold), #8b6914); color: #000; border: none;
    padding: 6px 14px; border-radius: 16px; font-size: 11.5px; font-weight: 900; cursor: pointer;
    text-decoration: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px;
    transition: transform 0.2s;
  }
  .get-key-btn:hover { transform: translateY(-2px); }
  .get-key-btn[disabled], .get-key-btn.disabled {
    opacity: 0.4; cursor: not-allowed; pointer-events: none;
  }

  /* Custom provider fields */
  #customProviderFields {
    display: none; flex-direction: column; gap: 12px;
    border: 1px dashed var(--border); border-radius: 8px; padding: 12px;
    background: rgba(201,168,76,0.03);
  }
  #customProviderFields.show { display: flex; }
  #customModelsList {
    display: flex; flex-direction: column; gap: 6px;
  }
  .custom-model-row { display: flex; gap: 6px; }
  .custom-model-row input { flex: 1; }
  .custom-model-row button {
    background: rgba(255,92,92,0.12); border: 1px solid var(--error); color: var(--error);
    border-radius: 6px; width: 34px; cursor: pointer; font-size: 13px; flex-shrink: 0;
  }
  #addCustomModelBtn {
    align-self: flex-start; background: transparent; border: 1px dashed var(--gold-dim);
    color: var(--gold-bright); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12px;
  }

  .slider-row { display: flex; align-items: center; gap: 10px; }
  .slider-row input[type="range"] {
    flex: 1; accent-color: var(--gold); height: 4px; padding: 0;
  }
  .slider-val {
    font-size: 12px; color: var(--gold-bright); min-width: 34px; text-align: center;
    font-family: monospace; direction: ltr;
  }

  #saveSettings {
    background: linear-gradient(135deg, var(--gold), #8b6914); border: none; color: #000; padding: 9px 24px;
    border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 900; align-self: flex-start;
    letter-spacing: 0.5px; transition: transform 0.2s;
  }
  #saveSettings:hover { transform: translateY(-2px); }

  #chatWindow {
    flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px;
  }
  .msg-wrap { display: flex; flex-direction: column; max-width: 82%; }
  .msg-wrap.user { align-items: flex-end; align-self: flex-end; }
  .msg-wrap.bot, .msg-wrap.error, .msg-wrap.loading { align-items: flex-start; align-self: flex-start; }
  .msg {
    padding: 12px 16px; border-radius: 12px; line-height: 1.7; font-size: 14px; white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.user { background: var(--user-bubble); border: 1px solid var(--border); }
  .msg.bot { background: var(--bot-bubble); border: 1px solid var(--border); }
  .msg.loading { background: rgba(201,168,76,0.06); border: 1px dashed var(--gold-dim); color: var(--gold-bright); font-size: 13px; }
  .msg.error { background: rgba(255, 92, 92, 0.1); border: 1px solid var(--error); color: var(--error); font-size: 13.5px; }
  .msg img, .msg video { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; }

  #inputBar {
    display: flex; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--border); background: var(--panel); align-items: flex-end;
  }
  #userInput {
    flex: 1; background: var(--void); border: 1px solid var(--border); color: var(--light);
    padding: 12px 14px; border-radius: 10px; font-size: 14px; resize: none; font-family: inherit;
    max-height: 200px;
  }
  #userInput:focus { outline: none; border-color: var(--gold); }
  .action-icon-btn {
    background: var(--void); border: 1px solid var(--border); color: var(--light);
    width: 44px; height: 44px; border-radius: 10px; cursor: pointer; font-size: 18px;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
  }
  .action-icon-btn:hover { border-color: var(--gold); color: var(--gold-bright); }
  #sendBtn {
    background: linear-gradient(135deg, var(--gold), #8b6914); border: none; color: #000; padding: 0 22px; height: 44px;
    border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 900; flex-shrink: 0;
  }
  #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  #sendBtn:hover:not(:disabled) { box-shadow: 0 0 18px rgba(201,168,76,0.4); }

  @media (max-width: 600px) {
    header h1 { font-size: 13.5px; }
    .icon-btn { padding: 5px 10px; font-size: 11px; }
    .chat-core-label { font-size: 15px; }
  }

  /* ── PARTICLES (نجوم متطايرة خفيفة) ── */
  #particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .p { position: absolute; border-radius: 50%; animation: drift linear infinite; }
  @keyframes drift {
    0%   { transform: translateY(100vh) scale(0); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: .6; }
    100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
  }
  header, .marquee-bar, #settingsPanel, #chatWindow, #inputBar {
    position: relative; z-index: 1;
  }

  /* ── MUSIC BUTTON ── */
  #musicBtn.playing { border-color: rgba(201,168,76,0.6); animation: musicPulse 2s ease-in-out infinite; }
  @keyframes musicPulse {
    0%, 100% { box-shadow: 0 0 6px rgba(201,168,76,0.15); }
    50%       { box-shadow: 0 0 16px rgba(201,168,76,0.4); }
  }

  /* ── FLOATING MENU (مطابقة لباقي صفحات الموقع) ── */
  #mdm1m-btn{
    position:fixed; bottom:5.5rem; right:1rem; z-index:998;
    width:44px; height:44px; border-radius:50%;
    border:1px solid rgba(201,168,76,0.5);
    background:rgba(10,8,5,0.92);
    color:#c9a84c; font-size:1.15rem;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:border-color .3s, box-shadow .3s, transform .2s;
    box-shadow:0 0 15px rgba(201,168,76,0.1);
  }
  #mdm1m-btn:hover{ border-color:#c9a84c; box-shadow:0 0 25px rgba(201,168,76,.35); transform:scale(1.08); }
  #mdm1m-panel{
    position:fixed; bottom:9.5rem; right:1rem; z-index:998;
    width:min(78vw, 260px);
    max-height:70vh; overflow-y:auto;
    background:rgba(5,4,3,0.96);
    border:1px solid rgba(201,168,76,0.35);
    border-radius:12px;
    padding:.75rem;
    backdrop-filter:blur(10px);
    opacity:0; visibility:hidden; transform:translateY(12px);
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease, visibility .25s;
  }
  #mdm1m-panel.is-open{ opacity:1; visibility:visible; transform:translateY(0); pointer-events:auto; }
  #mdm1m-panel a{
    display:block; padding:.55rem .6rem; border-radius:6px;
    color:#e8d5a3; text-decoration:none; font-family:'Tajawal',sans-serif;
    font-size:.9rem; text-align:right; transition:background .2s, color .2s;
  }
  #mdm1m-panel a:hover{ background:rgba(201,168,76,.1); color:#f0c060; }
  #mdm1m-panel .mdm1m-sep{
    border-top:1px solid rgba(201,168,76,.15); margin:.4rem 0;
  }
</style>
</head>
<body>

<div id="particles"></div>

<audio id="bg-music" loop preload="none">
  <source src="audio/index.mp3" type="audio/mpeg">
  <source src="audio/index.ogg" type="audio/ogg">
</audio>

<header>
  <div class="brand">
    <a href="../index.html" class="logo-eagle" title="الرئيسية">🦅</a>
    <div>
      <h1>MD1 Chat</h1>
      <div class="status" id="statusLine">مش متصل — افتح الإعدادات وحط الـ API key</div>
    </div>
  </div>
  <div class="header-center">
    <a href="https://md1usd.com" target="_blank" class="md1usd-link" title="MD1$">💎 MD1$</a>
    <span class="chat-core-label">MD1 AI Conversation</span>
  </div>
  <div class="header-actions">
    <button id="settingsBtn" class="icon-btn">⚙ الإعدادات</button>
  </div>
</header>

<div class="marquee-bar">
  <div class="marquee-track">
    <span>شات ذكي مدعوم بنماذج الذكاء الاصطناعي ⚡</span>
    <a href="https://opencode.ai" target="_blank">احصل على مفتاح Open Code الآن ↗</a>
  </div>
</div>

<div id="settingsPanel">
  <div class="section-label">إعدادات النظام والذكاء الاصطناعي</div>
  <div class="security-warning">⚠ المفتاح يتخزين محليًا في متصفحك (localStorage) فقط لضمان الخصوصية.</div>

  <div class="provider-select-row">
    <label>اختر الموفّر (Provider)</label>
    <input type="text" id="providerSearch" class="provider-search" placeholder="🔍 ابحث عن موفّر...">
    <select id="providerSelect"></select>
  </div>

  <div class="settings-grid">
    <div class="field">
      <div class="provider-meta-row">
        <label style="margin-bottom:0;">مفتاح API (API Key)</label>
        <a id="getKeyBtn" class="get-key-btn" href="#" target="_blank" rel="noopener">🔑 احصل على مفتاح ↗</a>
      </div>
      <div class="key-input-wrap">
        <button type="button" class="key-toggle-eye" data-target="providerKeyInput">👁</button>
        <input type="password" id="providerKeyInput" placeholder="..." autocomplete="off" spellcheck="false">
      </div>
      <div class="key-len" id="providerKeyLen"></div>
    </div>

    <div class="field">
      <label>اختر النموذج الذكي (AI Model)</label>
      <select id="providerModelSelect"></select>
    </div>

    <div class="field" style="grid-column: 1 / -1;">
      <label>قوة النموذج (Temperature) <span id="tempLabel">0.7</span></label>
      <div class="slider-row">
        <input type="range" id="tempRange" min="0" max="2" step="0.1" value="0.7">
        <span class="slider-val" id="tempVal">0.7</span>
      </div>
    </div>
  </div>

  <!-- Custom provider fields, shown only when providerSelect === custom -->
  <div id="customProviderFields">
    <div class="settings-grid">
      <div class="field">
        <label>اسم الموفّر المخصص</label>
        <input type="text" id="customProviderName" placeholder="مثال: My Local Server">
      </div>
      <div class="field">
        <label>رابط الـ Base URL</label>
        <input type="text" id="customBaseUrl" placeholder="https://api.example.com/v1" style="direction:ltr; text-align:left;">
      </div>
    </div>
    <div class="field">
      <label>النماذج المتاحة على هذا الموفّر (أضف واحد أو أكثر)</label>
      <div id="customModelsList"></div>
      <button type="button" id="addCustomModelBtn">+ إضافة نموذج</button>
    </div>
  </div>

  <button id="saveSettings">حفظ الإعدادات</button>
</div>

<div id="chatWindow"></div>

<div id="inputBar">
  <button id="musicBtn" class="action-icon-btn" title="تشغيل/إيقاف الموسيقى">🔇</button>
  <textarea id="userInput" rows="1" placeholder="اكتب رسالتك..."></textarea>
  <button id="sendBtn">إرسال</button>
</div>

/* ========================= DOM refs ========================= */
const chatWindow = document.getElementById('chatWindow');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const settingsBtn = document.getElementById('settingsBtn');
const settingsPanel = document.getElementById('settingsPanel');
const saveSettings = document.getElementById('saveSettings');
const statusLine = document.getElementById('statusLine');

const providerSelect = document.getElementById('providerSelect');
const providerSearch = document.getElementById('providerSearch');
const providerKeyInput = document.getElementById('providerKeyInput');
const providerKeyLen = document.getElementById('providerKeyLen');
const getKeyBtn = document.getElementById('getKeyBtn');
const providerModelSelect = document.getElementById('providerModelSelect');
const tempRange = document.getElementById('tempRange');
const tempVal = document.getElementById('tempVal');
const tempLabel = document.getElementById('tempLabel');

const customProviderFields = document.getElementById('customProviderFields');
const customProviderName = document.getElementById('customProviderName');
const customBaseUrl = document.getElementById('customBaseUrl');
const customModelsList = document.getElementById('customModelsList');
const addCustomModelBtn = document.getElementById('addCustomModelBtn');

/* ========================= State (persisted) ========================= */
let activeProviderId = localStorage.getItem('md1_active_provider') || 'opencode_zen';
let providerKeys = JSON.parse(localStorage.getItem('md1_provider_keys') || '{}');       // { providerId: key }
let providerModels = JSON.parse(localStorage.getItem('md1_provider_models') || '{}');   // { providerId: selectedModel }
let temperature = parseFloat(localStorage.getItem('md1_temperature') || '0.7');
let customProviderData = JSON.parse(localStorage.getItem('md1_custom_provider') || '{"name":"","baseUrl":"","models":[]}');

/* ========================= Populate provider select ========================= */
function populateProviderSelect(filter) {
  const q = (filter || '').trim().toLowerCase();
  providerSelect.innerHTML = '';
  Object.keys(PROVIDERS_DB).forEach(id => {
    const p = PROVIDERS_DB[id];
    if (q && !p.name.toLowerCase().includes(q) && !id.includes(q)) return;
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = p.name;
    providerSelect.appendChild(opt);
  });
  // ensure active provider still selectable even if filtered out
  if (![...providerSelect.options].some(o => o.value === activeProviderId)) {
    const p = PROVIDERS_DB[activeProviderId];
    if (p) {
      const opt = document.createElement('option');
      opt.value = activeProviderId;
      opt.textContent = p.name;
      providerSelect.insertBefore(opt, providerSelect.firstChild);
    }
  }
  providerSelect.value = activeProviderId;
}

function populateModelSelect(providerId) {
  providerModelSelect.innerHTML = '';
  let models = [];
  if (providerId === 'custom') {
    models = customProviderData.models || [];
  } else {
    models = (PROVIDERS_DB[providerId] && PROVIDERS_DB[providerId].models) || [];
  }
  if (models.length === 0) {
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = providerId === 'custom' ? '— أضف نموذجًا أدناه —' : '— لا نماذج متاحة —';
    providerModelSelect.appendChild(opt);
    return;
  }
  models.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    providerModelSelect.appendChild(opt);
  });
  const saved = providerModels[providerId];
  if (saved && models.includes(saved)) providerModelSelect.value = saved;
}

function updateKeyFieldsForProvider(providerId) {
  const p = PROVIDERS_DB[providerId];
  if (!p) return;
  providerKeyInput.value = providerKeys[providerId] || '';
  providerKeyInput.placeholder = p.keyPlaceholder || '...';
  updateKeyLen();

  if (providerId === 'custom') {
    getKeyBtn.classList.add('disabled');
    getKeyBtn.removeAttribute('href');
    customProviderFields.classList.add('show');
    customProviderName.value = customProviderData.name || '';
    customBaseUrl.value = customProviderData.baseUrl || '';
    renderCustomModelsList();
  } else {
    customProviderFields.classList.remove('show');
    if (p.keyUrl) {
      getKeyBtn.classList.remove('disabled');
      getKeyBtn.href = p.keyUrl;
    } else {
      getKeyBtn.classList.add('disabled');
      getKeyBtn.removeAttribute('href');
    }
  }
}

function updateKeyLen() {
  const len = providerKeyInput.value.trim().length;
  providerKeyLen.textContent = len > 0 ? `الطول: ${len} حرف` : '';
  providerKeyLen.classList.toggle('ok', len >= 20);
}

function renderCustomModelsList() {
  customModelsList.innerHTML = '';
  const models = customProviderData.models && customProviderData.models.length ? customProviderData.models : [''];
  models.forEach((m, idx) => {
    const row = document.createElement('div');
    row.className = 'custom-model-row';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'مثال: my-custom-model-id';
    input.value = m;
    input.style.direction = 'ltr';
    input.style.textAlign = 'left';
    input.addEventListener('input', () => {
      customProviderData.models[idx] = input.value.trim();
    });
    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.textContent = '✕';
    delBtn.addEventListener('click', () => {
      customProviderData.models.splice(idx, 1);
      renderCustomModelsList();
      populateModelSelect('custom');
    });
    row.appendChild(input);
    row.appendChild(delBtn);
    customModelsList.appendChild(row);
  });
}

addCustomModelBtn.addEventListener('click', () => {
  if (!customProviderData.models) customProviderData.models = [];
  customProviderData.models.push('');
  renderCustomModelsList();
});

/* ========================= Events ========================= */
providerSearch.addEventListener('input', () => populateProviderSelect(providerSearch.value));

providerSelect.addEventListener('change', () => {
  activeProviderId = providerSelect.value;
  populateModelSelect(activeProviderId);
  updateKeyFieldsForProvider(activeProviderId);
});

providerKeyInput.addEventListener('input', updateKeyLen);

document.querySelectorAll('.key-toggle-eye').forEach(btn => {
  btn.addEventListener('click', () => {
    const target = document.getElementById(btn.dataset.target);
    target.type = target.type === 'password' ? 'text' : 'password';
    btn.textContent = target.type === 'password' ? '👁' : '🙈';
  });
});

tempRange.addEventListener('input', () => {
  tempVal.textContent = tempRange.value;
  tempLabel.textContent = tempRange.value;
});

settingsBtn.addEventListener('click', () => {
  settingsPanel.classList.toggle('open');
});

saveSettings.addEventListener('click', () => {
  // persist current provider's key + model
  providerKeys[activeProviderId] = providerKeyInput.value.trim();
  providerModels[activeProviderId] = providerModelSelect.value;
  temperature = parseFloat(tempRange.value);

  if (activeProviderId === 'custom') {
    customProviderData.name = customProviderName.value.trim();
    customProviderData.baseUrl = customBaseUrl.value.trim();
    customProviderData.models = (customProviderData.models || []).map(m => m.trim()).filter(Boolean);
    localStorage.setItem('md1_custom_provider', JSON.stringify(customProviderData));
    providerModels['custom'] = providerModelSelect.value;
  }

  localStorage.setItem('md1_active_provider', activeProviderId);
  localStorage.setItem('md1_provider_keys', JSON.stringify(providerKeys));
  localStorage.setItem('md1_provider_models', JSON.stringify(providerModels));
  localStorage.setItem('md1_temperature', String(temperature));

  updateStatusLine();
  settingsPanel.classList.remove('open');
});

function updateStatusLine() {
  const p = activeProviderId === 'custom'
    ? (customProviderData.name || 'موفّر مخصص')
    : (PROVIDERS_DB[activeProviderId] ? PROVIDERS_DB[activeProviderId].name : activeProviderId);
  const key = providerKeys[activeProviderId];
  const model = providerModels[activeProviderId] || '';
  if (key) {
    statusLine.textContent = `متصل — ${p}${model ? ' · ' + model : ''}`;
  } else {
    statusLine.textContent = 'مش متصل — افتح الإعدادات وحط الـ API key';
  }
}

/* ========================= Init ========================= */
populateProviderSelect();
populateModelSelect(activeProviderId);
updateKeyFieldsForProvider(activeProviderId);
tempRange.value = temperature;
tempVal.textContent = temperature;
tempLabel.textContent = temperature;
updateStatusLine();

/* ========================= Music button ========================= */
const musicBtn = document.getElementById('musicBtn');
const bgMusic = document.getElementById('bg-music');
musicBtn.addEventListener('click', () => {
  if (bgMusic.paused) {
    bgMusic.play().catch(() => {});
    musicBtn.textContent = '🔊';
    musicBtn.classList.add('playing');
  } else {
    bgMusic.pause();
    musicBtn.textContent = '🔇';
    musicBtn.classList.remove('playing');
  }
});

/* ========================= Chat send (placeholder wiring) ========================= */
function appendMsg(text, cls) {
  const wrap = document.createElement('div');
  wrap.className = `msg-wrap ${cls}`;
  const bubble = document.createElement('div');
  bubble.className = `msg ${cls}`;
  bubble.textContent = text;
  wrap.appendChild(bubble);
  chatWindow.appendChild(wrap);
  chatWindow.scrollTop = chatWindow.scrollHeight;
}

sendBtn.addEventListener('click', () => {
  const text = userInput.value.trim();
  if (!text) return;
  appendMsg(text, 'user');
  userInput.value = '';

  const key = providerKeys[activeProviderId];
  if (!key) {
    appendMsg('من فضلك افتح الإعدادات وحط الـ API key الخاص بالموفّر المختار أولاً.', 'error');
    return;
  }
  appendMsg('...جاري التفكير', 'loading');
  // NOTE: actual API call wiring per-provider (base URL / headers) goes here.
});

userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendBtn.click();
  }
});
