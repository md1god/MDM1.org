<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدقق الصوت المصري</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f1115;
            color: #e6e8eb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            direction: rtl;
            text-align: right;
        }
        .container {
            background: #161920;
            border: 1px solid #262a33;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
        }
        textarea {
            width: 100%;
            height: 90px;
            background: #0f1115;
            border: 1px solid #262a33;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            resize: none;
            box-sizing: border-box;
            direction: rtl !important;
            unicode-bidi: plaintext;
            text-align: right !important;
        }
        button {
            background: #4f8cff;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            font-size: 14px;
        }
        button:hover { opacity: 0.9; }
        .info { font-size: 11px; color: #8a8f98; margin-top: 8px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h3 style="margin-top: 0; font-size: 16px;">اختبار الصوت المباشر</h3>
    
    <!-- تم ضبط الاتجاه والمحاذاة لمنع انعكاس الحروف نهائياً -->
    <textarea id="myText" dir="rtl">ازيك عامل ايه، أنا معاك وهساعدك في كل اللي تحتاجه.</textarea>
    
    <button onclick="speakEgyptian()">🔊 انطق باللهجة المصرية</button>
    <div class="info" id="status">جاري فحص أصوات المتصفح...</div>
</div>

<script>
    let voices = [];

    function updateVoices() {
        if (!('speechSynthesis' in window)) return;
        voices = window.speechSynthesis.getVoices();
        
        // البحث الدقيق عن أي صوت مصري متاح (ar-EG) أو صوت عربي عام
        const egVoice = voices.find(v => v.lang === 'ar-EG' || v.name.includes('Egypt') || v.name.includes('Maged') || v.name.includes('Tarik'));
        
        const statusEl = document.getElementById('status');
        if (egVoice) {
            statusEl.textContent = `تم العثور على صوت مصري/عربي مدعوم (${egVoice.name})`;
        } else {
            statusEl.textContent = "سيتم استخدام نطق المتصفح الافتراضي المتاح.";
        }
    }

    if ('speechSynthesis' in window) {
        updateVoices();
        window.speechSynthesis.onvoiceschanged = updateVoices;
    }

    function speakEgyptian() {
        if (!('speechSynthesis' in window)) {
            alert('متصفحك لا يدعم النطق.');
            return;
        }

        window.speechSynthesis.cancel();

        const text = document.getElementById('myText').value;
        const utterance = new SpeechSynthesisUtterance(text);
        
        // اجبار المحرك على اللهجة المصرية صراحة
        utterance.lang = 'ar-EG';

        // محاولة اختيار الصوت المصري لو متوفر في القائمة
        const preferredVoice = voices.find(v => v.lang === 'ar-EG' || v.lang.toLowerCase().includes('eg'));
        if (preferredVoice) {
            utterance.voice = preferredVoice;
        }

        utterance.rate = 1.0; 
        utterance.pitch = 1.1; // رفع النبرة قليلاً لتكون طبيعية أكثر

        window.speechSynthesis.speak(utterance);
    }
</script>

</body>
</html>
