<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تشجيع القراءة الصوتية محلياً بالمتصفح</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #0f1115;
            color: #e6e8eb;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: #161920;
            border: 1px solid #262a33;
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        textarea {
            width: 100%;
            height: 100px;
            background: #0f1115;
            border: 1px solid #262a33;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            resize: none;
            font-family: inherit;
            box-sizing: border-box;
        }
        button {
            background: #4f8cff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            width: 100%;
        }
        button:hover {
            opacity: 0.9;
        }
        .status {
            font-size: 12px;
            color: #8a8f98;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="box">
        <h3>تجربة النطق الصوتي بالمتصفح</h3>
        <textarea id="textInput">أهلاً بك يا فندم، أنا مساعدك الذكي ومستعد أساعدك في أي وقت.</textarea>
        <button onclick="speakText()">🔊 استمع للصوت</button>
        <div class="status" id="statusMsg">جاري فحص الأصوات المتاحة في جهازك...</div>
    </div>

    <script>
        let arabicVoices = [];

        // تحميل الأصوات المتاحة في المتصفح تلقائياً
        function loadVoices() {
            if (!('speechSynthesis' in window)) {
                document.getElementById('statusMsg').textContent = 'المتصفح لا يدعم ميزة النطق الصوتي.';
                return;
            }

            const allVoices = window.speechSynthesis.getVoices();
            // البحث عن الأصوات العربية (وتفضيل اللهجة المصرية ar-EG لو وجدت في نظام الجهاز)
            arabicVoices = allVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith('ar'));

            const statusEl = document.getElementById('statusMsg');
            if (arabicVoices.length > 0) {
                // ترتيب الأصوات لجعل اللهجة المصرية في المقدمة إن توفرت
                arabicVoices.sort((a, b) => (b.lang.includes('EG') ? 1 : -1));
                statusEl.textContent = `تم العثور على ${arabicVoices.length} صوت عربي في جهازك.`;
            } else {
                statusEl.textContent = 'لا توجد أصوات عربية مدمجة في هذا الجهاز، سيتم استخدام الصوت الافتراضي للمتصفح.';
            }
        }

        if ('speechSynthesis' in window) {
            loadVoices();
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        // دالة تشغيل الصوت
        function speakText() {
            if (!('speechSynthesis' in window)) {
                alert('متصفحك لا يدعم قراءة النصوص.');
                return;
            }

            // إيقاف أي صوت قيد التشغيل حالياً
            window.speechSynthesis.cancel();

            const text = document.getElementById('textInput').value.trim();
            if (!text) return;

            const utterance = new SpeechSynthesisUtterance(text);

            // اختيار أفضل صوت عربي/مصري متاح
            if (arabicVoices.length > 0) {
                utterance.voice = arabicVoices[0];
                utterance.lang = arabicVoices[0].lang;
            } else {
                utterance.lang = 'ar-EG'; // محاولة فرض اللهجة المصرية افتراضياً
            }

            utterance.rate = 1.0;  // سرعة النطق (يمكن تعديلها من 0.8 إلى 1.2)
            utterance.pitch = 1.0; // نبرة الصوت

            window.speechSynthesis.speak(utterance);
        }
    </script>

</body>
</html>
