<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD1 Chat</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161920;
    --border: #262a33;
    --text: #e6e8eb;
    --muted: #8a8f98;
    --accent: #4f8cff;
    --user-bubble: #1f2937;
    --bot-bubble: #171b24;
    --error: #ff5c5c;
    --mic-live: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 32px; height: 32px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; color: white; font-size: 14px;
    overflow: hidden;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .status { font-size: 12px; color: var(--muted); }
  #settingsBtn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12px;
    transition: all 0.2s;
  }
  #settingsBtn:hover { color: var(--text); border-color: var(--accent); }

  .marquee-bar {
    background: linear-gradient(90deg, rgba(79,140,255,0.15), rgba(79,140,255,0.05));
    border-bottom: 1px solid var(--border);
    padding: 6px 0; font-size: 13px; color: var(--accent);
    white-space: nowrap; overflow: hidden;
  }
  .marquee-bar marquee { font-weight: 600; }
  .marquee-bar a { color: var(--accent); text-decoration: underline; font-weight: 700; }

  #settingsPanel {
    display: none; padding: 16px 20px; background: var(--panel);
    border-bottom: 1px solid var(--border); gap: 12px; flex-direction: column;
  }
  #settingsPanel.open { display: flex; }
  #settingsPanel label {
    font-size: 12px; color: var(--muted);
    display: flex; justify-content: space-between; align-items: center;
  }
  #settingsPanel label a { color: var(--accent); text-decoration: none; font-size: 11px; }
  #settingsPanel label a:hover { text-decoration: underline; }
  #settingsPanel input, #settingsPanel select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 8px 10px; border-radius: 6px; font-size: 13px;
  }
  #settingsPanel .row { display: flex; gap: 10px; flex-wrap: wrap; }
  #settingsPanel .field { flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 4px; }
  #settingsPanel .checkbox-field { flex-direction: row; align-items: center; gap: 8px; }
  #voiceHint { font-size: 11px; color: var(--muted); }
  optgroup { color: var(--muted); font-style: normal; }
  #saveSettings {
    align-self: flex-start; background: var(--accent); border: none; color: white;
    padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  #saveSettings:hover { opacity: 0.9; }

  #chatWindow {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg-wrap { display: flex; flex-direction: column; max-width: 75%; }
  .msg-wrap.user { align-items: flex-end; align-self: flex-end; }
  .msg-wrap.bot, .msg-wrap.error { align-items: flex-start; align-self: flex-start; }
  .msg {
    padding: 10px 14px; border-radius: 10px; line-height: 1.6; font-size: 14px;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.user { background: var(--user-bubble); }
  .msg.bot { background: var(--bot-bubble); border: 1px solid var(--border); }
  .msg.error {
    background: rgba(255, 92, 92, 0.1); border: 1px solid var(--error); color: var(--error);
  }
  .msg.typing { align-self: flex-start; color: var(--muted); font-style: italic; background: none; }

  .speak-btn {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 13px; padding: 2px 6px; margin-top: 2px;
  }
  .speak-btn:hover { color: var(--accent); }
  .speak-btn.speaking { color: var(--accent); }

  #inputBar {
    display: flex; gap: 10px; padding: 16px 20px;
    border-top: 1px solid var(--border); background: var(--panel);
    align-items: flex-end;
  }
  #userInput {
    flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 12px 14px; border-radius: 8px; font-size: 14px; resize: none; font-family: inherit;
  }
  #userInput:focus { outline: none; border-color: var(--accent); }
  #micBtn {
    background: var(--bg); border: 1px solid var(--border); color: var(--muted);
    width: 44px; height: 44px; border-radius: 8px; cursor: pointer; font-size: 18px;
    flex-shrink: 0; transition: all 0.2s;
  }
  #micBtn:hover { border-color: var(--accent); color: var(--text); }
  #micBtn.listening {
    background: rgba(255, 92, 92, 0.15); border-color: var(--mic-live); color: var(--mic-live);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255, 92, 92, 0.4); }
    70% { box-shadow: 0 0 0 8px rgba(255, 92, 92, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 92, 92, 0); }
  }
  #micBtn:disabled { opacity: 0.4; cursor: not-allowed; }
  #sendBtn {
    background: var(--accent); border: none; color: white; padding: 0 20px; height: 44px;
    border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; flex-shrink: 0;
  }
  #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">MD1</div>
    <div>
      <h1>MD1 Chat</h1>
      <div class="status" id="statusLine">مش متصل — افتح الإعدادات وحط الـ API key</div>
    </div>
  </div>
  <button id="settingsBtn">⚙ الإعدادات</button>
</header>

<div class="marquee-bar">
  <marquee scrollamount="5">
    اضغط هنا واحصل على مفتاح مجاني لتشغيل الشات ⚡
    <a href="https://console.groq.com/keys" target="_blank">احصل على مفتاحك الآن ↗</a>
  </marquee>
</div>

<div id="settingsPanel">
  <div class="row">
    <div class="field">
      <label>
        Groq API Key
        <a href="https://console.groq.com/keys" target="_blank">احصل على مفتاح مجاني من هنا ↗</a>
      </label>
      <input type="password" id="apiKeyInput" placeholder="gsk_...">
    </div>
    <div class="field">
      <label>اختر النموذج الذكي</label>
      <select id="modelSelect">
        <optgroup label="نماذج مستقرة (Production)">
          <option value="llama-3.3-70b-versatile">Llama 3.3 70B (الأقوى والأدق)</option>
          <option value="llama-3.1-8b-instant">Llama 3.1 8B (فائق السرعة)</option>
          <option value="openai/gpt-oss-120b">GPT-OSS 120B (قوي جدًا وشامل)</option>
          <option value="openai/gpt-oss-20b">GPT-OSS 20B (أخف وأسرع)</option>
        </optgroup>
        <optgroup label="أنظمة بحث تلقائي (Compound)">
          <option value="groq/compound">Compound (بيدور في الإنترنت ويكتب كود تلقائي)</option>
          <option value="groq/compound-mini">Compound Mini (نسخة أخف وأسرع)</option>
        </optgroup>
        <optgroup label="تجريبي — ممكن يتوقف فجأة (Preview)">
          <option value="qwen/qwen3.6-27b">Qwen3.6 27B (تفكير عميق)</option>
          <option value="openai/gpt-oss-safeguard-20b">GPT-OSS Safeguard 20B (مراقبة محتوى)</option>
        </optgroup>
      </select>
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label>صوت القراءة (عربي فقط)</label>
      <select id="voiceSelect">
        <option value="">جارِ البحث عن أصوات عربية...</option>
      </select>
      <span id="voiceHint"></span>
    </div>
  </div>
  <div class="row">
    <label class="checkbox-field">
      <input type="checkbox" id="voiceToggle">
      قراءة ردود المساعد بصوت تلقائيًا
    </label>
  </div>
  <button id="saveSettings">حفظ الإعدادات</button>
</div>

<div id="chatWindow"></div>

<div id="inputBar">
  <button id="micBtn" type="button" title="تكلم بدل الكتابة">🎤</button>
  <textarea id="userInput" rows="1" placeholder="اكتب رسالتك أو دوس المايك وتكلم..."></textarea>
  <button id="sendBtn">إرسال</button>
</div>

<script>
  const chatWindow = document.getElementById('chatWindow');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  const apiKeyInput = document.getElementById('apiKeyInput');
  const modelSelect = document.getElementById('modelSelect');
  const saveSettings = document.getElementById('saveSettings');
  const statusLine = document.getElementById('statusLine');
  const voiceToggle = document.getElementById('voiceToggle');
  const voiceSelect = document.getElementById('voiceSelect');
  const voiceHint = document.getElementById('voiceHint');

  const SYSTEM_PROMPT = {
    role: 'system',
    content: `أنت "MD1 Assistant"، مساعد ذكي يعمل داخل موقع MDM1 (mdm1.org) ومنصة MD1usd (md1usd.com).
MDM1 هي منصة DeFi/Web3 متوافقة مع الشريعة الإسلامية مبنية على شبكة Polygon.
MD1usd (رمزها MD1$) هي عملة مستقرة (stablecoin) متعددة السلاسل تابعة لنفس المنظومة، ولها منصة استثمارية وتقنية خاصة على md1usd.com.
مهمتك: مساعدة زوار الموقع بالرد على أسئلتهم عن المنصة، العملة، كيفية الاستخدام، أو أي استفسار عام بشكل ودود ومختصر ومفيد باللغة العربية (إلا لو المستخدم كتب بلغة تانية فرد بنفس لغته).
لو سُئلت عن معلومة تفصيلية غير متأكد منها، وضّح إنك غير متأكد وانصح المستخدم يتأكد من الموقع الرسمي مباشرة.
كن مختصرًا وواضحًا، وتجنب الإطالة غير الضرورية.`
  };

  let apiKey = localStorage.getItem('md1_groq_key') || '';
  let model = localStorage.getItem('md1_groq_model') || 'llama-3.3-70b-versatile';
  let autoVoice = localStorage.getItem('md1_auto_voice') === '1';
  let savedVoiceURI = localStorage.getItem('md1_voice_uri') || '';
  let history = [];
  let currentUtterance = null;
  let arabicVoices = [];

  function updateStatus() {
    statusLine.textContent = apiKey ? `متصل — ${model}` : 'مش متصل — افتح الإعدادات وحط الـ API key';
  }

  apiKeyInput.value = apiKey;
  modelSelect.value = model;
  voiceToggle.checked = autoVoice;
  updateStatus();

  settingsBtn.onclick = () => settingsPanel.classList.toggle('open');

  saveSettings.onclick = () => {
    apiKey = apiKeyInput.value.trim();
    model = modelSelect.value;
    autoVoice = voiceToggle.checked;
    savedVoiceURI = voiceSelect.value;
    localStorage.setItem('md1_groq_key', apiKey);
    localStorage.setItem('md1_groq_model', model);
    localStorage.setItem('md1_auto_voice', autoVoice ? '1' : '0');
    localStorage.setItem('md1_voice_uri', savedVoiceURI);
    updateStatus();
    settingsPanel.classList.remove('open');
  };

  // --- تحميل الأصوات العربية فقط من متصفح الزائر ---
  function loadArabicVoices() {
    if (!('speechSynthesis' in window)) return;
    const all = window.speechSynthesis.getVoices();
    arabicVoices = all.filter(v => v.lang && v.lang.toLowerCase().startsWith('ar'));

    voiceSelect.innerHTML = '';

    if (arabicVoices.length === 0) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = 'مفيش صوت عربي متاح على جهازك — القراءة معطّلة';
      voiceSelect.appendChild(opt);
      voiceHint.textContent = 'ثبّت لغة عربية للنطق من إعدادات جهازك عشان تظهر هنا.';
      return;
    }

    arabicVoices.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.voiceURI;
      opt.textContent = `${v.name} (${v.lang})`;
      voiceSelect.appendChild(opt);
    });

    if (savedVoiceURI && arabicVoices.some(v => v.voiceURI === savedVoiceURI)) {
      voiceSelect.value = savedVoiceURI;
    } else {
      voiceSelect.value = arabicVoices[0].voiceURI;
      savedVoiceURI = arabicVoices[0].voiceURI;
    }
    voiceHint.textContent = `${arabicVoices.length} صوت عربي متاح على جهازك.`;
  }

  if ('speechSynthesis' in window) {
    loadArabicVoices();
    window.speechSynthesis.onvoiceschanged = loadArabicVoices;
  } else {
    voiceHint.textContent = 'المتصفح ده مش بيدعم قراءة النصوص بصوت.';
  }

  function cleanTextForSpeech(text) {
    return text
      .replace(/https?:\/\/\S+/g, '')
      .replace(/[*_`~#>]/g, '')
      .replace(/[-–—]{2,}/g, ' ')
      .replace(/^\s*[-•]\s+/gm, '')
      .replace(/\n{2,}/g, '. ')
      .replace(/\n/g, ' ')
      .replace(/[.]{2,}/g, '.')
      .replace(/\s{2,}/g, ' ')
      .trim();
  }

  function speakText(text, btn) {
    if (!('speechSynthesis' in window)) {
      alert('المتصفح ده مش بيدعم قراءة النصوص بصوت');
      return;
    }

    if (currentUtterance && window.speechSynthesis.speaking) {
      window.speechSynthesis.cancel();
      document.querySelectorAll('.speak-btn.speaking').forEach(b => b.classList.remove('speaking'));
      if (currentUtterance._btn === btn) { currentUtterance = null; return; }
    }

    if (arabicVoices.length === 0) {
      alert('مفيش صوت عربي متاح على جهازك، عشان كده القراءة معطّلة (عشان منقراش بلغة غلط زي هندي أو صيني).');
      return;
    }

    const chosen = arabicVoices.find(v => v.voiceURI === savedVoiceURI) || arabicVoices[0];
    const cleanText = cleanTextForSpeech(text);

    const utter = new SpeechSynthesisUtterance(cleanText);
    utter.voice = chosen;
    utter.lang = chosen.lang;
    utter.rate = 1;
    utter._btn = btn;
    utter.onstart = () => btn && btn.classList.add('speaking');
    utter.onend = () => { btn && btn.classList.remove('speaking'); currentUtterance = null; };
    utter.onerror = () => { btn && btn.classList.remove('speaking'); currentUtterance = null; };

    currentUtterance = utter;
    window.speechSynthesis.speak(utter);
  }

  // --- المايك: تحويل كلام لنص (بدون سيرفر، من المتصفح مباشرة) ---
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizer = null;
  let isListening = false;

  if (SpeechRecognitionAPI) {
    recognizer = new SpeechRecognitionAPI();
    recognizer.lang = 'ar-EG';
    recognizer.continuous = false;
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 1;

    recognizer.onstart = () => {
      isListening = true;
      micBtn.classList.add('listening');
    };

    recognizer.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      userInput.value = transcript;
      userInput.dispatchEvent(new Event('input'));
      // إرسال تلقائي بعد ما يخلص الكلام، زي أي شات صوتي عادي
      sendMessage();
    };

    recognizer.onerror = (event) => {
      isListening = false;
      micBtn.classList.remove('listening');
      if (event.error === 'not-allowed' || event.error === 'permission-denied') {
        addMessage('محتاج تسمح للموقع باستخدام المايك من إعدادات المتصفح.', 'error');
      } else if (event.error !== 'no-speech' && event.error !== 'aborted') {
        addMessage('حصلت مشكلة في المايك: ' + event.error, 'error');
      }
    };

    recognizer.onend = () => {
      isListening = false;
      micBtn.classList.remove('listening');
    };

    micBtn.onclick = () => {
      if (!apiKey) {
        addMessage('محتاج تحط الـ API key الأول من الإعدادات', 'error');
        return;
      }
      if (isListening) {
        recognizer.stop();
        return;
      }
      try {
        recognizer.start();
      } catch (e) {
        // بيحصل لو دوس مرتين بسرعة، نتجاهله
      }
    };
  } else {
    micBtn.disabled = true;
    micBtn.title = 'المتصفح ده مش بيدعم التحدث بدل الكتابة';
  }

  function addMessage(text, cls) {
    const wrap = document.createElement('div');
    wrap.className = 'msg-wrap ' + cls;

    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    wrap.appendChild(div);

    if (cls === 'bot') {
      const btn = document.createElement('button');
      btn.className = 'speak-btn';
      btn.type = 'button';
      btn.textContent = '🔊 استمع';
      btn.onclick = () => speakText(text, btn);
      wrap.appendChild(btn);
    }

    chatWindow.appendChild(wrap);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return { wrap, div, btn: wrap.querySelector('.speak-btn') };
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;
    if (!apiKey) {
      addMessage('محتاج تحط الـ API key الأول من الإعدادات', 'error');
      return;
    }

    addMessage(text, 'user');
    history.push({ role: 'user', content: text });
    userInput.value = '';
    userInput.style.height = 'auto';
    sendBtn.disabled = true;

    const typing = addMessage('بيكتب...', 'typing');

    try {
      const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + apiKey
        },
        body: JSON.stringify({
          model: model,
          messages: [SYSTEM_PROMPT, ...history],
          temperature: 0.7,
          max_tokens: 1500
        })
      });

      typing.wrap.remove();

      if (!response.ok) {
        const errText = await response.text();
        addMessage('خطأ (' + response.status + '): ' + errText, 'error');
        sendBtn.disabled = false;
        return;
      }

      const data = await response.json();
      const reply = data.choices?.[0]?.message?.content || 'مفيش رد';
      const { btn } = addMessage(reply, 'bot');
      history.push({ role: 'assistant', content: reply });

      if (autoVoice) speakText(reply, btn);

    } catch (err) {
      typing.wrap.remove();
      addMessage('فشل الاتصال: ' + err.message, 'error');
    }

    sendBtn.disabled = false;
    userInput.focus();
  }

  sendBtn.onclick = sendMessage;
  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 150) + 'px';
  });
</script>

</body>
</html>
