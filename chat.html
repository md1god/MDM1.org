<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD1 Chat — المجتمع والعملات الرقمية</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #131722;
    --border: #1e222d;
    --text: #d1d4dc;
    --muted: #787b86;
    --accent: #2962ff;
    --user-bubble: #1e222d;
    --bot-bubble: #131722;
    --error: #f23645;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    width: 34px;
    height: 34px;
    background: linear-gradient(135deg, #2962ff, #00bcd4);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: white;
    font-size: 13px;
    letter-spacing: 0.5px;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
    color: #fff;
  }
  header .status {
    font-size: 12px;
    color: var(--muted);
  }
  #settingsBtn {
    background: rgba(41, 98, 255, 0.1);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
    font-size: 12px;
    transition: all 0.2s;
  }
  #settingsBtn:hover { background: var(--accent); color: white; border-color: var(--accent); }

  #settingsPanel {
    display: none;
    padding: 16px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    gap: 12px;
    flex-direction: column;
  }
  #settingsPanel.open { display: flex; }
  
  .marquee-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    padding: 8px 0;
    font-size: 13px;
    color: #00bcd4;
  }
  .marquee-box marquee {
    font-weight: 500;
  }

  #settingsPanel label {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #settingsPanel label a {
    color: #00bcd4;
    text-decoration: none;
    font-size: 11px;
  }
  #settingsPanel label a:hover { text-decoration: underline; }

  #settingsPanel input, #settingsPanel select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
  }
  #settingsPanel input:focus, #settingsPanel select:focus { border-color: var(--accent); }
  #settingsPanel .row { display: flex; gap: 12px; flex-wrap: wrap; }
  #settingsPanel .field { flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 5px; }
  
  #saveSettings {
    align-self: flex-start;
    background: var(--accent);
    border: none;
    color: white;
    padding: 8px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }
  #saveSettings:hover { opacity: 0.9; }

  #chatWindow {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border: 1px solid var(--border);
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    border: 1px solid var(--border);
  }
  .msg.error {
    align-self: flex-start;
    background: rgba(242, 54, 69, 0.1);
    border: 1px solid var(--error);
    color: var(--error);
  }
  .msg.typing {
    align-self: flex-start;
    color: var(--muted);
    font-style: italic;
  }

  #inputBar {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  #userInput {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
    resize: none;
    font-family: inherit;
  }
  #userInput:focus { outline: none; border-color: var(--accent); }
  #sendBtn {
    background: var(--accent);
    border: none;
    color: white;
    padding: 0 22px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: opacity 0.2s;
  }
  #sendBtn:hover { opacity: 0.9; }
  #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">MD1</div>
    <div>
      <h1>MD1 Chat — Crypto & Community</h1>
      <div class="status" id="statusLine">غير متصل — يرجى إدخال مفتاح الـ API من الإعدادات</div>
    </div>
  </div>
  <button id="settingsBtn">⚙ الإعدادات</button>
</header>

<div id="settingsPanel" class="open">
  <div class="marquee-box">
    <marquee scrollamount="5">مرحباً بك في منصة MD1usd.com للعملات الرقمية والمجتمع — أدخل مفتاح Groq الخاص بك، اختر النموذج المناسب، وابدأ بالاستفسار عن محتوى ومشاريع المنصة فوراً!</marquee>
  </div>
  <div class="row">
    <div class="field">
      <label>
        Groq API Key
        <a href="https://console.groq.com" target="_blank">احصل على مفتاح مجاني من هنا ↗</a>
      </label>
      <input type="password" id="apiKeyInput" placeholder="gsk_...">
    </div>
    <div class="field">
      <label>اختر النموذج الذكي</label>
      <select id="modelSelect">
        <option value="llama-3.3-70b-versatile">Llama 3.3 70B (الأقوى والأدق للفهم والتحليل)</option>
        <option value="llama-3.1-8b-instant">Llama 3.1 8B (فائق السرعة وخفيف)</option>
      </select>
    </div>
  </div>
  <button id="saveSettings">حفظ الإعدادات وبدء الدردشة</button>
</div>

<div id="chatWindow"></div>

<div id="inputBar">
  <textarea id="userInput" rows="1" placeholder="اكتب رسالتك أو استفسارك هنا..."></textarea>
  <button id="sendBtn">إرسال</button>
</div>

<script>
  const chatWindow = document.getElementById('chatWindow');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  const apiKeyInput = document.getElementById('apiKeyInput');
  const modelSelect = document.getElementById('modelSelect');
  const saveSettings = document.getElementById('saveSettings');
  const statusLine = document.getElementById('statusLine');

  let apiKey = localStorage.getItem('md1_groq_key') || '';
  let model = localStorage.getItem('md1_groq_model') || 'llama-3.3-70b-versatile';
  let history = [];

  function updateStatus() {
    if (apiKey) {
      statusLine.textContent = `متصل — نموذج (${model})`;
      settingsPanel.classList.remove('open');
    } else {
      statusLine.textContent = 'غير متصل — يرجى إدخال مفتاح الـ API من الإعدادات';
      settingsPanel.classList.add('open');
    }
  }

  apiKeyInput.value = apiKey;
  modelSelect.value = model;
  updateStatus();

  settingsBtn.onclick = () => settingsPanel.classList.toggle('open');

  saveSettings.onclick = () => {
    apiKey = apiKeyInput.value.trim();
    model = modelSelect.value;
    localStorage.setItem('md1_groq_key', apiKey);
    localStorage.setItem('md1_groq_model', model);
    updateStatus();
  };

  function addMessage(text, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    chatWindow.appendChild(div);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;
    if (!apiKey) {
      addMessage('يجب إدخال مفتاح الـ API أولاً من لوحة الإعدادات بالأعلى.', 'error');
      settingsPanel.classList.add('open');
      return;
    }

    addMessage(text, 'user');
    history.push({ role: 'user', content: text });
    userInput.value = '';
    sendBtn.disabled = true;

    const typingMsg = addMessage('جاري تحليل الطلب والرد...', 'typing');

    // "حقن السياق" لشرح وتوجيه النموذج ليكون مساعداً رسمياً لموقع MD1usd.com والعملات الرقمية
    const systemPrompt = {
      role: "system",
      content: "أنت مساعد ذكي رسمي ومحترف لموقع MD1usd.com ومنصة mdm1.org. الموقع متخصص في مجال العملات الرقمية وتوفير أدوات ومولدات صفحات متطورة للمجتمع. مهمتك هي مساعدة الزوار، شرح أقسام الموقع وأدواته، والإجابة على أي استفسارات تقنية أو متعلقة بالعملات الرقمية بدقة عالية وبأسلوب احترافي باللغة العربية."
    };

    try {
      const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + apiKey
        },
        body: JSON.stringify({
          model: model,
          messages: [systemPrompt, ...history],
          temperature: 0.7,
          max_tokens: 1500
        })
      });

      typingMsg.remove();

      if (!response.ok) {
        const errText = await response.text();
        addMessage('حدث خطأ في الاتصال (' + response.status + '): ' + errText, 'error');
        sendBtn.disabled = false;
        return;
      }

      const data = await response.json();
      const reply = data.choices?.[0]?.message?.content || 'عذراً، لمارَد من الخادم استجابة.';
      addMessage(reply, 'bot');
      history.push({ role: 'assistant', content: reply });

    } catch (err) {
      typingMsg.remove();
      addMessage('فشل الاتصال بالشبكة: ' + err.message, 'error');
    }

    sendBtn.disabled = false;
    userInput.focus();
  }

  sendBtn.onclick = sendMessage;
  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 150) + 'px';
  });
</script>

</body>
</html>
