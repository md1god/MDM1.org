<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">MDM1 — بوابة الألعاب الأسطورية</title>

<style>
/* ============================================================
   RESET & CORE THEME
   ============================================================ */
:root {
  --bg-dark: #0b0c14;
  --bg-card: #171826;
  --bg-card-hover: #1f2136;
  --accent-pink: #ff2d78;
  --accent-cyan: #00d4ff;
  --accent-yellow: #ffcc00;
  --accent-purple: #8b5cf6;
  --accent-green: #2bd67b;
  --edu-orange: #ff8a3d;
  --edu-teal: #14c8b0;
  --text-bright: #ffffff;
  --text-sub: #9aa0b8;
  --grad-hero: linear-gradient(120deg, var(--accent-pink), var(--accent-purple) 55%, var(--accent-cyan));
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Tajawal', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  user-select: none;
}

html, body { max-width: 100%; overflow-x: hidden; }

body {
  background: var(--bg-dark);
  color: var(--text-bright);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  width: 100%;
}

/* Global scrollbar — pink, thin, visible everywhere (was reset to gray earlier) */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--accent-pink) rgba(255,255,255,0.06);
}
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-track { background: rgba(255,255,255,0.06); border-radius: 8px; }
*::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, var(--accent-pink), var(--accent-purple));
  border-radius: 8px;
  border: 2px solid transparent;
  background-clip: padding-box;
}
*::-webkit-scrollbar-thumb:hover { background: var(--accent-pink); background-clip: padding-box; }

[dir="ltr"] * { direction: ltr; }

/* ============================================================
   NAVBAR
   ============================================================ */
.app-navbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(18, 16, 43, 0.97);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  padding: 0.6rem 0.9rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.6rem;
  width: 100%;
  flex-wrap: wrap;
  position: relative;
}

.brand-logo {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  text-decoration: none;
  font-size: 1.4rem;
  font-weight: 900;
  color: #fff;
  letter-spacing: 0.5px;
  flex-shrink: 0;
}

.brand-badge {
  background: var(--grad-hero);
  background-size: 200% 200%;
  animation: badgeShift 6s ease infinite;
  color: #fff;
  padding: 0.25rem 0.7rem;
  border-radius: 8px;
  font-size: 1rem;
}

@keyframes badgeShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

/* Centered, glowing portal title */
.portal-title-center {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font-size: 1.15rem;
  font-weight: 900;
  color: #fff;
  white-space: nowrap;
  pointer-events: none;
  text-shadow:
    0 0 6px rgba(0, 212, 255, 0.9),
    0 0 14px rgba(255, 45, 120, 0.7),
    0 0 24px rgba(139, 92, 246, 0.6);
  animation: titleGlow 2.4s ease-in-out infinite;
  letter-spacing: 0.5px;
}
@keyframes titleGlow {
  0%, 100% {
    text-shadow:
      0 0 6px rgba(0, 212, 255, 0.7),
      0 0 12px rgba(255, 45, 120, 0.5),
      0 0 20px rgba(139, 92, 246, 0.4);
  }
  50% {
    text-shadow:
      0 0 12px rgba(0, 212, 255, 1),
      0 0 22px rgba(255, 45, 120, 0.9),
      0 0 36px rgba(139, 92, 246, 0.8);
  }
}
@media (max-width: 700px) {
  /* Keep it visible on mobile (was hidden before) but move it to its own
     row under the icons instead of overlapping them, and drop the glow
     animation (handled above) so it doesn't fight for attention with the
     rest of a busy small screen. */
  .app-navbar { flex-direction: column; align-items: stretch; padding-bottom: 0.5rem; }
  .portal-title-center {
    position: static;
    transform: none;
    order: 3;
    width: 100%;
    text-align: center;
    margin-top: 0.35rem;
    font-size: 1rem;
  }
  .brand-logo, .nav-actions { order: 1; }
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.btn-md1 {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  background: var(--accent-yellow);
  color: #12102b;
  font-weight: 800;
  font-size: 0.9rem;
  padding: 0.5rem 0.9rem;
  border-radius: 20px;
  text-decoration: none;
  transition: transform 0.15s ease;
}
.btn-md1:hover { transform: translateY(-1px) scale(1.03); }

.btn-audio, .btn-lang, .btn-refresh {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #fff;
  padding: 0.5rem 0.75rem;
  border-radius: 16px;
  cursor: pointer;
  font-size: 0.82rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 0.35rem;
  transition: background 0.15s;
  white-space: nowrap;
}
.btn-audio:hover, .btn-lang:hover, .btn-refresh:hover { background: rgba(255, 255, 255, 0.16); }

/* ============================================================
   LANGUAGE MODAL
   ============================================================ */
.lang-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(5,6,16,0.85);
  z-index: 3000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
.lang-modal-overlay.open { display: flex; }

.lang-modal {
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 18px;
  padding: 1.2rem;
  width: 100%;
  max-width: 420px;
  max-height: 80vh;
  overflow-y: auto;
}

.lang-modal h3 {
  font-size: 1.1rem;
  margin-bottom: 0.8rem;
  color: var(--accent-cyan);
}

.lang-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.6rem;
}

.lang-option {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  background: rgba(255,255,255,0.05);
  border: 2px solid transparent;
  border-radius: 12px;
  padding: 0.7rem 0.6rem;
  cursor: pointer;
  color: #fff;
  font-size: 0.95rem;
  font-weight: 700;
  transition: all 0.15s;
}
.lang-option .flag { font-size: 1.5rem; }
.lang-option:hover { background: rgba(255,255,255,0.1); }
.lang-option.active { border-color: var(--accent-pink); background: rgba(255,45,120,0.12); }

/* ============================================================
   LAYOUT
   ============================================================ */
.page-body { display: flex; width: 100%; flex: 1; }

.category-rail {
  width: 190px;
  flex-shrink: 0;
  padding: 0.9rem 0.6rem;
  border-left: 1px solid rgba(255,255,255,0.06);
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
  height: 100vh;
  position: sticky;
  top: 0;
  overflow-y: auto;
  overflow-x: hidden;
}
[dir="ltr"] .category-rail { border-left: none; border-right: 1px solid rgba(255,255,255,0.06); }

.rail-link {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  padding: 0.55rem 0.6rem;
  border-radius: 8px;
  color: var(--text-sub);
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  background: transparent;
  border: none;
  width: 100%;
  text-align: inherit;
  transition: background 0.15s, color 0.15s, transform 0.1s;
  flex-shrink: 0;
}
.rail-link:hover { background: rgba(255,255,255,0.06); color: #fff; transform: translateX(2px); }
[dir="ltr"] .rail-link:hover { transform: translateX(-2px); }
.rail-link.active { background: var(--accent-pink); color: #fff; }
.rail-link.edu-link.active { background: linear-gradient(90deg, var(--edu-orange), var(--edu-teal)); }

.rail-section-title {
  font-size: 0.72rem;
  color: var(--text-sub);
  opacity: 0.6;
  padding: 0.8rem 0.6rem 0.2rem;
  font-weight: 800;
  flex-shrink: 0;
}

.main-container {
  flex: 1;
  min-width: 0;
  max-width: 100%;
  padding: 0.8rem 1rem 2rem;
  width: 100%;
}

/* ============================================================
   PINNED / FEATURED GAMES ROW (hand-picked famous titles)
   ============================================================ */
.pinned-row {
  margin-bottom: 0.8rem;
}
.pinned-row-title {
  font-size: 0.85rem;
  font-weight: 800;
  color: var(--accent-yellow);
  margin-bottom: 0.4rem;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.pinned-scroll {
  display: flex;
  gap: 0.6rem;
  overflow-x: auto;
  padding-bottom: 0.4rem;
}
.pinned-card {
  flex: 0 0 auto;
  width: 120px;
  cursor: pointer;
  background: var(--bg-card);
  border-radius: 12px;
  overflow: hidden;
  border: 2px solid rgba(255,204,0,0.4);
  transition: transform 0.15s ease;
}
.pinned-card:hover { transform: translateY(-3px); border-color: var(--accent-yellow); }
.pinned-card .game-thumb { aspect-ratio: 1/1; }
.pinned-card .game-details { padding: 0.35rem 0.4rem; }
.pinned-card .game-title { font-size: 0.72rem; }

/* ============================================================
   TRENDING TICKER (single deliberate motion element)
   ============================================================ */
.trending-ticker {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  background: linear-gradient(90deg, rgba(255,45,120,0.15), rgba(0,212,255,0.1));
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 0.5rem 0.9rem;
  margin-bottom: 0.7rem;
  overflow: hidden;
  white-space: nowrap;
}
.ticker-label {
  flex-shrink: 0;
  font-size: 0.78rem;
  font-weight: 800;
  color: var(--accent-yellow);
  padding-inline-end: 0.6rem;
  border-inline-end: 1px solid rgba(255,255,255,0.15);
}
.ticker-track-wrap { overflow: hidden; flex: 1; }
.ticker-track {
  display: flex;
  gap: 1.4rem;
  animation: tickerScroll 28s linear infinite;
  width: max-content;
}
[dir="rtl"] .ticker-track { animation-direction: reverse; }
.ticker-item { font-size: 0.8rem; color: var(--text-sub); font-weight: 600; }
@keyframes tickerScroll {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}
@media (prefers-reduced-motion: reduce) {
  .ticker-track { animation: none; }
  .brand-badge { animation: none; }
  .portal-title-center { animation: none; }
}

/* Mobile performance mode: continuous CSS animations (glow/shift/ticker-scroll)
   keep the GPU/CPU busy at all times, which is a real contributor to heat and
   battery drain on phones. On narrow screens we keep the visuals (color,
   pink glow) but stop them from running nonstop — they still render, just
   as a static glow instead of an infinite animation loop. */
@media (max-width: 700px) {
  .brand-badge { animation: none; background-position: 30% 50%; }
  .portal-title-center { animation: none; }
  .ticker-track { animation-duration: 45s; }
}

/* ============================================================
   TOOLBAR: SEARCH + STATS + VOICE
   ============================================================ */
.toolbar-section {
  margin: 0 0 0.8rem;
  display: flex;
  align-items: center;
  gap: 0.8rem;
  flex-wrap: wrap;
  width: 100%;
}
.stats-bar { order: 2; }
.search-wrapper { order: 1; }
@media (max-width: 700px) {
  .stats-bar { order: 1; width: 100%; }
  .search-wrapper { order: 2; width: 100%; }
}

.search-wrapper {
  position: relative;
  flex: 1;
  min-width: 220px;
}

.search-input {
  width: 100%;
  padding: 0.6rem 3rem 0.6rem 2.6rem;
  background: var(--bg-card);
  border: 2px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  color: #fff;
  font-size: 0.92rem;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
[dir="ltr"] .search-input { padding: 0.6rem 2.6rem 0.6rem 3rem; }

.search-input:focus {
  border-color: var(--accent-cyan);
  box-shadow: 0 0 0 4px rgba(0,212,255,0.15);
}

.search-icon {
  position: absolute;
  left: 0.9rem;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1rem;
  color: var(--text-sub);
  pointer-events: none;
}
[dir="ltr"] .search-icon { left: auto; right: 0.9rem; }

.mic-btn {
  position: absolute;
  right: 0.6rem;
  top: 50%;
  transform: translateY(-50%);
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.08);
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9rem;
  transition: background 0.15s;
}
[dir="ltr"] .mic-btn { right: auto; left: 0.6rem; }
.mic-btn:hover { background: rgba(255,255,255,0.16); }
.mic-btn.listening {
  background: var(--accent-pink);
  animation: micPulse 1s ease infinite;
}
@keyframes micPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,45,120,0.5); }
  50% { box-shadow: 0 0 0 8px rgba(255,45,120,0); }
}

.stats-bar {
  display: flex;
  align-items: center;
  gap: 1rem;
  font-size: 0.82rem;
  color: var(--text-sub);
  font-weight: 700;
  white-space: nowrap;
}
#gamesCount { color: var(--accent-green); }

.filter-bar { display: none; }

/* ============================================================
   GAMES GRID
   ============================================================ */
.games-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.55rem;
  list-style: none;
  margin-top: 0.3rem;
  width: 100%;
}
@media (min-width: 500px) { .games-grid { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 700px) { .games-grid { grid-template-columns: repeat(5, 1fr); } }
@media (min-width: 950px) { .games-grid { grid-template-columns: repeat(6, 1fr); } }
@media (min-width: 1200px) { .games-grid { grid-template-columns: repeat(7, 1fr); } }
@media (min-width: 1500px) { .games-grid { grid-template-columns: repeat(8, 1fr); } }

.game-card {
  background: var(--bg-card);
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  display: flex;
  flex-direction: column;
  border: 2px solid transparent;
}
.game-card:hover {
  transform: translateY(-4px) scale(1.02);
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}
.game-card.edu-card { border-color: rgba(20, 200, 176, 0.35); }
.game-card.edu-card:hover { border-color: var(--edu-teal); }
.game-card.unity-card { border-color: rgba(255, 204, 0, 0.35); }
.game-card.unity-card:hover { border-color: var(--accent-yellow); }

.game-thumb {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  background: #0a0920;
}
.game-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

.corner-badge {
  position: absolute;
  top: 6px;
  inset-inline-start: 6px;
  font-size: 0.62rem;
  font-weight: 800;
  padding: 0.15rem 0.45rem;
  border-radius: 6px;
  color: #12102b;
  z-index: 2;
}
.corner-badge.edu { background: var(--edu-teal); color: #06231e; }
.corner-badge.unity { background: var(--accent-yellow); }
.corner-badge.featured { background: var(--accent-pink); color: #fff; }
.corner-badge.new { background: var(--accent-green); color: #06231e; }
.corner-badge.top { background: var(--accent-purple); color: #fff; }
.corner-badge.pinned3d { background: var(--accent-cyan); color: #06231e; }

.play-badge {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.12s ease;
}
.game-card:hover .play-badge { opacity: 1; }

.play-btn-circle {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--accent-cyan);
  color: #0b0c14;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
}

.game-details {
  padding: 0.4rem 0.15rem 0;
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
}
.game-title {
  font-size: 0.78rem;
  font-weight: 700;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.game-cat-tag { font-size: 0.66rem; font-weight: 600; color: var(--text-sub); }

/* EMPTY STATE FOR CATEGORIES WITH NO GAMES YET (e.g. fresh "new") */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 3rem 1rem;
  color: var(--text-sub);
}
.empty-state .emoji { font-size: 2.5rem; margin-bottom: 0.6rem; }

/* LOADER & LOAD MORE */
.portal-loader { text-align: center; padding: 3rem 1rem; color: var(--text-sub); }
.spinner {
  width: 42px; height: 42px; margin: 0 auto 1rem;
  border: 4px solid rgba(255,255,255,0.12);
  border-top-color: var(--accent-cyan);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.load-more-wrap { display: flex; justify-content: center; margin: 2rem 0; gap: 0.6rem; flex-wrap: wrap; }
.btn-load-more {
  display: none;
  background: var(--bg-card);
  border: 1px solid var(--accent-cyan);
  color: #fff;
  padding: 0.65rem 1.8rem;
  border-radius: 20px;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
}
.btn-load-more:hover { background: var(--accent-cyan); color: #0b0c14; }
.btn-load-more.secondary { border-color: var(--accent-pink); }
.btn-load-more.secondary:hover { background: var(--accent-pink); }

@media (max-width: 700px) {
  .category-rail { display: none; }
  .filter-bar {
    display: flex; gap: 0.5rem; overflow-x: auto;
    padding: 0.3rem 0 0.7rem; scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .chip-btn {
    background: var(--bg-card);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-sub);
    padding: 0.4rem 0.85rem;
    border-radius: 16px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.1s;
  }
  .chip-btn:active { transform: scale(0.95); }
  .chip-btn.active { background: var(--accent-pink); color: #fff; border-color: transparent; }
  .chip-btn.edu-chip.active { background: linear-gradient(90deg, var(--edu-orange), var(--edu-teal)); }
}

/* ============================================================
   PLAY OVERLAY
   ============================================================ */
.play-overlay {
  position: fixed; inset: 0;
  background: rgba(5, 6, 16, 0.97);
  z-index: 2000; display: none; flex-direction: column;
}
.play-overlay.open { display: flex; }

.overlay-topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.8rem 1.2rem; background: #171432;
  border-bottom: 2px solid rgba(255, 255, 255, 0.08);
}
.overlay-title {
  font-size: 1.05rem; font-weight: 800; color: var(--accent-cyan);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50%;
}
.topbar-btns { display: flex; gap: 0.6rem; }
.ctrl-btn {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.18);
  color: #fff; padding: 0.5rem 0.9rem; border-radius: 10px;
  cursor: pointer; font-size: 0.9rem; font-weight: 700;
  display: flex; align-items: center; gap: 0.3rem; transition: all 0.2s;
}
.ctrl-btn:hover { background: rgba(255, 61, 154, 0.22); border-color: var(--accent-pink); }
.ctrl-btn.close-btn { background: rgba(255, 61, 154, 0.85); border-color: transparent; }
.ctrl-btn.close-btn:hover { background: var(--accent-pink); box-shadow: 0 0 12px rgba(255, 61, 154, 0.6); }

.stage-wrapper { position: relative; flex: 1; background: #000; }
.stage-wrapper iframe { width: 100%; height: 100%; border: none; display: block; }

.stage-loader-box {
  position: absolute; inset: 0; background: #12102b;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1rem; z-index: 10;
}
.stage-loader-box.hidden { display: none; }

/* Accessible focus visibility */
button:focus-visible, input:focus-visible, .game-card:focus-visible {
  outline: 3px solid var(--accent-cyan);
  outline-offset: 2px;
}
</style>
</head>
<body>

<audio id="bg-music" src="audio/games.opus" loop preload="none"></audio>

<!-- NAVBAR -->
<header class="app-navbar">
  <a href="index.html" class="brand-logo">
    <span class="brand-badge">MDM1</span>
  </a>

  <span class="portal-title-center" id="portalTitleText">بوابة الألعاب</span>

  <div class="nav-actions">
    <button id="refreshBtn" class="btn-refresh" title="تحديث الألعاب">
      <span>🔄</span><span>تحديث</span>

  // of images/DOM nodes in memory at the same time, which is what was

      cat_all: "Populaire", cat_new: "Nouveau", cat_top: "Les mieux notés", cat_multiplayer: "Multijoueur",
      cat_2player: "2 Joueurs", cat_section_title: "Catégories", cat_educational: "Éducatif", cat_unity: "Qualité Unity",
      cat_action: "Action", cat_shooting: "Tir", cat_racing: "Course", cat_puzzle: "Puzzle",
      cat_sports: "Sport", cat_simulation: "Simulation", cat_adventure: "Aventure", cat_arcade: "Arcade",
      cat_girls: "Filles", cat_kids: "Enfants", cat_io: "Jeux IO", cat_cooking: "Cuisine", cat_clicker: "Clicker",
      cat_famous: "Jeux célèbres", cat_3d: "3D",
      educational_badge: "Éduc", unity_badge: "Unity", featured_badge: "Vedette", new_badge: "Nouveau", top_badge: "Top",
      pinned3d_badge: "3D"

  async function loadLanguage(code) {
    try {
      const res = await fetch(I18N_BASE + code + ".json");
      if (!res.ok) throw new Error("lang file missing");
      I18N = await res.json();
    } catch (err) {
      // Fall back to built-in translations if i18n/*.json files are missing on the server
      I18N = FALLBACK_I18N[code] || FALLBACK_I18N.ar;
    }
    currentLang = code;
    localStorage.setItem("mdm1_lang", code);
    applyTranslations();
    buildLangGrid();
  }

  function t(key, fallback) {
    return (I18N && I18N[key] !== undefined) ? I18N[key] : (fallback || key);
  }

  function applyTranslations() {
    const html = document.getElementById("htmlRoot");
    html.setAttribute("lang", currentLang);
    html.setAttribute("dir", I18N.dir || "ltr");
    document.getElementById("pageTitle").textContent = "MDM1 — " + t("portal_title");
    document.getElementById("portalTitleText").textContent = t("portal_title");
    document.getElementById("audioText").textContent = t("audio_label");
    document.getElementById("langButtonText").textContent = t("language_button");
    document.getElementById("langModalTitle").textContent = t("language_modal_title");
    document.getElementById("langFlag").textContent = t("lang_flag");
    gamesSearch.placeholder = t("search_placeholder");
    micBtn.title = t("voice_search_title");
    loadMoreBtn.textContent = t("load_more");
    fetchMoreBtn.textContent = t("fetch_more");
    playTitle.textContent = currentGame ? (currentGame.title || t("play_default_title")) : t("play_default_title");
    btnReload.textContent = t("btn_reload");
    btnFullscreen.textContent = t("btn_fullscreen");
    btnClose.textContent = t("btn_close");

    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      el.textContent = t(key);
    });

    updateStats();
    if (ALL_GAMES.length) {
      applyFilters();
      renderTicker();
      renderPinnedRow();
    }
  }

  async function buildLangGrid() {
    langGrid.innerHTML = "";
    for (const code of AVAILABLE_LANGS) {
      let meta;
      if (code === currentLang) {
        meta = I18N;
      } else {
        try {
          const res = await fetch(I18N_BASE + code + ".json");
          meta = await res.json();
        } catch (e) {
          meta = FALLBACK_I18N[code];
        }
      }
      if (!meta) continue;
      const btn = document.createElement("button");
      btn.className = "lang-option" + (code === currentLang ? " active" : "");
      btn.innerHTML = `<span class="flag">${meta.lang_flag || "🏳️"}</span><span>${meta.lang_name || code}</span>`;
      btn.addEventListener("click", () => {
        loadLanguage(code);
        langModal.classList.remove("open");
      });
      langGrid.appendChild(btn);
    }
  }

  langToggle.addEventListener("click", () => langModal.classList.add("open"));
  langModal.addEventListener("click", (e) => {
    if (e.target === langModal) langModal.classList.remove("open");
  });

  /* ============================================================
     CATEGORY NORMALIZATION
     ============================================================ */
  function normalizeCategory(category, tags, title) {
    const c = String(category || "").trim().toLowerCase();
    const t2 = String(tags || "").trim().toLowerCase();
    const ti = String(title || "").trim().toLowerCase();
    const hay = c + " " + t2 + " " + ti;

    if (/educational|learn|abc|alphabet|tracing|toddler|preschool|math|quiz/.test(hay)) return "educational";
    if (c === "unity" || /unity3d|unity engine/.test(hay)) return "unity";
    if (/shoot|gun|sniper|swat|fps|war|army|zombie/.test(hay)) return "shooting";
    if (/\.io\b|io game|\biogame\b/.test(hay)) return "io";
    if (/2 player|2player|two player/.test(hay)) return "2player";
    if (/multiplayer|online battle|pvp|\.io/.test(hay)) return "multiplayer";
    if (/cook|restaurant|bakery|kitchen|chef/.test(hay)) return "cooking";
    if (/clicker|idle|incremental/.test(hay)) return "clicker";
    if (/girl|dress|makeup|makeover|fashion/.test(hay)) return "girls";
    if (/action|fight|boxing|battle|combat|ninja|hero/.test(hay)) return "action";
    if (/puzzle|brain|logic|match|block|maze/.test(hay)) return "puzzle";
    if (/racing|race|drive|car|moto|bike/.test(hay)) return "racing";
    if (/sport|soccer|football|basketball|golf|volleyball|tennis/.test(hay)) return "sports";
    if (/simulat|tycoon|farm|build|craft|shop/.test(hay)) return "simulation";
    if (/adventure|explor|quest|rpg|world/.test(hay)) return "adventure";
    if (/kids|baby|cute|toddler/.test(hay)) return "kids";
    if (/arcade|runner|jump/.test(hay)) return "arcade";
    return c || "arcade";
  }

  function isFamousGame(title, tags, category) {
    const hay = (String(title || "") + " " + String(tags || "") + " " + String(category || "")).toLowerCase();
    return FAMOUS_KEYWORDS.some(kw => hay.includes(kw));
  }

  function is3DGame(tags, category, title) {
    const hay = (String(tags || "") + " " + String(category || "") + " " + String(title || "")).toLowerCase();
    return /\b3d\b/.test(hay);
  }

  function categoryLabel(cat) {
    const key = "cat_" + cat;
    return t(key, cat || "");
  }

  function escapeHTML(str) {
    return String(str || "").replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' }[m]));
  }

  /* ============================================================
     GAME MONETIZE FEED — FETCH & NORMALIZE
     ============================================================ */
  function normalizeFeedItem(raw) {
    if (!raw || !raw.url) return null;
    const title = raw.title || raw.name || "Game";
    const category = raw.category || "";
    const tags = raw.tags || "";
    const cat = normalizeCategory(category, tags, title);
    const dateAdded = parseInt(raw.date_added || raw.date_modified || 0, 10) || 0;
    const rating = parseFloat(raw.rating_avg || raw.rating || 0) || 0;
    const ratingCount = parseInt(raw.rating_count || 0, 10) || 0;

    return {
      id: raw.id || raw.url,
      title: title,
      thumb: raw.thumb || raw.thumb_1 || raw.thumb_2 || "",
      url: raw.url,
      category: category,
      tags: tags,
      _cat: cat,
      _dateAdded: dateAdded,
      _rating: rating,
      _ratingCount: ratingCount,
      _famous: isFamousGame(title, tags, category),
      _is3d: is3DGame(tags, category, title),
      featured: (rating >= 4.3 && ratingCount >= 50),
      width: raw.width || "800",
      height: raw.height || "600"
    };
  }

  async function fetchFeedPage(page) {
    const url = FEED_BASE + "&page=" + page;
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("feed http " + res.status);
    const data = await res.json();
    if (!Array.isArray(data)) return [];
    return data.map(normalizeFeedItem).filter(Boolean);
  }

  function mergeGames(newGames) {
    const seen = new Set(ALL_GAMES.map(g => g.id));
    let added = 0;
    for (const g of newGames) {
      if (!seen.has(g.id)) {
        ALL_GAMES.push(g);
        seen.add(g.id);
        added++;
      }
    }
    return added;
  }

  function saveCache() {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), games: ALL_GAMES, nextPage: nextFeedPage }));
    } catch (e) { /* storage full or unavailable — ignore, feed is source of truth */ }
  }

  function loadCache() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return false;
      const parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.games) || !parsed.games.length) return false;
      if (Date.now() - (parsed.t || 0) > CACHE_TTL_MS) return false;
      ALL_GAMES = parsed.games;
      nextFeedPage = parsed.nextPage || 1;
      return true;
    } catch (e) {
      return false;
    }
  }

  async function loadLocalFallback() {
    try {
      const res = await fetch(LOCAL_CACHE_URL, { cache: "no-store" });
      if (!res.ok) return 0;
      const data = await res.json();
      if (!Array.isArray(data)) return 0;
      const normalized = data.map(normalizeFeedItem).filter(Boolean);
      return mergeGames(normalized);
    } catch (e) {
      return 0;
    }
  }

  async function fetchFeedPages(pageCount) {
    let totalAdded = 0;
    let consecutiveEmpty = 0;
    for (let i = 0; i < pageCount; i++) {
      const page = nextFeedPage;
      try {
        const items = await fetchFeedPage(page);
        if (!items.length) {
          consecutiveEmpty++;
          nextFeedPage++;
          // Some feed pages can legitimately come back empty/duplicated;
          // only stop after a few in a row so we don't cut the crawl short
          // and shrink the effective game count over time.
          if (consecutiveEmpty >= 3) break;
          continue;
        }
        consecutiveEmpty = 0;
        totalAdded += mergeGames(items);
        nextFeedPage++;
      } catch (err) {
        console.error("Feed fetch failed on page", page, err);
        break;
      }
    }
    return totalAdded;
  }

  async function initialLoad() {
    portalLoader.style.display = "block";
    gamesGrid.innerHTML = "";

    const hadCache = loadCache();
    if (hadCache) {
      portalLoader.style.display = "none";
      applyFilters();
      renderTicker();
      renderPinnedRow();
    }

    let added = 0;
    try {
      added = await fetchFeedPages(FEED_PAGES_ON_LOAD);
    } catch (e) {
      console.error("Initial feed load failed", e);
    }

    if (!ALL_GAMES.length) {
      await loadLocalFallback();
    }

    portalLoader.style.display = "none";

    if (!ALL_GAMES.length) {
      gamesCount.textContent = t("no_results", "تعذر تحميل الألعاب — تحقق من الاتصال");
      return;
    }

    saveCache();
    applyFilters();
    renderTicker();
    renderPinnedRow();
  }

  async function fetchMoreFromSource() {
    if (isFetchingMore) return;
    isFetchingMore = true;
    fetchMoreBtn.textContent = "⏳ ...";
    try {
      await fetchFeedPages(FEED_PAGES_PER_FETCH_MORE);
      saveCache();
      applyFilters();
      renderTicker();
      renderPinnedRow();
    } catch (e) {
      console.error("fetchMoreFromSource failed", e);
    } finally {
      isFetchingMore = false;
      fetchMoreBtn.textContent = t("fetch_more");
    }
  }

  fetchMoreBtn.addEventListener("click", fetchMoreFromSource);
  refreshBtn.addEventListener("click", () => {
    localStorage.removeItem(CACHE_KEY);
    ALL_GAMES = [];
    nextFeedPage = 1;
    initialLoad();
  });

  /* ============================================================
     PINNED ROW (famous titles surfaced immediately)
     ============================================================ */
  function renderPinnedRow() {
    const famous = ALL_GAMES.filter(g => g._famous);
    if (!famous.length) {
      pinnedRow.style.display = "none";
      return;
    }
    pinnedRow.style.display = "block";
    pinnedScroll.innerHTML = "";
    famous.slice(0, 20).forEach(game => {
      const card = createGameCard(game, { pinned: true });
      pinnedScroll.appendChild(card);
    });
  }

  /* ============================================================
     FILTERING & RENDER
     ============================================================ */
  function isNewGame(game) {
    if (!game._dateAdded) return false;
    const ageMs = Date.now() - (game._dateAdded * 1000);
    return ageMs >= 0 && ageMs <= NEW_GAME_WINDOW_DAYS * 24 * 60 * 60 * 1000;
  }

  function gamesForCategory(cat) {
    if (cat === "all") {
      return ALL_GAMES.slice().sort((a, b) => (b._rating * b._ratingCount) - (a._rating * a._ratingCount));
    }
    if (cat === "new") {
      return ALL_GAMES.filter(isNewGame).sort((a, b) => b._dateAdded - a._dateAdded);
    }
    if (cat === "top") {
      return ALL_GAMES.filter(g => g._ratingCount > 0).sort((a, b) => b._rating - a._rating || b._ratingCount - a._ratingCount);
    }
    if (cat === "famous") {
      return ALL_GAMES.filter(g => g._famous);
    }
    if (cat === "3d") {
      return ALL_GAMES.filter(g => g._is3d).sort((a, b) => (b._rating * b._ratingCount) - (a._rating * a._ratingCount));
    }
    return ALL_GAMES.filter(g => g._cat === cat);
  }

  function applyFilters() {
    const q = searchText.trim().toLowerCase();
    let base = gamesForCategory(activeCategory);

    visibleGames = base.filter(game => {
      if (!q) return true;
      return [game.title, game.category, game.tags].filter(Boolean).join(" ").toLowerCase().includes(q);
    });

    renderedCount = 0;
    gamesGrid.innerHTML = "";
    updateStats();

    if (visibleGames.length === 0) {
      const li = document.createElement("li");
      li.className = "empty-state";
      const isEduEmpty = activeCategory === "educational";
      li.innerHTML = `<div class="emoji">${isEduEmpty ? "🎓" : "🔍"}</div><div>${escapeHTML(t("no_results"))}</div>`;
      gamesGrid.appendChild(li);
      loadMoreBtn.style.display = "none";
      return;
    }

    renderNextBatch();
  }

  function updateStats() {
    const n = ALL_GAMES.length;
    gamesCount.textContent = n.toLocaleString(currentLang === "ar" ? "ar-EG" : currentLang) + " " + t("games_count_suffix");
  }

  function createGameCard(game, opts) {
    opts = opts || {};
    const li = document.createElement("li");
    li.className = "game-card";
    if (opts.pinned) li.classList.add("pinned-card");
    if (game._cat === "educational") li.classList.add("edu-card");
    if (game._cat === "unity") li.classList.add("unity-card");

    const title = escapeHTML(game.title || "Game");
    const cat = escapeHTML(categoryLabel(game._cat));
    const thumb = game.thumb
      ? `<img src="${escapeHTML(game.thumb)}" alt="${title}" loading="lazy" onerror="this.parentElement.innerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;height:100%;color:#fff;font-size:2rem;\\'>🎮</div>'">`
      : `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#fff;font-size:2rem;">🎮</div>`;

    let badge = "";
    if (opts.pinned && game._is3d) badge = `<span class="corner-badge pinned3d">${escapeHTML(t("pinned3d_badge"))}</span>`;
    else if (game._cat === "educational") badge = `<span class="corner-badge edu">${escapeHTML(t("educational_badge"))}</span>`;
    else if (game._cat === "unity") badge = `<span class="corner-badge unity">${escapeHTML(t("unity_badge"))}</span>`;
    else if (isNewGame(game)) badge = `<span class="corner-badge new">${escapeHTML(t("new_badge"))}</span>`;
    else if (game.featured) badge = `<span class="corner-badge featured">${escapeHTML(t("featured_badge"))}</span>`;
    else if (game._rating >= 4.5) badge = `<span class="corner-badge top">${escapeHTML(t("top_badge"))}</span>`;

    li.innerHTML = `
      <div class="game-thumb">
        ${badge}
        ${thumb}
        <div class="play-badge"><div class="play-btn-circle">▶</div></div>
      </div>
      <div class="game-details">
        <div class="game-title">${title}</div>
        <div class="game-cat-tag">${cat}</div>
      </div>
    `;

    li.addEventListener("click", () => openGame(game));
    li.setAttribute("tabindex", "0");
    li.addEventListener("keydown", (e) => { if (e.key === "Enter") openGame(game); });
    return li;
  }

  function renderNextBatch() {
    if (renderedCount >= visibleGames.length) {
      loadMoreBtn.style.display = "none";
      return;
    }
    const fragment = document.createDocumentFragment();
    const end = Math.min(renderedCount + BATCH_SIZE, visibleGames.length);
    for (let i = renderedCount; i < end; i++) {
      fragment.appendChild(createGameCard(visibleGames[i]));
    }
    gamesGrid.appendChild(fragment);
    renderedCount = end;
    loadMoreBtn.style.display = (renderedCount < visibleGames.length) ? "inline-flex" : "none";
  }

  loadMoreBtn.addEventListener("click", renderNextBatch);

  /* ============================================================
     TICKER (trending strip)
     ============================================================ */
  function renderTicker() {
    const top = ALL_GAMES
      .filter(g => g._ratingCount > 0)
      .sort((a, b) => (b._rating * b._ratingCount) - (a._rating * a._ratingCount))
      .slice(0, 12);
    const source = top.length ? top : ALL_GAMES.slice(0, 12);
    const items = source.map(g => `<span class="ticker-item">🔥 ${escapeHTML(g.title)}</span>`);
    tickerTrack.innerHTML = items.concat(items).join("");
  }

  /* ============================================================
     CATEGORY NAVIGATION
     ============================================================ */
  function setActiveCategory(cat) {
    activeCategory = cat;
    document.querySelectorAll(".rail-link, .chip-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.category === cat);
    });
    applyFilters();
  }

  categoryRail.addEventListener("click", (e) => {
    const btn = e.target.closest(".rail-link");
    if (btn) setActiveCategory(btn.dataset.category);
  });

  filterBar.addEventListener("click", (e) => {
    const btn = e.target.closest(".chip-btn");
    if (btn) setActiveCategory(btn.dataset.category);
  });

  /* ============================================================
     SEARCH
     ============================================================ */
  let searchDebounce = null;
  gamesSearch.addEventListener("input", (e) => {
    searchText = e.target.value;
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(applyFilters, 200);
  });

  /* Voice search */
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognitionAPI) {
    const recognition = new SpeechRecognitionAPI();
    recognition.continuous = false;
    recognition.interimResults = false;
    micBtn.addEventListener("click", () => {
      try {
        recognition.lang = currentLang === "ar" ? "ar-EG" : (currentLang === "fr" ? "fr-FR" : "en-US");
        recognition.start();
        micBtn.classList.add("listening");
      } catch (e) { /* recognition may already be running */ }
    });
    recognition.addEventListener("result", (e) => {
      const text = e.results[0][0].transcript;
      gamesSearch.value = text;
      searchText = text;
      applyFilters();
    });
    recognition.addEventListener("end", () => micBtn.classList.remove("listening"));
    recognition.addEventListener("error", () => micBtn.classList.remove("listening"));
  } else {
    micBtn.style.display = "none";
  }

  /* ============================================================
     PLAY OVERLAY
     ============================================================ */
  // Tracks whether music was actually playing right before we opened a game,
  // independent of bgMusic.paused — mobile browsers can leave that flag in
  // an inconsistent state around autoplay restrictions, which is why music
  // wasn't reliably stopping/resuming before.
  let wasMusicPlayingBeforeGame = false;

  function openGame(game) {
    currentGame = game;
    playTitle.textContent = game.title || t("play_default_title");
    stageLoader.classList.remove("hidden");
    gameFrame.src = "about:blank";
    playOverlay.classList.add("open");
    document.body.style.overflow = "hidden";

    wasMusicPlayingBeforeGame = !bgMusic.paused && !isMuted;
    if (wasMusicPlayingBeforeGame) {
      audioTimeBeforeGame = bgMusic.currentTime;
      bgMusic.pause();
    }

    setTimeout(() => { gameFrame.src = game.url; }, 60);
  }

  gameFrame.addEventListener("load", () => {
    if (gameFrame.src !== "about:blank") {
      stageLoader.classList.add("hidden");
    }
  });

  function closeGame() {
    playOverlay.classList.remove("open");
    gameFrame.src = "about:blank";
    document.body.style.overflow = "";
    currentGame = null;
    if (wasMusicPlayingBeforeGame) {
      bgMusic.currentTime = audioTimeBeforeGame;
      bgMusic.play().catch(() => {});
    }
    wasMusicPlayingBeforeGame = false;
  }

  btnClose.addEventListener("click", closeGame);
  btnReload.addEventListener("click", () => {
    if (!currentGame) return;
    stageLoader.classList.remove("hidden");
    gameFrame.src = "about:blank";
    setTimeout(() => { gameFrame.src = currentGame.url; }, 60);
  });
  btnFullscreen.addEventListener("click", () => {
    if (playStage.requestFullscreen) playStage.requestFullscreen();
    else if (playStage.webkitRequestFullscreen) playStage.webkitRequestFullscreen();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && playOverlay.classList.contains("open")) closeGame();
  });

  /* ============================================================
     AUDIO TOGGLE
     ============================================================ */
  audioToggle.addEventListener("click", () => {
    if (bgMusic.paused) {
      bgMusic.play().catch(() => {});
      audioIcon.textContent = "🔊";
      isMuted = false;
    } else {
      bgMusic.pause();
      audioIcon.textContent = "🔇";
      isMuted = true;
    }
  });

  /* ============================================================
     BOOT
     ============================================================ */
  loadLanguage(currentLang).then(initialLoad);

})();
</script>
</body>
</html>
