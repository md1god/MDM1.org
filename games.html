<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MDM1 — قاعة الألعاب</title>

<!-- تم تعديل المسارات لتشير إلى جذر الموقع مباشرة -->
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/pages.css">

<style>
/* ============================================================
   MDM1 GAMES PORTAL
   ============================================================ */

.games-toolbar {
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
  margin-bottom: 1rem;
}

.games-search {
  width: 100%;
  box-sizing: border-box;
  padding: 0.85rem 1rem;
  border-radius: 12px;
  border: 1px solid rgba(201,168,76,0.22);
  background: rgba(201,168,76,0.04);
  color: var(--light);
  outline: none;
  font-family: 'Tajawal', sans-serif;
  font-size: 0.95rem;
}

.games-search:focus {
  border-color: var(--gold-bright);
  background: rgba(201,168,76,0.07);
}

.games-search::placeholder {
  color: rgba(232,213,163,0.4);
}

.games-stats {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.7rem;
  color: rgba(232,213,163,0.5);
  font-family: 'Tajawal', sans-serif;
  font-size: 0.78rem;
}

.games-filter {
  display: flex;
  gap: 0.6rem;
  overflow-x: auto;
  padding: 0.5rem 0 1.5rem;
  scrollbar-width: none;
}

.games-filter::-webkit-scrollbar {
  display: none;
}

.filter-chip {
  flex: 0 0 auto;
  font-family: 'Tajawal', sans-serif;
  font-size: 0.85rem;
  font-weight: 700;
  padding: 0.5rem 1.2rem;
  border-radius: 20px;
  border: 1px solid rgba(201,168,76,0.2);
  background: rgba(201,168,76,0.03);
  color: rgba(232,213,163,0.6);
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.3s;
}

.filter-chip:hover,
.filter-chip.active {
  border-color: var(--gold-bright);
  color: var(--gold-bright);
  background: rgba(201,168,76,0.14);
}

/* ============================================================
   GRID
   ============================================================ */

.games-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1rem;
  list-style: none;
  margin: 0 0 2rem;
  padding: 0;
}

@media (min-width: 640px) {
  .games-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 1.25rem;
  }
}

@media (min-width: 1024px) {
  .games-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

@media (min-width: 1400px) {
  .games-grid {
    grid-template-columns: repeat(5, 1fr);
  }
}

.game-card {
  background: rgba(201,168,76,0.04);
  border: 1px solid rgba(201,168,76,0.15);
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.25s, border-color 0.25s, background 0.25s;
  list-style: none;
  padding: 0;
  content-visibility: auto;
  contain-intrinsic-size: 220px;
}

.game-card:hover {
  border-color: rgba(201,168,76,0.4);
  background: rgba(201,168,76,0.08);
  transform: translateY(-3px);
}

.game-card:active {
  transform: scale(0.97);
}

.game-thumb {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  background: linear-gradient(
    160deg,
    rgba(201,168,76,0.08),
    var(--void)
  );
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.game-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.thumb-fallback {
  font-size: 2rem;
  color: var(--gold-dim);
}

.play-badge {
  position: absolute;
  bottom: 8px;
  left: 8px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(5,4,3,0.78);
  border: 1px solid rgba(201,168,76,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--gold-bright);
  font-size: 0.8rem;
}

.game-info {
  padding: 0.7rem 0.8rem 0.9rem;
}

.game-name {
  font-family: 'Tajawal', sans-serif;
  font-weight: 700;
  font-size: 0.92rem;
  color: var(--light);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.game-tag {
  font-family: 'Cinzel', serif;
  font-size: 0.68rem;
  color: var(--gold);
  letter-spacing: 0.05em;
  margin-top: 0.2rem;
}

.games-empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 3rem 1rem;
  color: rgba(232,213,163,0.5);
  font-size: 0.95rem;
}

/* ============================================================
   LOAD MORE
   ============================================================ */

.games-more-wrap {
  display: flex;
  justify-content: center;
  padding: 0 0 2rem;
}

#loadMoreBtn {
  display: none;
  padding: 0.7rem 1.8rem;
  border-radius: 10px;
  border: 1px solid rgba(201,168,76,0.35);
  background: rgba(201,168,76,0.08);
  color: var(--gold-bright);
  font-family: 'Tajawal', sans-serif;
  font-weight: 700;
  cursor: pointer;
}

#loadMoreBtn:hover {
  background: rgba(201,168,76,0.16);
}

.portal-loader {
  text-align: center;
  padding: 2rem 1rem;
  color: rgba(232,213,163,0.55);
  font-family: 'Tajawal', sans-serif;
}

.loader-ring {
  width: 32px;
  height: 32px;
  margin: 0 auto 0.8rem;
  border-radius: 50%;
  border: 2px solid rgba(201,168,76,0.2);
  border-top-color: var(--gold-bright);
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ============================================================
   PLAY OVERLAY
   ============================================================ */

.play-overlay {
  position: fixed;
  inset: 0;
  background: var(--void);
  z-index: 20000;
  display: none;
  flex-direction: column;
}

.play-overlay.open {
  display: flex;
}

.play-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.7rem 0.8rem;
  background: rgba(5,4,3,0.96);
  border-bottom: 1px solid rgba(201,168,76,0.25);
  flex: 0 0 auto;
}

.play-title {
  font-family: 'Tajawal', sans-serif;
  font-weight: 700;
  font-size: 0.9rem;
  color: var(--gold-bright);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 55%;
}

.topbar-actions {
  display: flex;
  gap: 0.5rem;
}

.control-btn {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: rgba(201,168,76,0.08);
  border: 1px solid rgba(201,168,76,0.25);
  color: var(--gold-bright);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  cursor: pointer;
}

.control-btn:active {
  background: rgba(201,168,76,0.2);
}

.play-stage {
  position: relative;
  flex: 1;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.play-stage iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
  background: #000;
}

.stage-loader {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.8rem;
  background: var(--void);
  color: rgba(232,213,163,0.6);
  font-family: 'Cinzel', serif;
  font-size: 0.8rem;
}

.stage-loader.hidden {
  display: none;
}

.perf-banner {
  display: none;
  align-items: center;
  gap: 0.5rem;
  padding: 0.6rem 0.9rem;
  background: rgba(204,34,34,0.1);
  border-top: 1px solid rgba(204,34,34,0.3);
  font-size: 0.8rem;
  color: var(--blood-bright);
  flex: 0 0 auto;
}

.perf-banner.show {
  display: flex;
}
</style>
</head>

<!-- GAMES ENGINE -->
<script>
(function () {

  "use strict";

  /* CONFIG (تعديل مسارات البيانات لتكون نسبية للجذر) */
  const DATA_URL = "data/games.json";
  const META_URL = "data/games-meta.json";

  const DESKTOP_BATCH = 72;
  const MOBILE_BATCH = 36;

  /* ELEMENTS */
  const gamesGrid = document.getElementById("gamesGrid");
  const filterBar = document.getElementById("filterBar");
  const gamesSearch = document.getElementById("gamesSearch");
  const gamesCount = document.getElementById("gamesCount");
  const gamesStatus = document.getElementById("gamesStatus");
  const portalLoader = document.getElementById("portalLoader");
  const loadMoreBtn = document.getElementById("loadMoreBtn");
  const playOverlay = document.getElementById("playOverlay");
  const gameFrame = document.getElementById("gameFrame");
  const playTitle = document.getElementById("playTitle");
  const stageLoader = document.getElementById("stageLoader");
  const btnClose = document.getElementById("btnClose");
  const btnReload = document.getElementById("btnReload");
  const btnFullscreen = document.getElementById("btnFullscreen");
  const perfBanner = document.getElementById("perfBanner");
  const playStage = document.getElementById("playStage");
  const bgMusic = document.getElementById("bg-music");

  /* STATE */
  let GAMES = [];
  let visibleGames = [];
  let activeCategory = "all";
  let searchText = "";
  let renderedCount = 0;
  let currentGame = null;

  /* DEVICE */
  function detectDeviceTier() {
    const memory = navigator.deviceMemory || 4;
    const cores = navigator.hardwareConcurrency || 4;
    const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    const saveData = navigator.connection && navigator.connection.saveData;

    if (memory <= 2 || cores <= 2 || saveData) return "low";
    if (mobile || memory <= 4 || cores <= 4) return "medium";
    return "high";
  }

  const deviceTier = detectDeviceTier();
  const BATCH = deviceTier === "low" ? MOBILE_BATCH : deviceTier === "medium" ? 48 : DESKTOP_BATCH;

  /* CATEGORY */
  function normalizeCategory(category) {
    if (!category) return "other";
    const c = String(category).trim().toLowerCase();
    if (c.includes("action") || c.includes("shoot") || c.includes("fighting")) return "action";
    if (c.includes("puzzle") || c.includes("brain") || c.includes("logic")) return "puzzle";
    if (c.includes("racing") || c.includes("race") || c.includes("driving")) return "racing";
    if (c.includes("sport") || c.includes("soccer") || c.includes("football") || c.includes("basketball")) return "sports";
    return c;
  }

  function categoryLabel(category) {
    const map = {
      action: "أكشن",
      puzzle: "ألغاز",
      racing: "سباقات",
      sports: "رياضة",
      adventure: "مغامرات",
      arcade: "أركيد",
      simulation: "محاكاة",
      strategy: "استراتيجية",
      shooting: "تصويب",
      multiplayer: "متعدد اللاعبين",
      other: "ألعاب"
    };
    return map[normalizeCategory(category)] || category || "ألعاب";
  }

  /* SAFE TEXT */
  function escapeHTML(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  /* FILTER */
  function applyFilters() {
    const query = searchText.trim().toLowerCase();
    visibleGames = GAMES.filter(function (game) {
      const category = normalizeCategory(game.category);
      if (activeCategory !== "all" && category !== activeCategory) return false;
      if (!query) return true;
      const haystack = [game.title, game.category, game.tags].filter(Boolean).join(" ").toLowerCase();
      return haystack.includes(query);
    });

    renderedCount = 0;
    gamesGrid.innerHTML = "";
    updateCount();
    renderNextBatch();
  }

  /* COUNT */
  function updateCount() {
    gamesCount.textContent = visibleGames.length.toLocaleString("ar-EG") + " لعبة";
  }

  /* CARD */
  function createGameCard(game) {
    const li = document.createElement("li");
    li.className = "game-card";
    li.setAttribute("role", "button");
    li.setAttribute("tabindex", "0");
    li.setAttribute("aria-label", "العب " + (game.title || "اللعبة"));

    const title = escapeHTML(game.title || "لعبة");
    const category = escapeHTML(categoryLabel(game.category));
    const thumb = game.thumb
      ? `<img src="${escapeHTML(game.thumb)}" alt="${title}" loading="lazy" decoding="async" referrerpolicy="no-referrer">`
      : `<span class="thumb-fallback">◆</span>`;

    li.innerHTML = `
      <div class="game-thumb">
        ${thumb}
        <span class="play-badge">▶</span>
      </div>
      <div class="game-info">
        <div class="game-name">${title}</div>
        <div class="game-tag">${category}</div>
      </div>
    `;

    li.addEventListener("click", function () { openGame(game); });
    li.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openGame(game);
      }
    });

    return li;
  }

  /* RENDER IN CHUNKS */
  function renderNextBatch() {
    if (renderedCount >= visibleGames.length) {
      loadMoreBtn.style.display = "none";
      return;
    }

    const fragment = document.createDocumentFragment();
    const end = Math.min(renderedCount + BATCH, visibleGames.length);

    for (let i = renderedCount; i < end; i++) {
      fragment.appendChild(createGameCard(visibleGames[i]));
    }

    gamesGrid.appendChild(fragment);
    renderedCount = end;

    loadMoreBtn.style.display = renderedCount < visibleGames.length ? "block" : "none";
  }

  /* LOAD DATA */
  async function loadGames() {
    try {
      portalLoader.style.display = "block";
      gamesStatus.textContent = "جارِ الاتصال بالكتالوج…";

      let meta = null;
      try {
        const metaResponse = await fetch(META_URL, { cache: "no-store" });
        if (metaResponse.ok) meta = await metaResponse.json();
      } catch (_) {}

      const version = meta && meta.version ? "?v=" + encodeURIComponent(meta.version) : "";
      const response = await fetch(DATA_URL + version, { cache: "default" });

      if (!response.ok) throw new Error("HTTP " + response.status);

      const data = await response.json();
      if (!Array.isArray(data)) throw new Error("games.json ليس مصفوفة ألعاب");

      GAMES = data
        .filter(function (game) { return game && game.url; })
        .map(function (game) {
          return {
            id: game.id || "",
            title: game.title || "لعبة بدون اسم",
            category: game.category || "other",
            tags: game.tags || "",
            thumb: game.thumb || "",
            url: game.url,
            width: game.width || 800,
            height: game.height || 600
          };
        });

      visibleGames = GAMES.slice();
      portalLoader.style.display = "none";
      gamesStatus.textContent = deviceTier === "low" ? "وضع الأداء الاقتصادي" : deviceTier === "medium" ? "وضع الأداء المتوازن" : "وضع الأداء العالي";

      updateCount();
      renderNextBatch();

    } catch (error) {
      console.error("MDM1 Games:", error);
      portalLoader.innerHTML = `<div>⚠ تعذر تحميل مكتبة الألعاب.</div>`;
      gamesStatus.textContent = "خطأ في الكتالوج";
    }
  }

  /* SEARCH */
  let searchTimer = null;
  gamesSearch.addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      searchText = gamesSearch.value;
      applyFilters();
    }, 120);
  });

  /* CATEGORY */
  filterBar.addEventListener("click", function (event) {
    const chip = event.target.closest(".filter-chip");
    if (!chip) return;

    filterBar.querySelectorAll(".filter-chip").forEach(function (button) {
      button.classList.remove("active");
    });

    chip.classList.add("active");
    activeCategory = chip.dataset.category || "all";
    applyFilters();
  });

  /* LOAD MORE */
  loadMoreBtn.addEventListener("click", function () {
    renderNextBatch();
  });

  /* OPEN GAME */
  function openGame(game) {
    if (!game || !game.url) return;

    currentGame = game;
    playTitle.textContent = game.title || "اللعبة";
    stageLoader.classList.remove("hidden");
    gameFrame.style.opacity = "0";
    gameFrame.src = game.url;

    playOverlay.classList.add("open");
    document.body.style.overflow = "hidden";
    perfBanner.classList.toggle("show", deviceTier === "low");

    startMusic();
  }

  /* CLOSE GAME */
  function closeGame() {
    playOverlay.classList.remove("open");
    document.body.style.overflow = "";
    gameFrame.src = "about:blank";

    if (document.fullscreenElement) {
      document.exitFullscreen().catch(function () {});
    }

    currentGame = null;
  }

  /* GAME LOAD */
  gameFrame.addEventListener("load", function () {
    if (gameFrame.src && gameFrame.src !== "about:blank") {
      stageLoader.classList.add("hidden");
      gameFrame.style.opacity = "1";
    }
  });

  /* RELOAD */
  btnReload.addEventListener("click", function () {
    if (!currentGame || !currentGame.url) return;
    stageLoader.classList.remove("hidden");
    gameFrame.style.opacity = "0";
    gameFrame.src = "about:blank";

    setTimeout(function () {
      if (!currentGame) return;
      gameFrame.src = currentGame.url;
    }, 50);
  });

  /* FULLSCREEN */
  function requestFullscreen(element) {
    const fn = element.requestFullscreen || element.webkitRequestFullscreen || element.mozRequestFullScreen || element.msRequestFullscreen;
    if (fn) return Promise.resolve(fn.call(element));
    return Promise.reject("fullscreen unsupported");
  }

  btnFullscreen.addEventListener("click", function () {
    requestFullscreen(playStage).catch(function () {});
  });

  /* CLOSE BUTTON */
  btnClose.addEventListener("click", closeGame);

  /* ESC */
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && playOverlay.classList.contains("open")) {
      closeGame();
    }
  });

  /* BACKGROUND MUSIC */
  let musicStarted = false;
  function startMusic() {
    if (musicStarted || !bgMusic) return;
    musicStarted = true;
    bgMusic.volume = 0.35;
    bgMusic.play().catch(function () {
      musicStarted = false;
    });
  }

  document.addEventListener("pointerdown", function () {
    startMusic();
  }, { once: false, passive: true });

  /* START */
  loadGames();

})();
</script>

</body>
</html>
