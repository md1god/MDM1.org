<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDM1 — قاعة الألعاب</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/pages.css">
<style>
  /* ============================================================
     ستايل خاص بصفحة الألعاب فقط — يستخدم نفس متغيرات global.css
     (--gold, --gold-bright, --gold-dim, --blood-bright, --light, --void)
     ولا يعرّف أي لون جديد
     ============================================================ */

  .games-filter {
    display: flex;
    gap: 0.6rem;
    overflow-x: auto;
    padding: 0.5rem 0 1.5rem;
    scrollbar-width: none;
  }
  .games-filter::-webkit-scrollbar { display: none; }
  .filter-chip {
    flex: 0 0 auto;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 0.5rem 1.2rem;
    border-radius: 20px;
    border: 1px solid rgba(201,168,76,0.2);
    background: rgba(201,168,76,0.03);
    color: rgba(232,213,163,0.6);
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.3s;
  }
  .filter-chip.active {
    border-color: var(--gold-bright);
    color: var(--gold-bright);
    background: rgba(201,168,76,0.14);
  }

  .games-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem;
    list-style: none;
    margin: 0 0 2rem;
    padding: 0;
  }
  @media (min-width: 640px) {
    .games-grid { grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }
  }

  .game-card {
    background: rgba(201,168,76,0.04);
    border: 1px solid rgba(201,168,76,0.15);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s;
    list-style: none;
    padding: 0;
  }
  .game-card:hover {
    border-color: rgba(201,168,76,0.4);
    background: rgba(201,168,76,0.08);
    transform: translateY(-3px);
  }
  .game-card:active { transform: scale(0.97); }

  .game-thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: linear-gradient(160deg, rgba(201,168,76,0.08), var(--void));
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .game-thumb img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .thumb-fallback { font-size: 2rem; color: var(--gold-dim); }

  .play-badge {
    position: absolute;
    bottom: 8px; left: 8px;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(5,4,3,0.75);
    border: 1px solid rgba(201,168,76,0.5);
    display: flex; align-items: center; justify-content: center;
    color: var(--gold-bright);
    font-size: 0.8rem;
  }

  .game-info { padding: 0.7rem 0.8rem 0.9rem; }
  .game-name {
    font-family: 'Tajawal', sans-serif;
    font-weight: 700;
    font-size: 0.92rem;
    color: var(--light);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .game-tag {
    font-family: 'Cinzel', serif;
    font-size: 0.68rem;
    color: var(--gold);
    letter-spacing: 0.05em;
    margin-top: 0.2rem;
  }

  .games-empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 3rem 1rem;
    color: rgba(232,213,163,0.5);
    font-size: 0.95rem;
  }

  /* ============================================================
     نافذة اللعب — تغطي الشاشة كاملة فوق كل شيء
     ============================================================ */
  .play-overlay {
    position: fixed; inset: 0;
    background: var(--void);
    z-index: 20000;
    display: none;
    flex-direction: column;
  }
  .play-overlay.open { display: flex; }

  .play-topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.7rem 0.8rem;
    background: rgba(5,4,3,0.96);
    border-bottom: 1px solid rgba(201,168,76,0.25);
    flex: 0 0 auto;
  }
  .play-title {
    font-family: 'Tajawal', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--gold-bright);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 55%;
  }
  .topbar-actions { display: flex; gap: 0.5rem; }
  .control-btn {
    width: 36px; height: 36px;
    border-radius: 8px;
    background: rgba(201,168,76,0.08);
    border: 1px solid rgba(201,168,76,0.25);
    color: var(--gold-bright);
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    cursor: pointer;
  }
  .control-btn:active { background: rgba(201,168,76,0.2); }

  .play-stage {
    position: relative;
    flex: 1;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .play-stage iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }

  .stage-loader {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.8rem;
    background: var(--void);
    color: rgba(232,213,163,0.6);
    font-family: 'Cinzel', serif;
    font-size: 0.8rem;
    letter-spacing: 0.05em;
  }
  .stage-loader.hidden { display: none; }
  .loader-ring {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 2px solid rgba(201,168,76,0.2);
    border-top-color: var(--gold-bright);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .perf-banner {
    display: none;
    align-items: center; gap: 0.5rem;
    padding: 0.6rem 0.9rem;
    background: rgba(204,34,34,0.1);
    border-top: 1px solid rgba(204,34,34,0.3);
    font-size: 0.8rem;
    color: var(--blood-bright);
    flex: 0 0 auto;
  }
  .perf-banner.show { display: flex; }
</style>
</head>
<body>

<div id="particles"></div>

<audio id="bg-music" src="../audio/games.mp3" loop preload="none"></audio>
<button id="music-btn" style="display:none">🔇</button>

<nav class="navbar">
  <a href="../index.html" class="nav-logo">🦅 MDM1</a>
  <a href="https://md1usd.com" class="nav-md1" target="_blank" rel="noopener">MD1$</a>
  <a href="../index.html" class="nav-back">← العودة</a>
</nav>

<section class="page-hero">
  <span class="page-label">Games • قاعة الألعاب</span>
  <h1 class="page-title">قاعة الألعاب</h1>
  <p class="page-sub">مجموعة مختارة من الألعاب — العب مباشرة من متصفحك، بدون تحميل</p>
</section>

<div class="page-content">

  <div class="divider"></div>

  <nav class="games-filter" id="filterBar">
    <button class="filter-chip active" data-category="all">الكل</button>
    <button class="filter-chip" data-category="action">أكشن</button>
    <button class="filter-chip" data-category="puzzle">ألغاز</button>
    <button class="filter-chip" data-category="racing">سباقات</button>
    <button class="filter-chip" data-category="sports">رياضة</button>
  </nav>

  <ul class="games-grid" id="gamesGrid"></ul>

</div>

<footer class="page-footer">
  ✦ &nbsp; MDM1 · صراع الأزل &nbsp; ✦
</footer>

<!-- ============================================================
     نافذة اللعب
     ============================================================ -->
<div class="play-overlay" id="playOverlay">
  <div class="play-topbar">
    <button class="control-btn" id="btnClose" aria-label="رجوع">←</button>
    <span class="play-title" id="playTitle">اللعبة</span>
    <div class="topbar-actions">
      <button class="control-btn" id="btnReload" aria-label="إعادة تشغيل">⟳</button>
      <button class="control-btn" id="btnFullscreen" aria-label="ملء الشاشة">⛶</button>
    </div>
  </div>

  <div class="play-stage" id="playStage">
    <div class="stage-loader" id="stageLoader">
      <div class="loader-ring"></div>
      <span>جارِ فتح البوابة…</span>
    </div>
    <iframe id="gameFrame"
            src=""
            allow="fullscreen; autoplay; gamepad; pointer-lock"
            sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-popups allow-forms"
            title="نافذة اللعبة"></iframe>
  </div>

  <div class="perf-banner" id="perfBanner">
    ⚠ جهازك قد يواجه بطئًا مع هذه اللعبة — جرّب إغلاق التطبيقات الأخرى
  </div>
</div>

<script src="../js/global.js"></script>
<script src="../js/pages.js"></script>
<script>
(function(){
  "use strict";

  /* ============================================================
     مصفوفة الألعاب
     ------------------------------------------------------------
     ⚠ استبدل GAME_ID بمعرّف اللعبة الحقيقي من GameMonetize.
     كل لعبة لها رابط شبيه بـ:
       https://html5.gamemonetize.com/XXXXXXXXXXXXXXXXXXXXXXXX/
     خُد الجزء XXXXXXXXXXXXXXXXXXXXXXXX وحطه في id بالأسفل.
     thumb اختياري — لو تركته فاضي هيظهر رمز بديل بدل الصورة.
     ============================================================ */
  const GAMES = [
    { id: "GAME_ID_1", title: "اسم اللعبة الأولى",  category: "action", thumb: "" },
    { id: "GAME_ID_2", title: "اسم اللعبة الثانية", category: "puzzle", thumb: "" },
    { id: "GAME_ID_3", title: "اسم اللعبة الثالثة", category: "racing", thumb: "" },
    { id: "GAME_ID_4", title: "اسم اللعبة الرابعة", category: "sports", thumb: "" },
    { id: "GAME_ID_5", title: "اسم اللعبة الخامسة", category: "action", thumb: "" },
    { id: "GAME_ID_6", title: "اسم اللعبة السادسة", category: "puzzle", thumb: "" }
  ];

  const GAME_BASE_URL = "https://html5.gamemonetize.com/";

  const gamesGrid    = document.getElementById('gamesGrid');
  const filterBar    = document.getElementById('filterBar');
  const playOverlay  = document.getElementById('playOverlay');
  const gameFrame    = document.getElementById('gameFrame');
  const playTitle    = document.getElementById('playTitle');
  const stageLoader  = document.getElementById('stageLoader');
  const btnClose     = document.getElementById('btnClose');
  const btnReload    = document.getElementById('btnReload');
  const btnFullscreen= document.getElementById('btnFullscreen');
  const perfBanner   = document.getElementById('perfBanner');
  const playStage    = document.getElementById('playStage');

  let currentGame = null;
  let activeCategory = 'all';

  /* ---------------- كشف إمكانيات الجهاز ---------------- */
  function detectDeviceTier(){
    const mem = navigator.deviceMemory || 4;
    const cores = navigator.hardwareConcurrency || 4;
    const saveData = navigator.connection && navigator.connection.saveData;
    if (mem <= 2 || cores <= 2 || saveData) return 'low';
    return 'high';
  }
  const deviceTier = detectDeviceTier();

  /* ---------------- بناء الشبكة ---------------- */
  function categoryLabel(cat){
    const map = { action:'أكشن', puzzle:'ألغاز', racing:'سباقات', sports:'رياضة' };
    return map[cat] || cat;
  }

  function renderGrid(){
    gamesGrid.innerHTML = '';
    const filtered = activeCategory === 'all' ? GAMES : GAMES.filter(g => g.category === activeCategory);

    if (filtered.length === 0){
      gamesGrid.innerHTML = '<li class="games-empty">لا توجد ألعاب في هذا التصنيف حاليًا</li>';
      return;
    }

    filtered.forEach(game => {
      const li = document.createElement('li');
      li.className = 'game-card';
      li.setAttribute('role', 'button');
      li.setAttribute('tabindex', '0');
      li.setAttribute('aria-label', 'العب ' + game.title);

      const thumbHtml = game.thumb
        ? `<img src="${game.thumb}" alt="${game.title}" loading="lazy">`
        : `<span class="thumb-fallback">◆</span>`;

      li.innerHTML = `
        <div class="game-thumb">
          ${thumbHtml}
          <span class="play-badge">▶</span>
        </div>
        <div class="game-info">
          <div class="game-name">${game.title}</div>
          <div class="game-tag">${categoryLabel(game.category)}</div>
        </div>
      `;

      li.addEventListener('click', () => openGame(game));
      li.addEventListener('keydown', e => { if (e.key === 'Enter') openGame(game); });
      gamesGrid.appendChild(li);
    });
  }

  /* ---------------- فتح/إغلاق اللعبة ---------------- */
  function openGame(game){
    currentGame = game;
    playTitle.textContent = game.title;
    stageLoader.classList.remove('hidden');
    gameFrame.style.opacity = '0';
    gameFrame.src = GAME_BASE_URL + game.id + '/';

    playOverlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    perfBanner.classList.toggle('show', deviceTier === 'low');
  }

  function closeGame(){
    playOverlay.classList.remove('open');
    document.body.style.overflow = '';
    gameFrame.src = ''; // إيقاف فعلي لتحرير الذاكرة والمعالج
    if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    currentGame = null;
  }

  gameFrame.addEventListener('load', () => {
    if (gameFrame.src) {
      stageLoader.classList.add('hidden');
      gameFrame.style.opacity = '1';
    }
  });

  btnClose.addEventListener('click', closeGame);

  btnReload.addEventListener('click', () => {
    if (!currentGame) return;
    stageLoader.classList.remove('hidden');
    gameFrame.style.opacity = '0';
    gameFrame.src = GAME_BASE_URL + currentGame.id + '/';
  });

  function requestFullscreen(el){
    const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (fn) return fn.call(el);
    return Promise.reject('unsupported');
  }
  btnFullscreen.addEventListener('click', () => { requestFullscreen(playStage).catch(()=>{}); });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && playOverlay.classList.contains('open')) closeGame();
  });

  filterBar.addEventListener('click', e => {
    const chip = e.target.closest('.filter-chip');
    if (!chip) return;
    filterBar.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeCategory = chip.dataset.category;
    renderGrid();
  });

  renderGrid();
})();
</script>

</body>
</html>
