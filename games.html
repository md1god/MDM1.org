<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">MDM1 — بوابة الألعاب الأسطورية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">

<style>
/* ============================================================
   GLOBAL STYLES & NEON COLOR VARIABLES
   ============================================================ */
:root {
  --bg-dark: #070811;
  --bg-card: #121324;
  --bg-card-hover: #1c1e36;
  --bg-sidebar: #0b0c1b;
  --accent-pink: #ff007f;
  --accent-cyan: #00f0ff;
  --accent-yellow: #ffe600;
  --accent-purple: #9d4edd;
  --accent-green: #00ff87;
  --accent-orange: #ff6b35;
  --text-bright: #ffffff;
  --text-sub: #a0a5c3;
  --grad-hero: linear-gradient(135deg, #ff007f 0%, #7928ca 50%, #00f0ff 100%);
  --grad-btn: linear-gradient(90deg, #ff007f, #9d4edd);
  --grad-gold: linear-gradient(90deg, #ffe600, #ff6b35);
  --glow-pink: 0 0 15px rgba(255, 0, 127, 0.5);
  --glow-cyan: 0 0 15px rgba(0, 240, 255, 0.5);
  --glow-green: 0 0 15px rgba(0, 255, 135, 0.5);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Tajawal', system-ui, -apple-system, sans-serif;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  max-width: 100%;
  overflow-x: hidden;
  background-color: var(--bg-dark);
}

body {
  background: var(--bg-dark);
  background-image: 
    radial-gradient(circle at 15% 20%, rgba(255, 0, 127, 0.08) 0%, transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(157, 78, 221, 0.05) 0%, transparent 60%);
  color: var(--text-bright);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  width: 100%;
}

[dir="ltr"] * {
  direction: ltr;
}

/* ============================================================
   SCROLLBAR CUSTOMIZATION
   ============================================================ */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: var(--bg-dark);
}
::-webkit-scrollbar-thumb {
  background: rgba(255, 0, 127, 0.4);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--accent-pink);
}

/* ============================================================
   NAVBAR (HEADER)
   ============================================================ */
.app-navbar {
  position: sticky;
  top: 0;
  z-index: 500;
  background: rgba(10, 11, 22, 0.95);
  backdrop-filter: blur(16px);
  border-bottom: 2px solid rgba(255, 0, 127, 0.3);
  padding: 0.8rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  width: 100%;
  box-shadow: 0 4px 30px rgba(0,0,0,0.8);
}

.brand-logo {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  text-decoration: none;
  font-size: 1.4rem;
  font-weight: 900;
  color: #ffffff;
  letter-spacing: 0.5px;
  flex-shrink: 0;
}

.brand-badge {
  background: var(--grad-hero);
  background-size: 200% 200%;
  animation: badgeShift 4s ease infinite;
  color: #ffffff;
  padding: 0.35rem 0.9rem;
  border-radius: 12px;
  font-size: 1.15rem;
  font-weight: 900;
  box-shadow: var(--glow-pink);
}

@keyframes badgeShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  flex-wrap: wrap;
}

.btn-md1 {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  background: var(--accent-yellow);
  color: #000000;
  font-weight: 900;
  font-size: 0.95rem;
  padding: 0.6rem 1.2rem;
  border-radius: 20px;
  text-decoration: none;
  box-shadow: 0 0 15px rgba(255, 230, 0, 0.4);
  transition: all 0.25s ease;
}

.btn-md1:hover {
  transform: translateY(-2px) scale(1.05);
  box-shadow: 0 0 25px rgba(255, 230, 0, 0.8);
}

.btn-audio, .btn-lang, .btn-fav-toggle {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(0, 240, 255, 0.3);
  color: #ffffff;
  padding: 0.6rem 1rem;
  border-radius: 16px;
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 0.4rem;
  transition: all 0.25s ease;
  white-space: nowrap;
}

.btn-audio:hover, .btn-lang:hover, .btn-fav-toggle:hover {
  background: rgba(0, 240, 255, 0.18);
  border-color: var(--accent-cyan);
  box-shadow: var(--glow-cyan);
  transform: translateY(-2px);
}

/* ============================================================
   LANGUAGE MODAL
   ============================================================ */
.lang-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(3, 4, 10, 0.9);
  backdrop-filter: blur(10px);
  z-index: 3000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}

.lang-modal-overlay.open {
  display: flex;
}

.lang-modal {
  background: var(--bg-card);
  border: 2px solid var(--accent-pink);
  box-shadow: var(--glow-pink);
  border-radius: 24px;
  padding: 2rem;
  width: 100%;
  max-width: 440px;
}

.lang-modal h3 {
  font-size: 1.3rem;
  margin-bottom: 1.2rem;
  color: var(--accent-cyan);
  text-align: center;
  font-weight: 900;
}

.lang-grid {
  display: grid;
  grid-template-columns: repeat(1, 1fr);
  gap: 0.8rem;
}

.lang-option {
  display: flex;
  align-items: center;
  gap: 1rem;
  background: rgba(255,255,255,0.04);
  border: 2px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 0.9rem 1.2rem;
  cursor: pointer;
  color: #ffffff;
  font-size: 1.05rem;
  font-weight: 800;
  transition: all 0.25s ease;
}

.lang-option .flag { font-size: 1.8rem; }

.lang-option:hover {
  background: rgba(0, 240, 255, 0.12);
  border-color: var(--accent-cyan);
}

.lang-option.active {
  border-color: var(--accent-pink);
  background: rgba(255,0,127,0.2);
  box-shadow: var(--glow-pink);
}

/* ============================================================
   PAGE LAYOUT & SIDEBAR RAIL
   ============================================================ */
.page-body {
  display: flex;
  width: 100%;
  flex: 1;
}

.category-rail {
  width: 230px;
  flex-shrink: 0;
  padding: 1.2rem 0.8rem;
  background: var(--bg-sidebar);
  border-left: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  height: calc(100vh - 70px);
  position: sticky;
  top: 70px;
  overflow-y: auto;
}

[dir="ltr"] .category-rail {
  border-left: none;
  border-right: 1px solid rgba(255,255,255,0.08);
}

.rail-link {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.75rem 0.9rem;
  border-radius: 14px;
  color: var(--text-sub);
  font-size: 0.95rem;
  font-weight: 800;
  cursor: pointer;
  white-space: nowrap;
  background: transparent;
  border: 1px solid transparent;
  width: 100%;
  text-align: inherit;
  transition: all 0.25s ease;
}

.rail-link:hover {
  background: rgba(255, 255, 255, 0.08);
  color: #ffffff;
  transform: translateX(-4px);
}

[dir="ltr"] .rail-link:hover {
  transform: translateX(4px);
}

.rail-link.active {
  background: var(--grad-btn);
  color: #ffffff;
  box-shadow: var(--glow-pink);
  border-color: transparent;
}

.rail-link.unity-link.active {
  background: var(--grad-gold);
  color: #000000;
  box-shadow: 0 0 15px rgba(255, 230, 0, 0.5);
}

.rail-section-title {
  font-size: 0.78rem;
  color: var(--accent-cyan);
  padding: 1.2rem 0.6rem 0.4rem;
  font-weight: 900;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.main-container {
  flex: 1;
  min-width: 0;
  max-width: 100%;
  padding: 1.2rem 1.5rem 3rem;
  width: 100%;
}

/* ============================================================
   HIGH-SPEED ANIMATED TRENDING TICKER
   ============================================================ */
.trending-ticker {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  background: linear-gradient(90deg, rgba(255,0,127,0.2) 0%, rgba(0,240,255,0.15) 100%);
  border: 1px solid rgba(0, 240, 255, 0.4);
  box-shadow: 0 0 20px rgba(0,240,255,0.15);
  border-radius: 16px;
  padding: 0.7rem 1.2rem;
  margin-bottom: 1.2rem;
  overflow: hidden;
  white-space: nowrap;
}

.ticker-label {
  flex-shrink: 0;
  font-size: 0.92rem;
  font-weight: 900;
  color: var(--accent-yellow);
  padding-inline-end: 1rem;
  border-inline-end: 2px solid rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.ticker-track-wrap {
  overflow: hidden;
  flex: 1;
}

.ticker-track {
  display: flex;
  gap: 2rem;
  animation: tickerScroll 16s linear infinite;
  width: max-content;
}

[dir="rtl"] .ticker-track {
  animation-direction: reverse;
}

.ticker-item {
  font-size: 0.9rem;
  color: #ffffff;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  background: rgba(0,0,0,0.35);
  padding: 0.3rem 0.8rem;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.2s;
}

.ticker-item:hover {
  background: rgba(255, 0, 127, 0.4);
}

@keyframes tickerScroll {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

/* ============================================================
   TOOLBAR: SEARCH & COUNTER STATS
   ============================================================ */
.toolbar-section {
  margin-bottom: 1.2rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
  width: 100%;
}

.search-wrapper {
  position: relative;
  flex: 1;
  min-width: 260px;
}

.search-input {
  width: 100%;
  padding: 0.85rem 3.5rem 0.85rem 3.2rem;
  background: var(--bg-card);
  border: 2px solid rgba(255, 255, 255, 0.12);
  border-radius: 18px;
  color: #ffffff;
  font-size: 1rem;
  font-weight: 700;
  outline: none;
  transition: all 0.25s ease;
}

[dir="ltr"] .search-input {
  padding: 0.85rem 3.2rem 0.85rem 3.5rem;
}

.search-input:focus {
  border-color: var(--accent-cyan);
  box-shadow: var(--glow-cyan);
}

.search-icon {
  position: absolute;
  right: 1.2rem;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1.15rem;
  color: var(--text-sub);
  pointer-events: none;
}

[dir="ltr"] .search-icon {
  right: auto;
  left: 1.2rem;
}

.mic-btn {
  position: absolute;
  left: 0.9rem;
  top: 50%;
  transform: translateY(-50%);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.1);
  color: #ffffff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.05rem;
  transition: all 0.2s ease;
}

[dir="ltr"] .mic-btn {
  left: auto;
  right: 0.9rem;
}

.mic-btn:hover {
  background: var(--accent-pink);
  box-shadow: var(--glow-pink);
}

.stats-bar {
  background: rgba(0, 255, 135, 0.12);
  border: 1px solid var(--accent-green);
  padding: 0.7rem 1.2rem;
  border-radius: 16px;
  font-size: 0.95rem;
  color: var(--accent-green);
  font-weight: 900;
  white-space: nowrap;
  box-shadow: var(--glow-green);
}

/* ============================================================
   GAMES GRID & CARDS
   ============================================================ */
.games-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1rem;
  list-style: none;
  width: 100%;
}

@media (min-width: 550px) { .games-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 820px) { .games-grid { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 1100px) { .games-grid { grid-template-columns: repeat(5, 1fr); } }
@media (min-width: 1400px) { .games-grid { grid-template-columns: repeat(6, 1fr); } }

.game-card {
  background: var(--bg-card);
  border-radius: 18px;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  display: flex;
  flex-direction: column;
  border: 2px solid rgba(255,255,255,0.08);
}

.game-card:hover {
  transform: translateY(-7px) scale(1.03);
  box-shadow: 0 12px 30px rgba(0,0,0,0.8), var(--glow-pink);
  border-color: var(--accent-pink);
}

.game-thumb {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  overflow: hidden;
  background: #090a15;
}

.game-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.35s ease;
}

.game-card:hover .game-thumb img {
  transform: scale(1.12);
}

.corner-badge {
  position: absolute;
  top: 8px;
  inset-inline-start: 8px;
  font-size: 0.72rem;
  font-weight: 900;
  padding: 0.3rem 0.65rem;
  border-radius: 8px;
  color: #000000;
  z-index: 2;
  box-shadow: 0 3px 10px rgba(0,0,0,0.6);
}

.corner-badge.unity { background: var(--accent-yellow); }
.corner-badge.new { background: var(--accent-cyan); }
.corner-badge.featured { background: var(--accent-pink); color: #ffffff; }

.fav-btn-card {
  position: absolute;
  top: 8px;
  inset-inline-end: 8px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  z-index: 3;
  transition: all 0.2s ease;
}

.fav-btn-card.active {
  background: var(--accent-pink);
  border-color: transparent;
  box-shadow: var(--glow-pink);
}

.play-badge {
  position: absolute;
  inset: 0;
  background: rgba(7, 8, 17, 0.65);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.25s ease;
}

.game-card:hover .play-badge {
  opacity: 1;
}

.play-btn-circle {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: var(--accent-pink);
  box-shadow: var(--glow-pink);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  transform: scale(0.8);
  transition: transform 0.2s ease;
}

.game-card:hover .play-btn-circle {
  transform: scale(1);
}

.game-details {
  padding: 0.75rem 0.9rem;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  background: var(--bg-card);
}

.game-title {
  font-size: 0.92rem;
  font-weight: 800;
  color: #ffffff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.game-cat-tag {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--accent-cyan);
}

/* EMPTY STATE */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 5rem 1rem;
  color: var(--text-sub);
  background: var(--bg-card);
  border-radius: 24px;
  border: 1px solid rgba(255,255,255,0.08);
}

.empty-state .emoji {
  font-size: 3.5rem;
  margin-bottom: 1rem;
}

/* LOAD MORE BUTTON */
.load-more-wrap {
  display: flex;
  justify-content: center;
  margin: 3rem 0;
}

.btn-load-more {
  background: var(--grad-btn);
  border: none;
  color: #ffffff;
  padding: 0.95rem 2.8rem;
  border-radius: 30px;
  font-weight: 900;
  font-size: 1.05rem;
  cursor: pointer;
  box-shadow: var(--glow-pink);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.btn-load-more:hover {
  transform: scale(1.06);
  box-shadow: 0 0 25px rgba(255, 0, 127, 0.8);
}

/* ============================================================
   PLAY OVERLAY (FULLSCREEN CANVAS)
   ============================================================ */
.play-overlay {
  position: fixed;
  inset: 0;
  background: rgba(3, 4, 10, 0.98);
  z-index: 2000;
  display: none;
  flex-direction: column;
}

.play-overlay.open {
  display: flex;
}

.overlay-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.85rem 1.8rem;
  background: #0d0f1f;
  border-bottom: 2px solid var(--accent-pink);
}

.overlay-title {
  font-size: 1.15rem;
  font-weight: 900;
  color: var(--accent-cyan);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 50%;
}

.topbar-btns {
  display: flex;
  gap: 0.75rem;
}

.ctrl-btn {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #ffffff;
  padding: 0.55rem 1.1rem;
  border-radius: 14px;
  cursor: pointer;
  font-size: 0.92rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 0.4rem;
  transition: all 0.2s ease;
}

.ctrl-btn:hover {
  background: var(--accent-cyan);
  color: #000000;
}

.ctrl-btn.close-btn {
  background: var(--accent-pink);
  border-color: transparent;
}

.ctrl-btn.close-btn:hover {
  box-shadow: var(--glow-pink);
}

.stage-wrapper {
  position: relative;
  flex: 1;
  background: #000000;
}

.stage-wrapper iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

.stage-loader-box {
  position: absolute;
  inset: 0;
  background: #070811;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.2rem;
  z-index: 10;
  color: var(--accent-cyan);
  font-weight: 800;
  font-size: 1.1rem;
}

.stage-loader-box.hidden {
  display: none;
}

.spinner {
  width: 55px;
  height: 55px;
  border: 5px solid rgba(255,255,255,0.1);
  border-top-color: var(--accent-pink);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<!-- BACKGROUND AUDIO -->
<audio id="bg-music" src="https://assets.mixkit.co/active_storage/sfx/2874/2874-preview.mp3" loop preload="none"></audio>

<!-- NAVBAR -->
<header class="app-navbar">
  <a href="#" class="brand-logo">
    <span class="brand-badge">MDM1</span>
    <span id="portalTitleText">بوابة الألعاب الأسطورية</span>
  </a>

  <div class="nav-actions">
    <a href="https://md1usd.com" class="btn-md1" target="_blank" rel="noopener">
      <span>💎</span><span>MD1$</span>
    </a>
    <button id="favToggleBtn" class="btn-fav-toggle">
      <span>❤️</span><span id="favText">المفضلة</span>
    </button>
    <button id="langToggle" class="btn-lang">
      <span id="langFlag">🇪🇬</span>
      <span id="langButtonText">اللغة</span>
    </button>
    <button id="audioToggle" class="btn-audio">
      <span id="audioIcon">🔊</span>
      <span id="audioText">الموسيقى</span>
    </button>
  </div>
</header>

<!-- LANGUAGE MODAL -->
<div class="lang-modal-overlay" id="langModal">
  <div class="lang-modal">
    <h3 id="langModalTitle">اختر لغتك المفضلة</h3>
    <div class="lang-grid" id="langGrid"></div>
  </div>
</div>

<div class="page-body">

  <!-- SIDEBAR NAVIGATION RAIL -->
  <aside class="category-rail" id="categoryRail">
    <button class="rail-link active" data-category="all"><span>🔥</span><span data-i18n="cat_all">الأكثر شهرة</span></button>
    <button class="rail-link" data-category="favorites"><span>❤️</span><span data-i18n="cat_favorites">ألعابي المفضلة</span></button>
    <button class="rail-link" data-category="new"><span>🆕</span><span data-i18n="cat_new">ألعاب جديدة</span></button>

  const gamesGrid = document.getElementById("gamesGrid");

  /* ============================================================

  let ALL_GAMES = [...EMBEDDED_GAMES];
  let favoritesList = JSON.parse(localStorage.getItem("mdm1_favs") || "[]");
  let visibleGames = [];
  let activeCategory = "all";
  let searchText = "";
  let renderedCount = 0;
  let BATCH_SIZE = 12;
  let currentLang = localStorage.getItem("mdm1_lang") || "ar";
  let isMuted = true;

  /* ============================================================
     INITIALIZATION
     ============================================================ */
  function init() {
    applyLanguage(currentLang);
    buildLangGrid();
    setupEvents();
    renderTicker();
    applyFilters();
  }

  /* ============================================================
     LANGUAGE ENGINE
     ============================================================ */
  function applyLanguage(code) {
    if (!LANGUAGES[code]) code = "ar";
    currentLang = code;
    localStorage.setItem("mdm1_lang", code);
    const langData = LANGUAGES[code];

    const html = document.getElementById("htmlRoot");
    html.setAttribute("lang", code);
    html.setAttribute("dir", langData.dir);

    document.getElementById("portalTitleText").textContent = langData.portal_title;
    document.getElementById("favText").textContent = langData.fav_title;
    document.getElementById("langFlag").textContent = langData.flag;
    gamesSearch.setAttribute("placeholder", langData.search_placeholder);

    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if (langData[key]) el.textContent = langData[key];
    });

    updateStats();
  }

  function buildLangGrid() {
    langGrid.innerHTML = "";
    Object.keys(LANGUAGES).forEach(code => {
      const lang = LANGUAGES[code];
      const btn = document.createElement("button");
      btn.className = "lang-option" + (code === currentLang ? " active" : "");
      btn.innerHTML = `<span class="flag">${lang.flag}</span><span>${lang.name}</span>`;
      btn.onclick = () => {
        applyLanguage(code);
        langModal.classList.remove("open");
        buildLangGrid();
      };
      langGrid.appendChild(btn);
    });
  }

  /* ============================================================
     HIGH-SPEED TICKER RENDERER
     ============================================================ */
  function renderTicker() {
    tickerTrack.innerHTML = "";
    const trending = ALL_GAMES.filter(g => g.featured || g.isUnity);
    const list = [...trending, ...trending];
    list.forEach(g => {
      const item = document.createElement("div");
      item.className = "ticker-item";
      item.innerHTML = `⭐ <span>${g.title}</span>`;
      item.onclick = () => openGame(g);
      tickerTrack.appendChild(item);
    });
  }

  /* ============================================================
     FAVORITES SYSTEM
     ============================================================ */
  function toggleFavorite(e, gameId) {
    e.stopPropagation();
    if (favoritesList.includes(gameId)) {
      favoritesList = favoritesList.filter(id => id !== gameId);
    } else {
      favoritesList.push(gameId);
    }
    localStorage.setItem("mdm1_favs", JSON.stringify(favoritesList));
    applyFilters();
  }

  /* ============================================================
     FILTERING & GRID RENDERING
     ============================================================ */
  function applyFilters() {
    const q = searchText.trim().toLowerCase();
    const langData = LANGUAGES[currentLang] || LANGUAGES.ar;

    visibleGames = ALL_GAMES.filter(game => {
      if (activeCategory === "favorites" && !favoritesList.includes(game.id)) return false;
      if (activeCategory === "new" && !game.isNew) return false;
      if (activeCategory === "unity" && !game.isUnity) return false;
      if (activeCategory !== "all" && activeCategory !== "favorites" && activeCategory !== "new" && activeCategory !== "unity" && game.category !== activeCategory) return false;
      if (!q) return true;
      return game.title.toLowerCase().includes(q) || game.category.toLowerCase().includes(q);
    });

    renderedCount = 0;
    gamesGrid.innerHTML = "";
    updateStats();

    if (visibleGames.length === 0) {
      gamesGrid.innerHTML = `
        <li class="empty-state">
          <div class="emoji">🔍</div>
          <div>${langData.no_games_found}</div>
        </li>
      `;
      loadMoreBtn.style.display = "none";
      return;
    }

    renderNextBatch();
  }

  function updateStats() {
    const langData = LANGUAGES[currentLang] || LANGUAGES.ar;
    const totalDisplay = (langData.games_count_base + visibleGames.length).toLocaleString();
    gamesCount.textContent = `🎮 ${totalDisplay} لعبة متوفرة`;
  }

  function renderNextBatch() {
    const nextBatch = visibleGames.slice(renderedCount, renderedCount + BATCH_SIZE);
    nextBatch.forEach(game => {
      gamesGrid.appendChild(createGameCard(game));
    });
    renderedCount += nextBatch.length;

    if (renderedCount >= visibleGames.length) {
      loadMoreBtn.style.display = "none";
    } else {
      loadMoreBtn.style.display = "block";
    }
  }

  function createGameCard(game) {
    const li = document.createElement("li");
    li.className = "game-card";

    let badge = "";
    if (game.isUnity) badge = `<span class="corner-badge unity">UNITY 3D</span>`;
    else if (game.isNew) badge = `<span class="corner-badge new">جديد</span>`;
    else if (game.featured) badge = `<span class="corner-badge featured">مميزة</span>`;

    const isFav = favoritesList.includes(game.id);

    li.innerHTML = `
      <div class="game-thumb">
        ${badge}
        <button class="fav-btn-card ${isFav ? 'active' : ''}" title="المفضلة">
          ${isFav ? '❤️' : '🤍'}
        </button>
        <img src="${game.thumb}" alt="${game.title}" loading="lazy">
        <div class="play-badge"><div class="play-btn-circle">▶</div></div>
      </div>
      <div class="game-details">
        <div class="game-title">${game.title}</div>
        <div class="game-cat-tag">#${game.category}</div>
      </div>
    `;

    const favBtn = li.querySelector(".fav-btn-card");
    favBtn.onclick = (e) => toggleFavorite(e, game.id);

    li.onclick = () => openGame(game);
    return li;
  }

  /* ============================================================
     GAME OVERLAY & CANVAS MANAGEMENT
     ============================================================ */
  function openGame(game) {
    playTitle.textContent = game.title;
    stageLoader.classList.remove("hidden");
    gameFrame.src = game.url;
    playOverlay.classList.add("open");

    gameFrame.onload = () => {
      stageLoader.classList.add("hidden");
    };
  }

  function closeGame() {
    playOverlay.classList.remove("open");
    gameFrame.src = "about:blank";
  }

  /* ============================================================
     EVENT BINDINGS
     ============================================================ */
  function setupEvents() {
    // Category rail navigation
    categoryRail.querySelectorAll(".rail-link").forEach(btn => {
      btn.onclick = () => {
        categoryRail.querySelectorAll(".rail-link").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeCategory = btn.getAttribute("data-category");
        applyFilters();
      };
    });

    // Top Header Favorites Button
    favToggleBtn.onclick = () => {
      categoryRail.querySelectorAll(".rail-link").forEach(b => b.classList.remove("active"));
      const favRailBtn = categoryRail.querySelector('[data-category="favorites"]');
      if (favRailBtn) favRailBtn.classList.add("active");
      activeCategory = "favorites";
      applyFilters();
    };

    // Live search input
    gamesSearch.oninput = (e) => {
      searchText = e.target.value;
      applyFilters();
    };

    // Speech recognition search
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = currentLang === 'ar' ? 'ar-EG' : 'en-US';

      micBtn.onclick = () => {
        recognition.start();
        micBtn.style.background = "var(--accent-pink)";
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        gamesSearch.value = transcript;
        searchText = transcript;
        applyFilters();
        micBtn.style.background = "rgba(255,255,255,0.1)";
      };

      recognition.onerror = () => {
        micBtn.style.background = "rgba(255,255,255,0.1)";
      };
    }

    // Load More button
    loadMoreBtn.onclick = renderNextBatch;

    // Modals & Controls
    langToggle.onclick = () => langModal.classList.add("open");
    langModal.onclick = (e) => { if (e.target === langModal) langModal.classList.remove("open"); };

    btnClose.onclick = closeGame;
    btnReload.onclick = () => { stageLoader.classList.remove("hidden"); gameFrame.src = gameFrame.src; };
    btnFullscreen.onclick = () => {
      if (gameFrame.requestFullscreen) {
        gameFrame.requestFullscreen();
      } else if (gameFrame.webkitRequestFullscreen) {
        gameFrame.webkitRequestFullscreen();
      }
    };

    // Audio sound control
    audioToggle.onclick = () => {
      if (isMuted) {
        bgMusic.play().then(() => {
          isMuted = false;
          audioIcon.textContent = "🔊";
        }).catch(() => {});
      } else {
        bgMusic.pause();
        isMuted = true;
        audioIcon.textContent = "🔇";
      }
    };
  }

  // START APP
  init();
})();
</script>
</body>
</html>
