<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لعبة القتال 3D - Babylon.js & React</title>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Babylon.js Core & Loaders -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <!-- Tailwind CSS for UI -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050505;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    canvas {
      width: 100%;
      height: 100%;
      outline: none;
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }
    .interactive {
      pointer-events: auto;
    }
    .health-bar-fill {
      transition: width 0.15s ease-out;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // === ثوابت اللعبة والتوازن (Game Constants) ===
    const MAX_HEALTH = 100;
    const MAX_ENERGY = 100;
    const PUNCH_DAMAGE = 8;
    const KICK_DAMAGE = 14;
    const SPECIAL_DAMAGE = 30;
    
    const PUNCH_RANGE = 1.8;
    const KICK_RANGE = 2.2;
    const SPECIAL_RANGE = 2.8;

    const PUNCH_COOLDOWN = 0.35;
    const KICK_COOLDOWN = 0.6;
    const SPECIAL_COOLDOWN = 1.5;

    const MOVE_SPEED = 6.5;
    const ARENA_BOUNDS = 12.0;
    const ROUND_TIME_LIMIT = 60;

    // === إعدادات النماذج والأنيميشن (GLB Setup) ===
    const FIGHTER_MODELS = {
      p1: {
        rootUrl: "./models/",
        file: "fighter1.glb",
        scale: 1.0,
        facingOffset: 0,
        animations: {
          idle: "Idle",
          walk: "Walk",
          punch: "Punch",
          kick: "Kick",
          special: "Special",
          hit: "Hit",
          block: "Block",
        },
      },
      p2: {
        rootUrl: "./models/",
        file: "fighter2.glb",
        scale: 1.0,
        facingOffset: 0,
        animations: {
          idle: "Idle",
          walk: "Walk",
          punch: "Punch",
          kick: "Kick",
          special: "Special",
          hit: "Hit",
          block: "Block",
        },
      },
    };

    // === أصوات الضربات الصناعية (Web Audio API) ===
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playImpactSound(type) {
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const params = {
          punch:   { wave: "square",   f1: 180, f2: 60,  dur: 0.15, vol: 0.4 },
          kick:    { wave: "sawtooth", f1: 120, f2: 40,  dur: 0.25, vol: 0.5 },
          special: { wave: "sawtooth", f1: 300, f2: 50,  dur: 0.4,  vol: 0.6 },
        }[type] || { wave: "square", f1: 150, f2: 60, dur: 0.15, vol: 0.4 };

        osc.type = params.wave;
        osc.frequency.setValueAtTime(params.f1, now);
        osc.frequency.exponentialRampToValueAtTime(params.f2, now + params.dur);
        gain.gain.setValueAtTime(params.vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + params.dur);

        osc.start(now);
        osc.stop(now + params.dur);
      } catch (e) {
        console.warn("Audio Context error:", e);
      }
    }

    // === إنشاء مجسم بديل (Fallback Capsule Mesh) ===
    function createFighterMeshFallback(scene, color, name) {
      const root = new BABYLON.TransformNode(name + "_root", scene);
      const bodyMat = new BABYLON.StandardMaterial(name + "_bodyMat", scene);
      bodyMat.diffuseColor = color;
      
      const torso = BABYLON.MeshBuilder.CreateCapsule(name + "_torso", { height: 1.6, radius: 0.42 }, scene);
      torso.position.y = 1.15;
      torso.material = bodyMat;
      torso.parent = root;

      const head = BABYLON.MeshBuilder.CreateSphere(name + "_head", { diameter: 0.45 }, scene);
      head.position.y = 2.1;
      head.material = bodyMat;
      head.parent = root;

      const arm = BABYLON.MeshBuilder.CreateBox(name + "_arm", { width: 0.2, height: 0.2, depth: 0.8 }, scene);
      arm.position.set(0.4, 1.3, 0.4);
      arm.material = bodyMat;
      arm.parent = root;

      return { root, isModel: false, torso, head, arm, bodyMat, animGroups: {}, currentAnim: null };
    }

    // === تحميل النماذج الخارجيّة (GLB Model Loader) ===
    async function loadFighterModel(scene, config, color, name, shadowGen) {
      const root = new BABYLON.TransformNode(name + "_root", scene);
      try {
        const result = await BABYLON.SceneLoader.ImportMeshAsync("", config.rootUrl, config.file, scene);
        const modelRoot = result.meshes[0];
        modelRoot.parent = root;
        modelRoot.scaling.scaleInPlace(config.scale);
        if (config.facingOffset) modelRoot.rotation.y += config.facingOffset;

        result.meshes.forEach((m) => {
          if (shadowGen) shadowGen.addShadowCaster(m);
        });

        console.log(name + " animation groups:", result.animationGroups.map(a => a.name));

        const animGroups = {};
        result.animationGroups.forEach((ag) => {
          ag.stop();
          animGroups[ag.name] = ag;
        });

        return { root, isModel: true, animGroups, currentAnim: null, bodyMat: null };
      } catch (err) {
        console.warn("فشل تحميل نموذج " + name + " — استخدام مجسم بديل", err);
        return createFighterMeshFallback(scene, color, name);
      }
    }

    // === تشغيل الأنيميشن للنموذج ===
    function playAnim(meshData, animKey, config, loop) {
      if (!meshData.isModel) return;
      const groupName = config.animations[animKey];
      const group = meshData.animGroups[groupName];
      if (!group) return;
      if (meshData.currentAnim === groupName && group.isPlaying) return;
      
      Object.values(meshData.animGroups).forEach((g) => g.stop());
      group.start(loop, 1.0, group.from, group.to, false);
      meshData.currentAnim = groupName;
    }

    // === حالة اللاعب الابتدائية (Fighter Initial State) ===
    function makeFighterState(startX, startZ, facingDir) {
      return {
        x: startX,
        z: startZ,
        facingDir: facingDir,
        hp: MAX_HEALTH,
        energy: 0,
        isAttacking: false,
        attackType: null,
        attackCooldown: 0,
        isBlocking: false,
        isMoving: false,
        flashTimer: 0,
        animPhase: 0,
      };
    }

    // === المكون الرئيسي للعبة (Main Component) ===
    function FightingGame() {
      const canvasRef = useRef(null);
      const sceneRef = useRef(null);
      const bgMusicRef = useRef(null);
      const meshesRef = useRef({});
      const fightersRef = useRef({ p1: makeFighterState(-3.5, 0, 1), p2: makeFighterState(3.5, 0, -1) });
      const keysRef = useRef({});

      // حالات الواجهة البرمجية (UI States)
      const [gameState, setGameState] = useState("START"); // START, PLAYING, ROUND_OVER, MATCH_OVER
      const [p1Hp, setP1Hp] = useState(MAX_HEALTH);
      const [p2Hp, setP2Hp] = useState(MAX_HEALTH);
      const [p1Energy, setP1Energy] = useState(0);
      const [p2Energy, setP2Energy] = useState(0);
      const [p1Wins, setP1Wins] = useState(0);
      const [p2Wins, setP2Wins] = useState(0);
      const [timeLeft, setTimeLeft] = useState(ROUND_TIME_LIMIT);
      const [roundBanner, setRoundBanner] = useState("");
      const [winnerText, setWinnerText] = useState("");

      // === تهيئة المشهد والـ Babylon Engine ===
      useEffect(() => {
        if (!canvasRef.current) return;

        const engine = new BABYLON.Engine(canvasRef.current, true);
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.02, 0.02, 0.05, 1);
        sceneRef.current = scene;

        // الكاميرا
        const camera = new BABYLON.FreeCamera("mainCamera", new BABYLON.Vector3(0, 4, -10), scene);
        camera.setTarget(new BABYLON.Vector3(0, 1.2, 0));

        // الإضاءة
        const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
        hemiLight.intensity = 0.4;

        const dirLight = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-1, -3, 2), scene);
        dirLight.position = new BABYLON.Vector3(5, 12, -5);
        dirLight.intensity = 0.9;

        const shadowGen = new BABYLON.ShadowGenerator(1024, dirLight);
        shadowGen.useBlurExponentialShadowMap = true;

        // الحلبة (Arena Ground)
        const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 30, height: 30 }, scene);
        const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
        groundMat.diffuseColor = new BABYLON.Color3(0.1, 0.12, 0.15);
        groundMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
        ground.material = groundMat;
        ground.receiveShadows = true;

        // حلقة قتالية دائرية بلمسة توهج
        const ring = BABYLON.MeshBuilder.CreateDisc("ring", { radius: ARENA_BOUNDS, tessellation: 64 }, scene);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = 0.01;
        const ringMat = new BABYLON.StandardMaterial("ringMat", scene);
        ringMat.diffuseColor = new BABYLON.Color3(0.18, 0.22, 0.3);
        ring.material = ringMat;

        // تحميل الموسيقى الخلفية
        try {
          const bgMusic = new BABYLON.Sound("bgMusic", "./sounds/theme.mp3", scene, null, { loop: true, volume: 0.3 });
          bgMusicRef.current = bgMusic;
        } catch(e) {
          console.warn("الموسيقى غير متوفرة في المسار المحدد.");
        }

        // تحميل النماذج
        (async () => {
          const p1Data = await loadFighterModel(scene, FIGHTER_MODELS.p1, new BABYLON.Color3(0.85, 0.15, 0.15), "p1", shadowGen);
          const p2Data = await loadFighterModel(scene, FIGHTER_MODELS.p2, new BABYLON.Color3(0.15, 0.35, 0.85), "p2", shadowGen);
          meshesRef.current = { p1: p1Data, p2: p2Data };
        })();

        // التقاط لوحة المفاتيح
        const onKeyDown = (e) => { keysRef.current[e.code] = true; };
        const onKeyUp = (e) => { keysRef.current[e.code] = false; };
        window.addEventListener("keydown", onKeyDown);
        window.addEventListener("keyup", onKeyUp);

        // الحلقة التكرارية للعبة (Game Loop)
        engine.runRenderLoop(() => {
          const dt = engine.getDeltaTime() / 1000;
          if (sceneRef.current) {
            scene.render();
          }
        });

        const handleResize = () => engine.resize();
        window.addEventListener("resize", handleResize);

        return () => {
          window.removeEventListener("keydown", onKeyDown);
          window.removeEventListener("keyup", onKeyUp);
          window.removeEventListener("resize", handleResize);
          engine.dispose();
        };
      }, []);

      // === الحلقة التكرارية للتحديثات والحركات (Update Loop Effect) ===
      useEffect(() => {
        let timerInterval = null;

        if (gameState === "PLAYING") {
          timerInterval = setInterval(() => {
            setTimeLeft((prev) => {
              if (prev <= 1) {
                handleTimeOut();
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }

        const scene = sceneRef.current;
        if (!scene) return;

        const observer = scene.onBeforeRenderObservable.add(() => {
          if (gameState !== "PLAYING") return;

          const dt = scene.getEngine().getDeltaTime() / 1000;
          const f = fightersRef.current;
          const k = keysRef.current;

          // معالجة المدخلات والحركة
          handleMovement(f.p1, f.p2, k, "KeyA", "KeyD", "KeyW", "KeyS", dt);
          handleMovement(f.p2, f.p1, k, "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", dt);

          // الحماية / الدفاع (Block)
          f.p1.isBlocking = !!k["ShiftLeft"];
          f.p2.isBlocking = !!k["ShiftRight"] || !!k["Numpad0"];

          // الهجمات
          tryAttack(f.p1, f.p2, k, "KeyF", "punch", PUNCH_DAMAGE, PUNCH_RANGE, PUNCH_COOLDOWN);
          tryAttack(f.p1, f.p2, k, "KeyG", "kick", KICK_DAMAGE, KICK_RANGE, KICK_COOLDOWN);
          tryAttack(f.p1, f.p2, k, "KeyH", "special", SPECIAL_DAMAGE, SPECIAL_RANGE, SPECIAL_COOLDOWN);

          tryAttack(f.p2, f.p1, k, "Numpad1" || "KeyJ", "punch", PUNCH_DAMAGE, PUNCH_RANGE, PUNCH_COOLDOWN);
          tryAttack(f.p2, f.p1, k, "Numpad2" || "KeyK", "kick", KICK_DAMAGE, KICK_RANGE, KICK_COOLDOWN);
          tryAttack(f.p2, f.p1, k, "Numpad3" || "KeyL", "special", SPECIAL_DAMAGE, SPECIAL_RANGE, SPECIAL_COOLDOWN);

          // تحديث أوقات التهدئة (Cooldowns)
          [f.p1, f.p2].forEach((fighter) => {
            if (fighter.attackCooldown > 0) fighter.attackCooldown -= dt;
            if (fighter.flashTimer > 0) fighter.flashTimer -= dt;
          });

          // التحديث البصري وموقع الكاميرا
          updateVisuals(dt);
          updateCamera();
        });

        return () => {
          if (timerInterval) clearInterval(timerInterval);
          if (scene) scene.onBeforeRenderObservable.remove(observer);
        };
      }, [gameState]);

      // === منطق الحركة ===
      function handleMovement(p, enemy, keys, leftKey, rightKey, upKey, downKey, dt) {
        if (p.isAttacking) return;

        let moveX = 0;
        let moveZ = 0;

        if (keys[leftKey]) moveX -= 1;
        if (keys[rightKey]) moveX += 1;
        if (keys[upKey]) moveZ += 1;
        if (keys[downKey]) moveZ -= 1;

        const len = Math.hypot(moveX, moveZ);
        if (len > 0) {
          moveX /= len; moveZ /= len;
          p.x += moveX * MOVE_SPEED * dt;
          p.z += moveZ * MOVE_SPEED * dt;
          p.animPhase += dt * 8;
          p.isMoving = true;
        } else {
          p.animPhase *= 0.9;
          p.isMoving = false;
        }

        // قيود الساحة
        const distFromCenter = Math.hypot(p.x, p.z);
        if (distFromCenter > ARENA_BOUNDS) {
          p.x = (p.x / distFromCenter) * ARENA_BOUNDS;
          p.z = (p.z / distFromCenter) * ARENA_BOUNDS;
        }

        // توجيه الوجه نحو الخصم
        p.facingDir = p.x < enemy.x ? 1 : -1;
      }

      // === منطق محاولة الهجوم ===
      function tryAttack(attacker, defender, keys, keyName, type, damage, range, cooldown) {
        if (!keys[keyName] || attacker.attackCooldown > 0 || attacker.isAttacking) return;

        if (type === "special") {
          if (attacker.energy < MAX_ENERGY) return;
          attacker.energy = 0;
          if (attacker === fightersRef.current.p1) setP1Energy(0);
          else setP2Energy(0);
        }

        attacker.isAttacking = true;
        attacker.attackType = type;
        attacker.attackCooldown = cooldown;

        // حساب المسافة والإصابة
        const dist = Math.hypot(attacker.x - defender.x, attacker.z - defender.z);
        if (dist <= range) {
          applyDamage(defender, attacker, damage, type);
        } else {
          playImpactSound(type);
        }

        setTimeout(() => {
          attacker.isAttacking = false;
          attacker.attackType = null;
        }, cooldown * 1000);
      }

      // === تطبيق الضرر والحسابات ===
      function applyDamage(defender, attacker, rawDamage, type) {
        let finalDamage = rawDamage;

        if (defender.isBlocking) {
          finalDamage *= 0.2; // تقليل 80% من الضرر عند الدفاع
        }

        defender.hp = Math.max(0, defender.hp - finalDamage);
        defender.flashTimer = 0.15;

        // شحن طاقة الخاص (Energy Gain)
        attacker.energy = Math.min(MAX_ENERGY, attacker.energy + 15);
        if (attacker === fightersRef.current.p1) setP1Energy(attacker.energy);
        else setP2Energy(attacker.energy);

        // تحديث شريط الصحة
        if (defender === fightersRef.current.p1) setP1Hp(defender.hp);
        else setP2Hp(defender.hp);

        playImpactSound(type);

        // التحقق من انتهاء الجولة
        if (defender.hp <= 0) {
          endRound(attacker === fightersRef.current.p1 ? "p1" : "p2");
        }
      }

      // === انتهاء وقت الجولة ===
      function handleTimeOut() {
        const p1 = fightersRef.current.p1;
        const p2 = fightersRef.current.p2;

        if (p1.hp > p2.hp) endRound("p1");
        else if (p2.hp > p1.hp) endRound("p2");
        else endRound("draw");
      }

      // === نهاية الجولة ===
      function endRound(winner) {
        setGameState("ROUND_OVER");

        let banner = "";
        let newP1Wins = p1Wins;
        let newP2Wins = p2Wins;

        if (winner === "p1") {
          banner = "اللاعب الأول فاز بالراوند!";
          newP1Wins += 1;
          setP1Wins(newP1Wins);
        } else if (winner === "p2") {
          banner = "اللاعب الثاني فاز بالراوند!";
          newP2Wins += 1;
          setP2Wins(newP2Wins);
        } else {
          banner = "تعادل في هذه الجولة!";
        }

        setRoundBanner(banner);

        setTimeout(() => {
          checkMatch(newP1Wins, newP2Wins);
        }, 2000);
      }

      // === التحقق من الفائز بالمباراة ===
      function checkMatch(w1, w2) {
        if (w1 >= 2) {
          setWinnerText("اللاعب الأول هو بطل المعركة!");
          setGameState("MATCH_OVER");
        } else if (w2 >= 2) {
          setWinnerText("اللاعب الثاني هو بطل المعركة!");
          setGameState("MATCH_OVER");
        } else {
          resetRound();
          setGameState("PLAYING");
        }
      }

      // === إعادة ضبط الجولة ===
      function resetRound() {
        fightersRef.current.p1 = makeFighterState(-3.5, 0, 1);
        fightersRef.current.p2 = makeFighterState(3.5, 0, -1);
        setP1Hp(MAX_HEALTH);
        setP2Hp(MAX_HEALTH);
        setTimeLeft(ROUND_TIME_LIMIT);
        setRoundBanner("");
      }

      // === بدء لعبة جديدة بالكامل ===
      function startMatch() {
        if (bgMusicRef.current) {
          bgMusicRef.current.play();
        }
        setP1Wins(0);
        setP2Wins(0);
        setP1Energy(0);
        setP2Energy(0);
        resetRound();
        setGameState("PLAYING");
      }

      // === التحديثات البصرية للحركة والأنيميشن ===
      function updateVisuals(dt) {
        const meshes = meshesRef.current;
        const fighters = fightersRef.current;

        [["p1", fighters.p1], ["p2", fighters.p2]].forEach(([id, s]) => {
          const mesh = meshes[id];
          if (!mesh || !mesh.root) return;

          mesh.root.position.x = s.x;
          mesh.root.position.z = s.z;

          // تدوير الموديل بحسب الاتجاه
          const targetRotY = s.facingDir === 1 ? Math.PI / 2 : -Math.PI / 2;
          mesh.root.rotation.y = BABYLON.Scalar.Lerp(mesh.root.rotation.y, targetRotY, 0.2);

          // تطبيق الأنيميشن للنموذج GLB
          if (mesh.isModel) {
            const config = FIGHTER_MODELS[id];
            if (s.flashTimer > 0.05) playAnim(mesh, "hit", config, false);
            else if (s.isAttacking && s.attackType) playAnim(mesh, s.attackType, config, false);
            else if (s.isBlocking) playAnim(mesh, "block", config, true);
            else if (s.isMoving) playAnim(mesh, "walk", config, true);
            else playAnim(mesh, "idle", config, true);
          } else {
            // محاكاة حركة أذرع وأرجل للمجسمات البديلة
            if (s.arm) {
              if (s.isAttacking) {
                s.arm.position.z = 0.9;
              } else {
                s.arm.position.z = 0.4 + Math.sin(s.animPhase) * 0.1;
              }
            }
          }
        });
      }

      // === ضبط الكاميرا الديناميكي ===
      function updateCamera() {
        const scene = sceneRef.current;
        if (!scene) return;
        const camera = scene.activeCamera;
        const p1 = fightersRef.current.p1;
        const p2 = fightersRef.current.p2;

        const midX = (p1.x + p2.x) / 2;
        const midZ = (p1.z + p2.z) / 2;
        const dist = Math.hypot(p1.x - p2.x, p1.z - p2.z);

        const targetCamX = midX;
        const targetCamZ = midZ - Math.max(8, dist * 1.2);
        const targetCamY = Math.max(3.5, dist * 0.35);

        camera.position.x = BABYLON.Scalar.Lerp(camera.position.x, targetCamX, 0.05);
        camera.position.y = BABYLON.Scalar.Lerp(camera.position.y, targetCamY, 0.05);
        camera.position.z = BABYLON.Scalar.Lerp(camera.position.z, targetCamZ, 0.05);

        camera.setTarget(new BABYLON.Vector3(midX, 1.2, midZ));
      }

      return (
        <div className="relative w-full h-full">
          {/* الكانفاس الخاص بـ Babylon */}
          <div id="canvas-container">
            <canvas ref={canvasRef} />
          </div>

          {/* واجهة المستخدم والتراكبات (HUD UI Layer) */}
          <div id="ui-layer" className="flex flex-col justify-between p-6">
            
            {/* شريط معلومات الصحة والجولات الأعلى */}
            <div className="flex justify-between items-start w-full max-w-5xl mx-auto">
              
              {/* اللاعب الأول */}
              <div className="w-5/12 bg-gray-900/80 p-4 rounded-xl border border-red-500/40 backdrop-blur-md shadow-lg">
                <div className="flex justify-between items-center mb-2">
                  <span className="text-red-400 font-bold text-lg">اللاعب 1</span>
                  <div className="flex gap-1">
                    {[...Array(2)].map((_, i) => (
                      <div key={i} className={`w-4 h-4 rounded-full border border-red-400 ${i < p1Wins ? 'bg-red-500' : 'bg-gray-700'}`} />
                    ))}
                  </div>
                </div>
                {/* شريط الصحة */}
                <div className="w-full bg-gray-800 h-5 rounded-full overflow-hidden border border-gray-700">
                  <div className="health-bar-fill bg-gradient-to-r from-red-600 to-red-400 h-full" style={{ width: `${(p1Hp / MAX_HEALTH) * 100}%` }} />
                </div>
                {/* شريط الطاقة الخاصة */}
                <div className="w-full bg-gray-800 h-2 rounded-full mt-2 overflow-hidden">
                  <div className="bg-yellow-400 h-full transition-all duration-200" style={{ width: `${(p1Energy / MAX_ENERGY) * 100}%` }} />
                </div>
              </div>

              {/* العداد الزمني */}
              <div className="flex flex-col items-center bg-gray-900/90 px-6 py-2 rounded-2xl border border-yellow-500/50 shadow-xl">
                <span className="text-yellow-400 text-3xl font-extrabold tracking-wider">{timeLeft}</span>
                <span className="text-xs text-gray-400 uppercase tracking-widest mt-1">TIME</span>
              </div>

              {/* اللاعب الثاني */}
              <div className="w-5/12 bg-gray-900/80 p-4 rounded-xl border border-blue-500/40 backdrop-blur-md shadow-lg">
                <div className="flex justify-between items-center mb-2">
                  <div className="flex gap-1">
                    {[...Array(2)].map((_, i) => (
                      <div key={i} className={`w-4 h-4 rounded-full border border-blue-400 ${i < p2Wins ? 'bg-blue-500' : 'bg-gray-700'}`} />
                    ))}
                  </div>
                  <span className="text-blue-400 font-bold text-lg">اللاعب 2</span>
                </div>
                {/* شريط الصحة */}
                <div className="w-full bg-gray-800 h-5 rounded-full overflow-hidden border border-gray-700 dir-ltr">
                  <div className="health-bar-fill bg-gradient-to-r from-blue-400 to-blue-600 h-full float-right" style={{ width: `${(p2Hp / MAX_HEALTH) * 100}%` }} />
                </div>
                {/* شريط الطاقة الخاصة */}
                <div className="w-full bg-gray-800 h-2 rounded-full mt-2 overflow-hidden dir-ltr">
                  <div className="bg-yellow-400 h-full transition-all duration-200 float-right" style={{ width: `${(p2Energy / MAX_ENERGY) * 100}%` }} />
                </div>
              </div>

            </div>

            {/* إشعار انتهاء الجولة وسط الشاشة */}
            {gameState === "ROUND_OVER" && (
              <div className="self-center bg-black/80 px-10 py-5 rounded-2xl border-2 border-yellow-400 backdrop-blur-md animate-bounce">
                <h2 className="text-yellow-400 text-3xl font-extrabold text-center">{roundBanner}</h2>
              </div>
            )}

            {/* شاشة البداية (Start Screen) */}
            {gameState === "START" && (
              <div className="absolute inset-0 bg-black/85 backdrop-blur-md flex flex-col justify-center items-center interactive z-50">
                <h1 className="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-yellow-400 to-blue-500 mb-6 tracking-wide">
                  قتال الساحة 3D
                </h1>
                
                <div className="grid grid-cols-2 gap-8 mb-8 text-white text-sm max-w-2xl bg-gray-900/60 p-6 rounded-2xl border border-gray-800">
                  <div className="space-y-2">
                    <h3 className="text-red-400 font-bold text-base border-b border-red-500/30 pb-1">اللاعب 1 (الأحمر)</h3>
                    <p>الحركة: <span className="text-yellow-300">W, A, S, D</span></p>
                    <p>لكمة: <span className="text-yellow-300">F</span> | ركلة: <span className="text-yellow-300">G</span></p>
                    <p>ضربة خاصة: <span className="text-yellow-300">H</span></p>
                    <p>دفاع / حماية: <span className="text-yellow-300">Shift أيسر</span></p>
                  </div>
                  <div className="space-y-2">
                    <h3 className="text-blue-400 font-bold text-base border-b border-blue-500/30 pb-1">اللاعب 2 (الأسود/الأساسي)</h3>
                    <p>الحركة: <span className="text-yellow-300">الأسهم</span></p>
                    <p>لكمة: <span className="text-yellow-300">Numpad 1 / J</span> | ركلة: <span className="text-yellow-300">Numpad 2 / K</span></p>
                    <p>ضربة خاصة: <span className="text-yellow-300">Numpad 3 / L</span></p>
                    <p>دفاع / حماية: <span className="text-yellow-300">Shift أيمن / Numpad 0</span></p>
                  </div>
                </div>

                <button
                  onClick={startMatch}
                  className="px-10 py-4 bg-gradient-to-r from-red-600 to-yellow-500 hover:from-red-500 hover:to-yellow-400 text-white font-extrabold text-xl rounded-full shadow-2xl transform hover:scale-105 transition-all cursor-pointer"
                >
                  ابدأ المعركة الآن
                </button>
              </div>
            )}

            {/* شاشة إعلان الفائز النهائي (Match Over Screen) */}
            {gameState === "MATCH_OVER" && (
              <div className="absolute inset-0 bg-black/90 backdrop-blur-md flex flex-col justify-center items-center interactive z-50">
                <h1 className="text-4xl font-extrabold text-yellow-400 mb-4 animate-pulse">{winnerText}</h1>
                <p className="text-gray-300 mb-8 text-lg">أفضل من 3 جولات</p>
                <button
                  onClick={startMatch}
                  className="px-8 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold text-lg rounded-xl shadow-lg transform hover:scale-105 transition-all cursor-pointer"
                >
                  إعادة اللعب
                </button>
              </div>
            )}

          </div>
        </div>
      );
    }

    // العرض في DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FightingGame />);
  </script>
</body>
</html>
