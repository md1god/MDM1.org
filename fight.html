<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة القتال - Fighting Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0a0c14;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            width: 1024px;
            height: 576px;
            background: #0d0f18;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            border: 2px solid #1e2538;
        }

        /* --- شريط النتيجة والعداد (HUD) --- */
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .player-bar {
            width: 40%;
            background: rgba(18, 22, 36, 0.85);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
        }

        .player-bar.p1 {
            border-color: rgba(239, 68, 68, 0.4);
        }

        .player-bar.p2 {
            border-color: rgba(59, 130, 246, 0.4);
        }

        .player-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            color: #ffffff;
            font-weight: bold;
            font-size: 16px;
        }

        .lives {
            display: flex;
            gap: 6px;
        }

        .life-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #374151;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .p1 .life-dot.active { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
        .p2 .life-dot.active { background: #3b82f6; box-shadow: 0 0 8px #3b82f6; }

        .health-bg {
            width: 100%;
            height: 16px;
            background: #1f2937;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .health-fill {
            height: 100%;
            width: 100%;
            transition: width 0.2s ease-out;
            border-radius: 8px;
        }

        .p1 .health-fill { background: linear-gradient(90deg, #dc2626, #ef4444); }
        .p2 .health-fill { background: linear-gradient(90deg, #2563eb, #3b82f6); }

        /* --- العداد المركزي --- */
        .timer-box {
            width: 70px;
            height: 65px;
            background: rgba(15, 20, 32, 0.9);
            border: 2px solid #fbbf24;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
        }

        .timer-val {
            color: #fbbf24;
            font-size: 26px;
            font-weight: 900;
            line-height: 1;
        }

        .timer-label {
            color: #9ca3af;
            font-size: 10px;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* --- الـ Canvas والحلَبة --- */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- شاشة النهاية والتحكم --- */
        .controls-hint {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            color: #6b7280;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 16px;
            border-radius: 20px;
            z-index: 10;
        }

        .game-over-modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 12, 20, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            backdrop-filter: blur(4px);
        }

        .game-over-modal h1 {
            color: #fff;
            font-size: 42px;
            margin-bottom: 10px;
        }

        .restart-btn {
            padding: 10px 24px;
            background: #fbbf24;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .restart-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- شريط النتيجة العلوي -->
        <div class="hud">
            <!-- اللاعب 2 (يمين القائمة / يسار الشاشة) -->
            <div class="player-bar p2">
                <div class="player-info">
                    <span>اللاعب 2</span>
                    <div class="lives">
                        <div class="life-dot active"></div>
                        <div class="life-dot active"></div>
                    </div>
                </div>
                <div class="health-bg">
                    <div class="health-fill" id="p2Health"></div>
                </div>
            </div>

            <!-- العداد -->
            <div class="timer-box">
                <div class="timer-val" id="timer">60</div>
                <div class="timer-label">TIME</div>
            </div>

            <!-- اللاعب 1 (يسار القائمة / يمين الشاشة) -->
            <div class="player-bar p1">
                <div class="player-info">
                    <div class="lives">
                        <div class="life-dot active"></div>
                        <div class="life-dot active"></div>
                    </div>
                    <span>اللاعب 1</span>
                </div>
                <div class="health-bg">
                    <div class="health-fill" id="p1Health"></div>
                </div>
            </div>
        </div>

        <!-- أزرار التوجيه المساعدة -->
        <div class="controls-hint">
            اللاعب 1: [A/D] حركة | [W] قفز | [Space] هجوم &nbsp;|&nbsp; اللاعب 2: [الأسهم] حركة | [Up] قفز | [Enter] هجوم
        </div>

        <!-- شاشة نهاية اللعبة -->
        <div class="game-over-modal" id="gameOverModal">
            <h1 id="winnerText">فاز اللاعب 1!</h1>
            <button class="restart-btn" onclick="resetGame()">إعادة اللعب</button>
        </div>

        <!-- منطقة الرسم -->
        <canvas id="gameCanvas" width="1024" height="576"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // --- صور الشخصيات المضمنة بصيغة SVG ---
        const svg1 = `<svg xmlns="http://www.w3.org/2000/svg" width="120" height="200" viewBox="0 0 120 200"><g id="body"><path d="M40 20 h40 v30 h-40 z" fill="#ff4d4d"/><circle cx="50" cy="32" r="4" fill="#fff"/><circle cx="70" cy="32" r="4" fill="#fff"/><rect x="30" y="50" width="60" height="80" rx="8" fill="#e60000"/><rect x="45" y="50" width="30" height="80" fill="#1a1a1a"/><rect x="10" y="60" width="20" height="60" rx="6" fill="#ff4d4d"/><rect x="90" y="60" width="20" height="60" rx="6" fill="#ff4d4d"/><rect x="32" y="130" width="24" height="60" rx="5" fill="#2a2a2a"/><rect x="64" y="130" width="24" height="60" rx="5" fill="#2a2a2a"/><rect x="25" y="180" width="30" height="15" rx="3" fill="#ff4d4d"/><rect x="65" y="180" width="30" height="15" rx="3" fill="#ff4d4d"/><rect x="35" y="120" width="50" height="12" fill="#ffd700"/></g></svg>`;
        const svg2 = `<svg xmlns="http://www.w3.org/2000/svg" width="120" height="200" viewBox="0 0 120 200"><g id="body"><path d="M40 20 h40 v30 h-40 z" fill="#3b82f6"/><circle cx="50" cy="32" r="4" fill="#fff"/><circle cx="70" cy="32" r="4" fill="#fff"/><rect x="30" y="50" width="60" height="80" rx="8" fill="#1d4ed8"/><rect x="45" y="50" width="30" height="80" fill="#1a1a1a"/><rect x="10" y="60" width="20" height="60" rx="6" fill="#3b82f6"/><rect x="90" y="60" width="20" height="60" rx="6" fill="#3b82f6"/><rect x="32" y="130" width="24" height="60" rx="5" fill="#2a2a2a"/><rect x="64" y="130" width="24" height="60" rx="5" fill="#2a2a2a"/><rect x="25" y="180" width="30" height="15" rx="3" fill="#3b82f6"/><rect x="65" y="180" width="30" height="15" rx="3" fill="#3b82f6"/><rect x="35" y="120" width="50" height="12" fill="#ffd700"/></g></svg>`;

        const p1Img = new Image();
        p1Img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg1);

        const p2Img = new Image();
        p2Img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg2);

        // --- الفيزيائيّات والإعدادات العامة ---
        const gravity = 0.7;
        const groundY = 430;

        class Fighter {
            constructor({ position, velocity, image, color, primaryColor, attackDirection, isPlayer1 }) {
                this.position = position;
                this.velocity = velocity;
                this.width = 75;
                this.height = 135;
                this.image = image;
                this.color = color;
                this.primaryColor = primaryColor || color;
                this.isPlayer1 = isPlayer1;
                this.health = 100;
                this.isGrounded = false;
                this.isAttacking = false;
                this.hitTimer = 0;
                this.attackDirection = attackDirection;
                this.attackBox = {
                    position: { x: this.position.x, y: this.position.y },
                    width: 90,
                    height: 50
                };
            }

            draw() {
                // رسم الشخصية بآمان وحماية من أخطاء التحميل
                let drawn = false;
                if (this.image && this.image.complete && this.image.naturalWidth !== 0) {
                    try {
                        ctx.drawImage(this.image, this.position.x, this.position.y, this.width, this.height);
                        drawn = true;
                    } catch (e) {
                        drawn = false;
                    }
                }

                // رسم احتياطي متجهي متكيف عند عدم جاهزية الصورة
                if (!drawn) {
                    this.drawProcedural();
                }

                // تأثير الضربة عند التلقي
                if (this.hitTimer > 0) {
                    this.hitTimer--;
                    ctx.save();
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.fillRect(this.position.x - 4, this.position.y - 4, this.width + 8, this.height + 8);
                    ctx.restore();
                }

                // رسم التأثير الهجومي عند الضغط على زر الضربة
                if (this.isAttacking) {
                    ctx.save();
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 12;
                    const attackX = this.attackDirection === 'right' 
                        ? this.position.x + this.width 
                        : this.position.x - this.attackBox.width;

                    ctx.fillRect(attackX, this.position.y + 30, this.attackBox.width, this.attackBox.height);
                    ctx.restore();
                }
            }

            drawProcedural() {
                const x = this.position.x;
                const y = this.position.y;
                const w = this.width;
                const h = this.height;
                const facingRight = this.attackDirection === 'right';

                ctx.save();

                // الظل
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(x + w / 2, y + h - 2, w / 2, 6, 0, 0, Math.PI * 2);
                ctx.fill();

                // الجسد
                ctx.fillStyle = this.primaryColor;
                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(x + 15, y + 35, w - 30, 55, 8);
                } else {
                    ctx.rect(x + 15, y + 35, w - 30, 55);
                }
                ctx.fill();

                // السترة
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(x + 24, y + 35, w - 48, 55);

                // الرأس
                ctx.fillStyle = this.isPlayer1 ? '#f87171' : '#60a5fa';
                ctx.beginPath();
                ctx.arc(x + w / 2, y + 20, 18, 0, Math.PI * 2);
                ctx.fill();

                // عِصابة الرأس
                ctx.fillStyle = this.primaryColor;
                ctx.fillRect(x + 10, y + 12, w - 20, 8);

                // العينان
                ctx.fillStyle = '#ffffff';
                const eyeX = facingRight ? x + w / 2 + 3 : x + w / 2 - 11;
                ctx.fillRect(eyeX, y + 18, 8, 5);

                // الحزام
                ctx.fillStyle = '#fbbf24';
                ctx.fillRect(x + 15, y + 85, w - 30, 8);

                // الساقان
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(x + 18, y + 93, 14, 32);
                ctx.fillRect(x + w - 32, y + 93, 14, 32);

                // الأحذية
                ctx.fillStyle = this.primaryColor;
                ctx.fillRect(x + 14, y + 120, 20, 15);
                ctx.fillRect(x + w - 34, y + 120, 20, 15);

                // الذراعان والقفازات
                ctx.fillStyle = this.primaryColor;
                if (this.isAttacking) {
                    const armX = facingRight ? x + w - 10 : x - 25;
                    ctx.fillRect(armX, y + 42, 35, 16);
                } else {
                    ctx.fillRect(x + 5, y + 45, 12, 28);
                    ctx.fillRect(x + w - 17, y + 45, 12, 28);
                }

                ctx.restore();
            }

            update() {
                this.draw();

                // تحديث موقع صندوق الضربة
                this.attackBox.position.x = this.attackDirection === 'right' 
                    ? this.position.x + this.width 
                    : this.position.x - this.attackBox.width;
                this.attackBox.position.y = this.position.y + 30;

                // تطبيق الحركة والجاذبية
                this.position.x += this.velocity.x;
                this.position.y += this.velocity.y;

                // حدود الأرضية
                if (this.position.y + this.height >= groundY) {
                    this.position.y = groundY - this.height;
                    this.velocity.y = 0;
                    this.isGrounded = true;
                } else {
                    this.velocity.y += gravity;
                    this.isGrounded = false;
                }

                // حدود الجدران
                if (this.position.x < 0) this.position.x = 0;
                if (this.position.x + this.width > canvas.width) this.position.x = canvas.width - this.width;
            }

            attack() {
                if (this.isAttacking) return;
                this.isAttacking = true;
                setTimeout(() => {
                    this.isAttacking = false;
                }, 150);
            }
        }

        // إنشاء كائنات اللاعبين
        const player1 = new Fighter({
            position: { x: 180, y: 100 },
            velocity: { x: 0, y: 0 },
            image: p1Img,
            color: '#ef4444',
            primaryColor: '#ef4444',
            attackDirection: 'right',
            isPlayer1: true
        });

        const player2 = new Fighter({
            position: { x: 770, y: 100 },
            velocity: { x: 0, y: 0 },
            image: p2Img,
            color: '#3b82f6',
            primaryColor: '#3b82f6',
            attackDirection: 'left',
            isPlayer1: false
        });

        // متابعة مفاتيح لوحة التحكم
        const keys = {
            a: { pressed: false },
            d: { pressed: false },
            ArrowLeft: { pressed: false },
            ArrowRight: { pressed: false }
        };

        // --- إدارة العداد وزمن المباراة ---
        let timer = 60;
        let timerInterval;

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timer > 0) {
                    timer--;
                    document.getElementById('timer').innerText = timer;
                } else {
                    endGameByTimer();
                }
            }, 1000);
        }

        // فحص الاصطدام والضربات
        function checkCollision(attacker, defender) {
            return (
                attacker.isAttacking &&
                attacker.attackBox.position.x < defender.position.x + defender.width &&
                attacker.attackBox.position.x + attacker.attackBox.width > defender.position.x &&
                attacker.attackBox.position.y < defender.position.y + defender.height &&
                attacker.attackBox.position.y + attacker.attackBox.height > defender.position.y
            );
        }

        let isGameOver = false;

        // الحلقة الرئيسية للعبة (Animation Loop)
        function animate() {
            if (isGameOver) return;
            requestAnimationFrame(animate);

            // رسم خلفية الحلَبة والأرضية
            ctx.fillStyle = '#0f1422';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // رسم خط الأرضية
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            ctx.fillStyle = '#334155';
            ctx.fillRect(0, groundY, canvas.width, 6);

            // تحديث موقع ورسم اللاعبين
            player1.update();
            player2.update();

            // إيقاف الحركة عند عدم الضغط
            player1.velocity.x = 0;
            player2.velocity.x = 0;

            // حراك اللاعب 1
            if (keys.a.pressed) player1.velocity.x = -5;
            if (keys.d.pressed) player1.velocity.x = 5;

            // حراك اللاعب 2
            if (keys.ArrowLeft.pressed) player2.velocity.x = -5;
            if (keys.ArrowRight.pressed) player2.velocity.x = 5;

            // اكتشاف الاصطدامات والضربات
            if (checkCollision(player1, player2)) {
                player1.isAttacking = false;
                player2.health = Math.max(0, player2.health - 12);
                player2.hitTimer = 8;
                document.getElementById('p2Health').style.width = player2.health + '%';
                if (player2.health <= 0) endGame('فاز اللاعب 1!');
            }

            if (checkCollision(player2, player1)) {
                player2.isAttacking = false;
                player1.health = Math.max(0, player1.health - 12);
                player1.hitTimer = 8;
                document.getElementById('p1Health').style.width = player1.health + '%';
                if (player1.health <= 0) endGame('فاز اللاعب 1!');
            }
        }

        // --- التحكم بضغطات اللوحة ---
        window.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            switch (e.code) {
                // التحكم باللاعب 1
                case 'KeyA': keys.a.pressed = true; break;
                case 'KeyD': keys.d.pressed = true; break;
                case 'KeyW': if (player1.isGrounded) player1.velocity.y = -15; break;
                case 'Space': player1.attack(); break;

                // التحكم باللاعب 2
                case 'ArrowLeft': keys.ArrowLeft.pressed = true; break;
                case 'ArrowRight': keys.ArrowRight.pressed = true; break;
                case 'ArrowUp': if (player2.isGrounded) player2.velocity.y = -15; break;
                case 'Enter': player2.attack(); break;
            }
        });

        window.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyA': keys.a.pressed = false; break;
                case 'KeyD': keys.d.pressed = false; break;
                case 'ArrowLeft': keys.ArrowLeft.pressed = false; break;
                case 'ArrowRight': keys.ArrowRight.pressed = false; break;
            }
        });

        function endGame(message) {
            isGameOver = true;
            clearInterval(timerInterval);
            document.getElementById('winnerText').innerText = message;
            document.getElementById('gameOverModal').style.display = 'flex';
        }

        function endGameByTimer() {
            if (player1.health > player2.health) endGame('فاز اللاعب 1 بالوقت!');
            else if (player2.health > player1.health) endGame('فاز اللاعب 2 بالوقت!');
            else endGame('تعادل!');
        }

        function resetGame() {
            player1.health = 100;
            player2.health = 100;
            player1.position = { x: 180, y: 100 };
            player2.position = { x: 770, y: 100 };
            document.getElementById('p1Health').style.width = '100%';
            document.getElementById('p2Health').style.width = '100%';
            timer = 60;
            document.getElementById('timer').innerText = timer;
            document.getElementById('gameOverModal').style.display = 'none';
            isGameOver = false;
            clearInterval(timerInterval);
            startTimer();
            animate();
        }

        // تشغيل اللعبة عند التحميل
        startTimer();
        animate();
    </script>
</body>
</html>
