name: Smoke test all apps
on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/**', 'scripts/smoke_app.js', 'scripts/smoke_all.js']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Playwright
        run: cd /tmp && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Smoke every app (offline, no JS errors, interactive elements)
        run: NODE_PATH=/tmp/node_modules node scripts/smoke_all.js
