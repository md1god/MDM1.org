name: IndexNow — multilingual sitemap refresh
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sitemap*.xml'
      - 'robots.txt'
      - 'mdm1-indexnow-2026.txt'
      - 'scripts/indexnow_sitemaps.py'
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Submit published URLs to IndexNow
        run: python3 scripts/indexnow_sitemaps.py
