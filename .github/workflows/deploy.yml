name: 🚀 Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: ✅ Checkout Repository
        uses: actions/checkout@v4

      - name: 🛡️ Block publishing broken titles/descriptions
        run: node scripts/check-page-quality.js

      - name: 🎮 Generate a landing page for every game (deployed copy only)
        run: python3 scripts/build_game_pages.py

      - name: 🧭 Add menu button and share card to every page (deployed copy only)
        run: python3 scripts/inject_menu_and_card.py --write

      - name: 🧹 Build a clean static artifact
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='docs/' \
            --exclude='README.md' \
            --exclude='CONTRIBUTING.md' \
            --exclude='_site/' \
            ./ _site/

      - name: 📦 Prepare Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: 🌐 Deploy
        id: deployment
        uses: actions/deploy-pages@v4
