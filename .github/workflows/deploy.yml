name: 🚀 Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: ✅ Checkout Repository
        uses: actions/checkout@v4

      - name: 🧭 Add menu button and share card to every page (deployed copy only)
        run: python3 scripts/inject_menu_and_card.py --write

      - name: 📦 Prepare Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # رفع كامل ملفات المستودع للنشر المباشر

      - name: 🌐 Deploy
        id: deployment
        uses: actions/deploy-pages@v4
