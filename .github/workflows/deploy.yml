name: 🚀 Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: ✅ Checkout Repository
        uses: actions/checkout@v4

      - name: 🧱 Generate SEO catalog and shared site shell
        run: |
          python3 scripts/generate_seo_catalog.py --write
          python3 scripts/generate_seo_catalog.py --check
          python3 scripts/inject_global_shell.py --write

      - name: 📦 Prepare Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # رفع كامل ملفات المستودع للنشر المباشر

      - name: 🌐 Deploy
        id: deployment
        uses: actions/deploy-pages@v4
