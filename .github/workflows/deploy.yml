name: 🚀 Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: ✅ Checkout Repository
        uses: actions/checkout@v7

      - name: 🛡️ Block publishing broken titles/descriptions
        run: node scripts/check-page-quality.js

      - name: 🎮 Generate a landing page for every game (deployed copy only)
        run: python3 scripts/build_game_pages.py

      - name: 🧭 Add menu button and share card to every page (deployed copy only)
        run: python3 scripts/inject_menu_and_card.py --write

      - name: 🔎 Verify logo card coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          missing = []
          for page in root.rglob('*.html'):
              if '.git' in page.parts or 'archive' in page.parts or 'node_modules' in page.parts:
                  continue
              if 'https://mdm1.org/images/og-card.jpg' not in page.read_text(encoding='utf-8'):
                  missing.append(str(page))
          if missing:
              raise SystemExit('logo card missing from: ' + ', '.join(missing[:20]))
          print(f'Logo card verified on {len(list(root.rglob("*.html")))} HTML files')
          PY

      - name: 🧹 Build a clean static artifact
        run: |
          rm -rf _site
          mkdir -p _site
          # Exclude legacy media kept in git for reference but not linked by any page or script.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='docs/' \
            --exclude='README.md' \
            --exclude='CONTRIBUTING.md' \
            --exclude='SECURITY.md' \
            --exclude='_site/' \
            --exclude='/scripts/' \
            --exclude='/supabase/' \
            --exclude='/archive/' \
            --exclude='/build-pages.js' \
            --exclude='/build-state.json' \
            --exclude='/*.opus' \
            --exclude='__pycache__/' \
            --exclude='*.bak' \
            --exclude='/audio/18.mp3' \
            --exclude='/audio/19.mp3' \
            --exclude='/images/dark-creature.png' \
            --exclude='/images/gold-coin-mdm.png' \
            --exclude='/images/hero-mountain.png' \
            --exclude='/images/hero.png' \
            --exclude='/images/img_global_team.png' \
            --exclude='/images/img_heaven_hell.png' \
            --exclude='/images/img_lone_walker.png' \
            --exclude='/images/img_mdm1_gate.png' \
            --exclude='/images/img_quran_egypt.png' \
            --exclude='/images/magic-book-cave.png' \
            --exclude='/images/md1$.png' \
            --exclude='/images/md111-token.png' \
            --exclude='/images/mdm1-assistant-orbit.png' \
            --exclude='/images/white-owl.png' \
            --exclude='/images/bridge-civilization.png' \
            --exclude='/images/icon_large.webp' \
            --exclude='/images/icon_medium.png' \
            --exclude='/images/bearer.webp' \
            --exclude='/images/confrontation.webp' \
            --exclude='/images/hero-eye.jpg' \
            --exclude='/images/android-chrome-192x192.png' \
            --exclude='/images/android-chrome-512x512.png' \
            --exclude='/images/icon_32.png' \
            --exclude='/images/icon_48.png' \
            --exclude='/images/md1usd-icon.svg' \
            ./ _site/
          # Pages' "syncing_files" step times out on very large artifacts, so report the size on every run.
          echo "Artifact size: $(du -sh _site | cut -f1) in $(find _site -type f | wc -l) files"
          
      - name: 🗂️ Flatten languages/ back to /{lang}/ (public URLs never change)
        run: |
          if [ -d _site/languages ]; then
            cp -a _site/languages/. _site/
            rm -rf _site/languages
          fi
          
      - name: 📦 Prepare Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: 🌐 Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
          error_count: 20
          reporting_interval: 15000
