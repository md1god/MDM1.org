name: Office decision policy tests
on:
  push:
    paths:
      - 'office/decision-policy.js'
      - 'office/conversation-intelligence.js'
      - 'office/standalone-*.part.js'
      - 'office/standalone.js'
      - 'office/index.html'
      - 'office/pwa.js'
      - 'office/sw.js'
      - 'tests/decision-policy.test.js'
      - 'tests/conversation-intelligence.test.js'
      - '.github/workflows/office-decision-policy-tests.yml'
  pull_request:
    paths:
      - 'office/decision-policy.js'
      - 'office/standalone-*.part.js'
      - 'office/standalone.js'
      - 'office/index.html'
      - 'office/pwa.js'
      - 'office/sw.js'
      - 'tests/decision-policy.test.js'
      - '.github/workflows/office-decision-policy-tests.yml'
jobs:
  office-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test office decision and conversation policies
        run: node --test tests/decision-policy.test.js tests/conversation-intelligence.test.js
      - name: Compile combined office runtime
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const parts = [
            'office/decision-policy.js',
            'office/conversation-intelligence.js',
            'office/standalone-core.part.js',
            'office/standalone-model.part.js',
            'office/standalone-domain.part.js',
            'office/standalone-api.part.js',
            'office/standalone-ui.part.js'
          ];
          const source = parts.map((file) => fs.readFileSync(file, 'utf8')).join('\n');
          new vm.Script(source, { filename: 'mdm1-office-combined.js' });
          console.log('Combined office runtime syntax is valid.');
          NODE

      - name: Verify service-worker cache version and policy asset
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const sw = fs.readFileSync('office/sw.js', 'utf8');
          const pwa = fs.readFileSync('office/pwa.js', 'utf8');
          const index = fs.readFileSync('office/index.html', 'utf8');
          const version = '20261128pwa37';
          if (!sw.includes("var VERSION = '" + version + "'")) throw new Error('Service worker version mismatch');
          if (!pwa.includes("var VERSION = '" + version + "'")) throw new Error('PWA loader version mismatch');
          if (!index.includes(version)) throw new Error('Index cache version mismatch');
          if (!sw.includes("'./decision-policy.js?v=' + VERSION")) throw new Error('Decision policy is missing from offline precache');
          if (!sw.includes("'./conversation-intelligence.js?v=' + VERSION")) throw new Error('Conversation intelligence is missing from offline precache');
          console.log('PWA cache version and offline decision-policy asset are aligned.');
          NODE
