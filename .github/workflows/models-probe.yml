name: Models API probe (diagnostic, manual)
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'runner label to test (the pipelines use ubuntu-26.04; try ubuntu-24.04 to see if GitHub Models answers there)'
        required: false
        default: 'ubuntu-26.04'
permissions:
  contents: read
  models: read
jobs:
  probe:
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 scripts/models_probe.py
