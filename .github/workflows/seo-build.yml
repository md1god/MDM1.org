name: Automated SEO and Site Builder

on:
  # التشغيل اليدوي فقط؛ لا يوجد مولد محتوى موثوق لتشغيله كل ساعة.
  workflow_dispatch: # يتيح التشغيل اليدوي من تبويب Actions في جيت هب

jobs:
  build-site:
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'

      - name: Install Dependencies (if package.json exists)
        run: |
          if [ -f "package.json" ]; then
            npm install
          fi

      - name: Run Build and SEO Script
        run: |
          if [ -f "scripts/build.js" ]; then
            node scripts/build.js
          elif [ -f "build.js" ]; then
            node build.js
          else
            echo "No build script found, skipping execution."
          fi

      - name: Commit and Push Generated Changes
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
        with:
          commit_message: "Automated hourly SEO and pages build"
          branch: main
          file_pattern: "*.html pages/*.html sitemap.xml css/*.css js/*.js"
