name: 🔄 Generate Pages Automatically
on:
  # صفحة واحدة يومياً مع بوابة الجودة، بدلاً من توقف المولد بالكامل.
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      scout_title:
        description: 'عنوان الصفحة المخصص من MD1 Scout'
        required: false
        type: string
      scout_description:
        description: 'وصف الصفحة المخصص'
        required: false
        type: string
      scout_body:
        description: 'نص الخطة المجهّل'
        required: false
        type: string
      scout_id:
        description: 'معرّف الفرصة المجهّل (يمنع نشر نفس الفرصة مرتين)'
        required: false
        type: string
      scout_translations:
        description: 'JSON: ترجمات الصفحة {en:{title,description,body},...}'
        required: false
        type: string

concurrency:
  group: generate-pages
  cancel-in-progress: false
jobs:
  generate-pages:
    runs-on: ubuntu-26.04

    permissions:
      contents: write
      actions: write   # lets the last step start deploy.yml (pushes made with GITHUB_TOKEN do not trigger it)

    steps:
      - name: ✅ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '18'

      - name: 📝 Generate New Page
        env:
          SCOUT_TITLE: ${{ inputs.scout_title }}
          SCOUT_DESCRIPTION: ${{ inputs.scout_description }}
          SCOUT_BODY: ${{ inputs.scout_body }}
          SCOUT_ID: ${{ inputs.scout_id }}
          SCOUT_TRANSLATIONS: ${{ inputs.scout_translations }}
        run: node build-pages.js

      - name: 📊 Check if Pages Changed
        id: check_changes
        run: |
          if git diff --quiet pages/ pages-registry.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Commit and Push
        id: push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "MD1 Bot"
          python3 scripts/descriptor_filter.py .
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "🆕 إضافة صفحة جديدة - $(date +%Y-%m-%d\ %H:%M:%S)"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # النشر بيتم في deploy.yml فقط (artifact نظيف + فحص الجودة + صفحات الألعاب + طبقة 3D).
      # كان هذا الـ workflow ينشر نسخة مختلفة بنفسه (المستودع كله) فيتعارض مع deploy.yml ويفشل بـ "Deployment cancelled".
      - name: 🚀 Trigger site deploy
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

      - name: 📢 Log Status
        run: |
          echo "✅ Workflow completed at $(date +%Y-%m-%d\ %H:%M:%S)"
          echo "📁 Pages directory: $(ls pages/ | wc -l) files"
          echo "📄 Last page: $(grep lastPageSlug build-state.json)"
