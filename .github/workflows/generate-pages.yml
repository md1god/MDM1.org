name: 🔄 Generate Pages Automatically
on:
  # التشغيل اليدوي فقط: الصفحات الآلية الرقيقة لا تُنشر يومياً حتى لا تضر SEO.
  workflow_dispatch:
    inputs:
      scout_title:
        description: 'عنوان الصفحة المخصص من MD1 Scout'
        required: false
        type: string
      scout_description:
        description: 'وصف الصفحة المخصص'
        required: false
        type: string
      scout_body:
        description: 'نص الخطة العربية المجهّل'
        required: false
        type: string
      scout_id:
        description: 'معرّف الفرصة المجهّل (يمنع نشر نفس الفرصة مرتين)'
        required: false
        type: string
      scout_translations:
        description: 'JSON: ترجمات الصفحة {en:{title,description,body},...}'
        required: false
        type: string

concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  generate-pages:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: ✅ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📝 Generate New Page
        env:
          SCOUT_TITLE: ${{ inputs.scout_title }}
          SCOUT_DESCRIPTION: ${{ inputs.scout_description }}
          SCOUT_BODY: ${{ inputs.scout_body }}
          SCOUT_ID: ${{ inputs.scout_id }}
          SCOUT_TRANSLATIONS: ${{ inputs.scout_translations }}
        run: node build-pages.js

      - name: 📊 Check if Pages Changed
        id: check_changes
        run: |
          if git diff --quiet pages/ pages-registry.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "MD1 Bot"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🆕 إضافة صفحة جديدة - $(date +%Y-%m-%d\ %H:%M:%S)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # هنا السر: النشر بيحصل داخل نفس التشغيلة، بعد التأكد إن الـ push خلص فعليًا،
      # فمفيش سباق بين توليد الصفحة والنشر — النشر دايمًا بياخد آخر نسخة فيها الصفحة الجديدة
      - name: 🧭 Add menu button and share card (deployed copy only, same as deploy.yml)
        run: python3 scripts/inject_menu_and_card.py --write

      - name: 📦 Prepare Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🌐 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 📢 Log Status
        run: |
          echo "✅ Workflow completed at $(date +%Y-%m-%d\ %H:%M:%S)"
          echo "📁 Pages directory: $(ls pages/ | wc -l) files"
          echo "📄 Last page: $(grep lastPageSlug build-state.json)"
