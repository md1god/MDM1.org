name: Weekly Supabase Security Verification

on:
  schedule:
    # Monday 07:00 UTC / 09:00 Africa/Cairo during standard time.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-security-weekly
  cancel-in-progress: false

jobs:
  verify:
    name: Apply migrations and verify RLS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Apply pending migrations and verify security
        id: verification
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e
          python3 scripts/apply_supabase_migrations.py --apply > supabase-verification.json 2>&1
          status=$?
          cat supabase-verification.json >> "$GITHUB_STEP_SUMMARY"
          echo "verification_exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload verification report
        if: always()
        # Pinned to the Node 24 runtime commit; the released v4/v5 tags still target Node 20.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: supabase-security-verification-${{ github.run_id }}
          path: supabase-verification.json
          if-no-files-found: error
          retention-days: 90

      - name: Fail if verification did not pass
        if: steps.verification.outcome == 'failure'
        run: |
          echo 'Supabase migration/RLS verification failed. Inspect the uploaded JSON report.' >&2
          exit 1
