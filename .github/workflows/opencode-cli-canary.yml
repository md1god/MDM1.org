name: OpenCode CLI canary (diagnostic, manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Plain run, then a run with every permission denied
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE }}
        run: |
          set +e
          npm install -g opencode-ai@1.19.4 >/tmp/npm.log 2>&1 || { tail -5 /tmp/npm.log; exit 1; }
          W=$(mktemp -d); cd "$W"
          echo "=== A: plain, no config change (reply test)"
          start=$(date +%s); timeout 120 opencode run -m opencode/big-pickle "Reply with the single word: pong" 2>&1 | tail -4; echo "exit=$? took=$(( $(date +%s)-start ))s"
          echo "=== B: every permission denied, file + shell request"
          start=$(date +%s)
          OPENCODE_CONFIG_CONTENT='{"permission":{"*":"deny"}}' timeout 120 opencode run -m opencode/big-pickle \
            "Create a file named canary.txt here containing yes, then run: touch canary-shell.txt. Then reply with the single word: done." 2>&1 | tail -15
          echo "exit=$? took=$(( $(date +%s)-start ))s"
          echo "files in work dir:"; ls -la "$W"
