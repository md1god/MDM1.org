name: Add app (from Scout)
on:
  workflow_dispatch:
    inputs:
      app_json:
        description: 'ready app spec (JSON) handed over by Scout'
        required: true
permissions:
  contents: write
  actions: write
concurrency:
  group: add-app
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate and write the app
        env:
          APP_JSON: ${{ inputs.app_json }}
        run: |
          set -o pipefail
          python3 scripts/add_app.py 2>&1 | tee /tmp/add_app.log
          if grep -q 'handed-over app rejected' /tmp/add_app.log; then
            echo "::error::$(grep 'handed-over app rejected' /tmp/add_app.log | head -1)"
            exit 1
          fi
      - name: Smoke test in a real browser (must load and click through without errors)
        run: |
          APP=$(ls -t apps/*.html | grep -v index.html | head -1)
          cd /tmp && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE" && NODE_PATH=/tmp/node_modules node scripts/smoke_app.js "$APP"
      - name: Commit, deploy, notify search engines
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_JSON: ${{ inputs.app_json }}
        run: |
          set -e
          gen() {
            python3 scripts/related_links.py
            python3 scripts/build_catalog.py
            python3 scripts/build_catalog_pages.py
            python3 scripts/descriptor_filter.py .
            node scripts/check-page-quality.js
            git add apps data sitemap-apps.xml robots.txt sitemap-catalog.xml catalog categories projects
          }
          git config user.name "MD1 Bot"; git config user.email "action@github.com"
          gen
          if git diff --cached --quiet; then echo "nothing to publish"; exit 1; fi
          git commit -m "App from Scout: $(date -u +%F)"
          git checkout -- .   # drop unstaged side effects of the quality filters: they are not part of this commit and block the rebase
          pushed=""
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=1; break; fi
            # Another workflow published at the same time and touched the same generated indexes
            # (apps/index.html, catalog/, data/apps.json). Never resolve those by hand: rebuild them on the newest main.
            echo "::warning::publish attempt $attempt collided with a concurrent publish; regenerating on the latest main"
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset -q --hard origin/main
            python3 scripts/add_app.py
            gen
            if git diff --cached --quiet; then echo "app already present on main"; pushed=1; break; fi
            git commit -m "App from Scout: $(date -u +%F)"
            git checkout -- .
            sleep $((attempt * 7))
          done
          [ -n "$pushed" ] || { echo "::error::could not publish after 4 attempts (concurrent publishes)"; exit 1; }
          gh workflow run deploy.yml
