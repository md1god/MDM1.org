name: Add app (from Scout)
on:
  workflow_dispatch:
    inputs:
      app_json:
        description: 'ready app spec (JSON) handed over by Scout'
        required: true
permissions:
  contents: write
  actions: write
concurrency:
  group: add-app
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and write the app
        env:
          APP_JSON: ${{ inputs.app_json }}
        run: python3 scripts/add_app.py
      - name: Smoke test in a real browser (must load and click through without errors)
        run: |
          APP=$(ls -t apps/*.html | grep -v index.html | head -1)
          cd /tmp && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE" && NODE_PATH=/tmp/node_modules node scripts/smoke_app.js "$APP"
      - name: Commit, deploy, notify search engines
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add apps data sitemap-apps.xml robots.txt
          if git diff --cached --quiet; then echo "nothing to publish"; exit 1; fi
          git config user.name "MD1 Bot"; git config user.email "action@github.com"
          git commit -m "App from Scout: $(date -u +%F)"
          git pull --rebase origin main && git push
          gh workflow run deploy.yml
