/* Layout: sticky top bar (name + language), grade switch, big subject tiles, one content panel below */
:root{
  --bg:#EEF6FF; --surface:#FFFFFF; --ink:#1D2B4F; --muted:#5A6A8C; --line:#D5E2F5;
  --coral:#FF6B4A; --sun:#FFC83D; --mint:#2BB58A; --violet:#7A5CFA; --sky:#2E8BFF;
  --on-color:#FFFFFF; --sun-ink:#4A3600;

  --font-display:'Baloo Bhaijaan 2','Cairo',system-ui,sans-serif;
  --font-body:'Cairo',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --on-color:#0F1A33; --sun-ink:#3A2B00;
  --sky-top:#1B2C5E; --sky-bot:#0F1A33; --grass:#2C7A4B; --grass2:#256A41; --cloud:#34477F;
  --p1:#3A2A3A; --p2:#1F3358; --p3:#1F4136; --p4:#32295C; --p5:#4A4020; color-scheme:dark}}
:root[data-theme="dark"]{

  --coral:#FF7F63; --sun:#FFD25E; --mint:#3CCB9E; --violet:#9A82FF; --sky:#5AA3FF;
  --on-color:#0F1A33; --sun-ink:#3A2B00;
  --sky-top:#1B2C5E; --sky-bot:#0F1A33; --grass:#2C7A4B; --grass2:#256A41; --cloud:#34477F;
  --p1:#3A2A3A; --p2:#1F3358; --p3:#1F4136; --p4:#32295C; --p5:#4A4020; color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.6;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:linear-gradient(var(--sky-top),var(--sky-bot) 420px);background-repeat:no-repeat}
.hero{position:relative;height:190px;margin-bottom:14px;border-radius:28px;overflow:hidden;background:linear-gradient(var(--sky-top),var(--sky-bot))}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero .bubble{position:absolute;top:18px;inset-inline-start:16px;max-width:55%;background:var(--surface);color:var(--ink);border-radius:20px;padding:10px 14px;font-family:var(--font-display);font-weight:800;font-size:1.15rem;line-height:1.3;box-shadow:0 4px 0 var(--line)}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.float,.bounce,.card.pop{animation:none}}
.bounce{display:inline-block;animation:float 2.4s ease-in-out infinite}
.wrap{max-width:760px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px}
h1{font-family:var(--font-display);font-weight:800;font-size:1.9rem;line-height:1.1;margin:0;text-wrap:balance}
.tag{color:var(--muted);margin:2px 0 0;font-size:.95rem}
.lang{display:flex;gap:4px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px}
.lang button{min-width:48px;min-height:40px;border-radius:999px;font-weight:700;padding:0 12px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.grades{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-block:4px 18px}
.grades button{min-height:56px;border-radius:18px;background:var(--surface);border:3px solid var(--line);font-family:var(--font-display);font-weight:800;font-size:1.15rem}
.grades button[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:124px;border-radius:30px 30px 30px 10px;padding:12px;
  color:var(--on-color);font-family:var(--font-display);font-weight:800;font-size:1.3rem;transition:transform .15s;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.tile .big{font-size:3.4rem;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.tile:nth-child(even){border-radius:30px 30px 10px 30px}
.tile:active{transform:scale(.96)}
.tile[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:3px}
.c-coral{background:var(--coral)} .c-sky{background:var(--sky)} .c-mint{background:var(--mint)} .c-violet{background:var(--violet)} .c-sun{background:var(--sun);color:var(--sun-ink)}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:20px}
.panel h2{font-family:var(--font-display);font-weight:800;font-size:1.5rem;margin:0 0 4px}
.hint{color:var(--muted);margin:0 0 16px;font-size:.95rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 6px 12px;border-radius:26px;background:var(--p1);border:0;box-shadow:0 5px 0 rgba(0,0,0,.12);min-width:0;transition:transform .12s}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.card:nth-child(5n+2){background:var(--p2)} .card:nth-child(5n+3){background:var(--p3)} .card:nth-child(5n+4){background:var(--p4)} .card:nth-child(5n+5){background:var(--p5)}
.card .pic{font-size:3.6rem;line-height:1.1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.12))}
.card .en{font-family:var(--font-display);font-weight:800;font-size:1.25rem;direction:ltr;text-align:center}
.card .tr{color:var(--muted);font-size:.9rem;text-align:center}
.card .sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--line)}
.card.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.08);border-color:var(--coral)}}
.sent{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border-radius:18px;background:var(--bg);border:2px solid var(--line);text-align:start;margin-bottom:10px}
.sent .pic{font-size:2rem}
.sent .en{font-family:var(--font-display);font-weight:800;font-size:1.25rem;direction:ltr;unicode-bidi:isolate}
.sent .tr{color:var(--muted);font-size:.95rem}
.sent .t{flex:1;min-width:0}
.list{display:flex;flex-direction:column}
.picker{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--bg);font-weight:700}
.chip[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:var(--on-color)}
.scene{display:grid;place-items:center;min-height:230px;border-radius:26px;font-size:6rem;margin-bottom:14px;letter-spacing:.05em;
  background:radial-gradient(130% 55% at 50% 118%,var(--grass) 60%,transparent 61%),radial-gradient(90px 90px at 85% 22%,var(--sun) 60%,transparent 62%),linear-gradient(var(--sky-top),var(--sky-bot));
  overflow:hidden;filter:drop-shadow(0 0 0 transparent)}
.scene span{display:inline-block;animation:float 2.6s ease-in-out infinite;text-shadow:0 6px 0 rgba(0,0,0,.12)}
.story p{font-size:1.2rem;margin:0 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:48px;padding:0 20px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700}
.btn.alt{background:var(--bg);color:var(--ink);border:2px solid var(--line)}
.btn[disabled]{opacity:.4;cursor:default}
.dots{color:var(--muted);font-weight:700;margin-inline:auto}
.vhead{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.vhead .pic{font-size:3rem;line-height:1}
.vtext{font-size:1.15rem;margin:0 0 12px}
.try{background:var(--bg);border-radius:16px;padding:12px 16px;border:2px dashed var(--line);margin:0 0 14px}
.note{color:var(--muted);font-size:.85rem;margin-top:22px;text-align:center}
.warn{background:var(--sun);color:var(--sun-ink);border-radius:14px;padding:10px 14px;margin-bottom:14px;font-weight:600}
</style>
</head>

 {id:'fasting',pic:'🌙',name:{ar:'الصيام',en:'Fasting'},trad:true,
  text:{
   ar:{islam:'في رمضان يصوم المسلمون الكبار من الفجر إلى المغرب، ثم يفطرون مع العائلة. الصغار يتعلمون ويساعدون.',
       christ:'المسيحيون يصومون في أيام وفترات خاصة مثل الصوم الكبير. يأكلون طعاماً أبسط أو يتركون شيئاً يحبونه ليقتربوا من الله.',
       jew:'في يوم الغفران (يوم كيبور) يصوم اليهود الكبار من غروب الشمس حتى مساء اليوم التالي ليطلبوا المغفرة ويبدؤوا من جديد.'},
   en:{islam:'In Ramadan, Muslims old enough fast from dawn to sunset, then break the fast with family. Children learn and help.',
       christ:'Christians fast on special days and seasons such as Lent. They eat simpler food or give up something they love to feel closer to God.',
       jew:'On Yom Kippur, Jewish adults fast from sunset until the next evening to ask forgiveness and start fresh.'}},
  tryit:{ar:'الأطفال لا يصومون صياماً كاملاً. اسأل أهلك كيف يمكنك أن تشارك بطريقتك.',en:'Children do not fast fully. Ask your family how you can join in your own way.'}}
];
var TRADS={islam:{ar:'الإسلام',en:'Islam'},christ:{ar:'المسيحية',en:'Christianity'},jew:{ar:'اليهودية',en:'Judaism'}};

var S={lang:'en',grade:1,tab:'letters',story:0,page:0,val:0,trad:'islam'};
S.lang=(navigator.language||'').toLowerCase().indexOf('ar')===0?'ar':'en';
try{var sv=JSON.parse(localStorage.getItem('kids-corner')||'{}');if(sv.lang)S.lang=sv.lang;if(sv.grade)S.grade=sv.grade;}catch(e){}
S.tab=TABS[S.grade][0];

function save(){try{localStorage.setItem('kids-corner',JSON.stringify({lang:S.lang,grade:S.grade}));}catch(e){}}
var $=function(id){return document.getElementById(id)};
function u(){return UI[S.lang]}
var VOICE={ar:'ar-EG',en:'en-US'};
function say(text,lang){
  var warn=document.querySelector('.warn');if(warn)warn.remove();
  try{
    if(!('speechSynthesis' in window))throw 0;
    speechSynthesis.cancel();
    var m=new SpeechSynthesisUtterance(text);m.lang=lang;m.rate=.85;
    var vs=speechSynthesis.getVoices();
    if(vs.length&&!vs.some(function(v){return v.lang.toLowerCase().indexOf(lang.slice(0,2))===0})) throw 0;
    speechSynthesis.speak(m);
  }catch(e){
    var d=document.createElement('div');d.className='warn';d.textContent=u().novoice;
    $('panel').prepend(d);
  }
}
function esc(s){return String(s).replace(/"/g,'&quot;')}
function card(pic,en,tr,sayText){
  return '<button class="card" data-say="'+esc(sayText||en)+'" data-sl="en-US">'+pic+'<span class="en">'+en+'</span>'+(tr?'<span class="tr">'+tr+'</span>':'')+'</button>';
}
var ar=function(){return S.lang==='ar'};

function renderHead(){
  document.documentElement.lang=S.lang;
  document.documentElement.dir=ar()?'rtl':'ltr';
  document.title=u().title;
  $('title').textContent=u().title;
  $('tagline').textContent=u().tag;
  $('bubble').textContent=u().hi;
  $('note').textContent=u().note;
  $('lang-ar').setAttribute('aria-pressed',ar());
  $('lang-en').setAttribute('aria-pressed',!ar());
  $('grades').innerHTML=[1,2].map(function(g){return '<button data-grade="'+g+'" aria-pressed="'+(S.grade===g)+'">'+u()['g'+g]+'</button>'}).join('');
  $('tiles').innerHTML=TABS[S.grade].map(function(t){
    return '<button class="tile '+TILE[t][1]+'" data-tab="'+t+'" aria-pressed="'+(S.tab===t)+'"><span class="big">'+TILE[t][0]+'</span>'+u().tabs[t]+'</button>';
  }).join('');
}
function head(t){return '<h2>'+u().tabs[t]+'</h2><p class="hint">'+u().tap+'</p>'}
function renderPanel(){
  var t=S.tab,h='';
  if(t==='letters'){
    h=head(t)+'<div class="cards">'+LETTERS.map(function(x){
      return card('<span class="pic">'+x[2]+'</span>',x[0]+' '+x[0].toLowerCase()+' - '+x[1],ar()?x[3]:'',x[0]+'. '+x[1]);
    }).join('')+'</div>';
  } else if(t==='numbers'||t==='numbers2'){
    var a=t==='numbers'?NUMS:NUMS2;
    h=head(t)+'<div class="cards">'+a.map(function(x){
      return card('<span class="pic">'+x[0]+'</span>',x[1],ar()?x[2]:'',x[1]);
    }).join('')+'</div>';
  } else if(t==='colors'){
    h=head(t)+'<div class="cards">'+COLORS.map(function(x){
      return card('<span class="sw" style="background:'+x[1]+'"></span>',x[0],ar()?x[2]:'',x[0]);
    }).join('')+'</div>';
  } else if(t==='days'){
    h=head(t)+'<div class="cards">'+DAYS.map(function(x){return card('<span class="pic">📅</span>',x[0],ar()?x[1]:'',x[0])}).join('')+'</div>';
  } else if(t==='sentences'){
    h=head(t)+'<div class="list">'+SENT.map(function(x){
      return '<button class="sent" data-say="'+esc(x[0])+'" data-sl="en-US"><span class="pic">'+x[2]+'</span><span class="t"><span class="en">'+x[0]+'</span>'+(ar()?'<br><span class="tr">'+x[1]+'</span>':'')+'</span><span aria-hidden="true">🔊</span></button>';
    }).join('')+'</div>';
  } else if(t==='stories'){
    var st=STORIES[S.story],pg=st.pages[S.page],L=S.lang;
    h='<h2>'+u().tabs.stories+'</h2><div class="picker">'+STORIES.map(function(s,i){
      return '<button class="chip" data-story="'+i+'" aria-pressed="'+(i===S.story)+'">'+s.icon+' '+s.title[L]+'</button>';
    }).join('')+'</div><div class="story"><div class="scene" aria-hidden="true"><span>'+pg.pic+'</span></div><p>'+pg[L]+'</p>'+
    '<div class="row"><button class="btn" data-read="1">🔊 '+u().listen+'</button>'+
    '<button class="btn alt" data-pg="-1"'+(S.page===0?' disabled':'')+'>'+u().prev+'</button>'+
    '<span class="dots">'+(S.page+1)+' / '+st.pages.length+'</span>'+
    '<button class="btn alt" data-pg="1"'+(S.page===st.pages.length-1?' disabled':'')+'>'+u().next+'</button></div></div>';
  } else if(t==='values'){
    var v=VALUES[S.val],L2=S.lang;
    var txt=v.trad?v.text[L2][S.trad]:v.text[L2];
    h='<h2>'+u().tabs.values+'</h2><div class="picker">'+VALUES.map(function(x,i){
      return '<button class="chip" data-val="'+i+'" aria-pressed="'+(i===S.val)+'">'+x.pic+' '+x.name[L2]+'</button>';
    }).join('')+'</div>';
    if(v.trad){
      h+='<div class="picker" role="group" aria-label="'+u().trad+'">'+Object.keys(TRADS).map(function(k){
        return '<button class="chip" data-trad="'+k+'" aria-pressed="'+(S.trad===k)+'">'+TRADS[k][L2]+'</button>';
      }).join('')+'</div>';
    }
    h+='<div class="vhead"><span class="pic">'+v.pic+'</span><h2 style="margin:0">'+v.name[L2]+'</h2></div><p class="vtext">'+txt+'</p>'+
       '<div class="try"><strong>'+u().tryIt+':</strong> '+v.tryit[L2]+'</div>'+
       '<button class="btn" data-readv="1">🔊 '+u().listen+'</button>';
  }
  $('panel').innerHTML=h;
}
function render(){renderHead();renderPanel()}

document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var d=b.dataset;
  if(b.id==='lang-ar'||b.id==='lang-en'){speechSynthesis&&speechSynthesis.cancel&&speechSynthesis.cancel();S.lang=b.id==='lang-ar'?'ar':'en';save();render();return}
  if(d.grade){S.grade=+d.grade;S.tab=TABS[S.grade][0];save();render();return}
  if(d.tab){S.tab=d.tab;render();return}
  if(d.story){S.story=+d.story;S.page=0;renderPanel();return}
  if(d.pg){S.page+=+d.pg;renderPanel();say(STORIES[S.story].pages[S.page][S.lang],VOICE[S.lang]);return}
  if(d.read){say(STORIES[S.story].pages[S.page][S.lang],VOICE[S.lang]);return}
  if(d.val){S.val=+d.val;renderPanel();return}
  if(d.trad){S.trad=d.trad;renderPanel();return}
  if(d.readv){var v=VALUES[S.val];say((v.trad?v.text[S.lang][S.trad]:v.text[S.lang]),VOICE[S.lang]);return}
  if(d.say){b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');say(d.say,d.sl)}
});
if('speechSynthesis' in window){speechSynthesis.getVoices();}
render();
})();
</script>
</body>
</html>
